<svg xmlns="http://www.w3.org/2000/svg" width="720" height="468" viewBox="0 0 720 468" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>An AI answer with a citation on every claim, and a no-answer state</title>
  <rect x="0" y="0" width="720" height="468" rx="6" fill="#ffffff"/>
  <!-- supported answer -->
  <text x="24" y="28" font-size="13" fill="#1f2937" font-weight="bold">A supported answer</text>
  <rect x="24" y="40" width="352" height="330" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="40" y="64" font-size="11" fill="#4f46e5" font-weight="bold">PayFlow Assist</text>
  <rect x="248" y="48" width="112" height="22" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
  <text x="304.0" y="63" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">Draft for Sam</text>
  <text x="40" y="90" font-size="13" fill="#1f2937" font-weight="bold">Why is payout PO-8850 delayed?</text>
  <text x="40" y="116" font-size="12" fill="#1f2937">The payout is on hold because the bank account</text>
  <text x="40" y="133" font-size="12" fill="#1f2937">ending 5506 is not verified yet.</text>
  <rect x="214.26624" y="121" width="18" height="16" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="223.26624" y="133" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">1</text>
  <text x="40" y="154" font-size="12" fill="#1f2937">The account was added on Oct 12, and verification</text>
  <text x="40" y="171" font-size="12" fill="#1f2937">started that day.</text>
  <rect x="134.49408" y="159" width="18" height="16" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="143.49408" y="171" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">2</text>
  <text x="40" y="192" font-size="12" fill="#1f2937">Verification usually takes up to 2 business days.</text>
  <rect x="309.97536" y="180" width="18" height="16" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="318.97536" y="192" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">3</text>
  <rect x="36" y="211" width="328" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="231" font-size="11" fill="#6b7280" font-weight="bold">Sources</text>
  <rect x="48" y="237" width="18" height="16" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="57" y="249" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">1</text>
  <text x="74" y="249" font-size="11" fill="#1f2937">Payout record PO-8850 · updated 2 min ago</text>
  <rect x="48" y="255" width="18" height="16" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="57" y="267" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">2</text>
  <text x="74" y="267" font-size="11" fill="#1f2937">Bank verification log · Oct 12, 3:14 PM ET</text>
  <rect x="48" y="273" width="18" height="16" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="57" y="285" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">3</text>
  <text x="74" y="285" font-size="11" fill="#1f2937">Help article "Payout holds" · reviewed Sep 2026</text>
  <rect x="40" y="307" width="132" height="30" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="106.0" y="326.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Insert into reply</text>
  <rect x="182" y="307" width="128" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="246.0" y="326.0" font-size="12" fill="#1f2937" text-anchor="middle">Report a problem</text>
  <circle cx="376" cy="112" r="10" fill="#4f46e5"/>
  <text x="376" y="116" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="376" cy="245" r="10" fill="#4f46e5"/>
  <text x="376" y="249" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="376" cy="58" r="10" fill="#4f46e5"/>
  <text x="376" y="62" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <!-- no supported answer -->
  <text x="400" y="28" font-size="13" fill="#1f2937" font-weight="bold">No supported answer</text>
  <rect x="400" y="40" width="296" height="330" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="416" y="64" font-size="11" fill="#4f46e5" font-weight="bold">PayFlow Assist</text>
  <text x="416" y="90" font-size="13" fill="#1f2937" font-weight="bold">Will it arrive by Friday?</text>
  <rect x="412" y="104" width="272" height="84" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="424" y="126" font-size="13" fill="#b45309" font-weight="bold">No supported answer found</text>
  <text x="424" y="146" font-size="12" fill="#1f2937">No source gives an arrival date for PO-8850,</text>
  <text x="424" y="163" font-size="12" fill="#1f2937">so I won't guess one.</text>
  <text x="416" y="214" font-size="11" fill="#6b7280" font-weight="bold">What the sources do say</text>
  <text x="416" y="236" font-size="12" fill="#1f2937">Verification usually takes up to 2 business</text>
  <text x="416" y="253" font-size="12" fill="#1f2937">days.</text>
  <rect x="450.8272" y="241" width="18" height="16" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="459.8272" y="253" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">3</text>
  <rect x="416" y="278" width="180" height="30" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="506.0" y="297.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Open verification status</text>
  <rect x="416" y="316" width="180" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="506.0" y="335.0" font-size="12" fill="#1f2937" text-anchor="middle">Ask the payouts team</text>
  <circle cx="696" cy="122" r="10" fill="#4f46e5"/>
  <text x="696" y="126" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <circle cx="696" cy="292" r="10" fill="#4f46e5"/>
  <text x="696" y="296" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <!-- legend -->
  <circle cx="34" cy="392" r="10" fill="#4f46e5"/>
  <text x="34" y="396" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="52" y="396" font-size="11" fill="#1f2937">Every claim carries its own citation.</text>
  <circle cx="34" cy="413" r="10" fill="#4f46e5"/>
  <text x="34" y="417" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="52" y="417" font-size="11" fill="#1f2937">Each source shows how fresh it is.</text>
  <circle cx="34" cy="434" r="10" fill="#4f46e5"/>
  <text x="34" y="438" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="52" y="438" font-size="11" fill="#1f2937">It is a draft. Sam decides what the merchant sees.</text>
  <circle cx="410" cy="392" r="10" fill="#4f46e5"/>
  <text x="410" y="396" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="428" y="396" font-size="11" fill="#1f2937">With nothing to cite, it says so and does not guess.</text>
  <circle cx="410" cy="413" r="10" fill="#4f46e5"/>
  <text x="410" y="417" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <text x="428" y="417" font-size="11" fill="#1f2937">It still offers what it knows and a next step.</text>
</svg>
