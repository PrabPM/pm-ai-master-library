<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A transfer status screen driven by a state machine</title>
  <rect x="0" y="0" width="720" height="404" rx="6" fill="#ffffff"/>
  <!-- screen -->
  <rect x="24" y="16" width="424" height="372" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="44" y="46" font-size="14" fill="#1f2937" font-weight="bold">Transfer to Cascade Textiles LLC</text>
  <text x="44" y="66" font-size="12" fill="#6b7280">$12,450.00 USD · account ending 1842</text>
  <rect x="342" y="30" width="90" height="22" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="387.0" y="45" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">Processing</text>
  <line x1="24" y1="82" x2="448" y2="82" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="62" y1="112" x2="62" y2="318" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="62" cy="112" r="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <path d="M57 112 l3 3 l6 -7" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="86" y="117" font-size="13" fill="#1f2937" font-weight="bold">Submitted</text>
  <text x="86" y="135" font-size="11" fill="#6b7280">Oct 14, 9:02 AM ET, by Daniel Reyes</text>
  <circle cx="62" cy="166" r="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <path d="M57 166 l3 3 l6 -7" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="86" y="171" font-size="13" fill="#1f2937" font-weight="bold">Authorized</text>
  <text x="86" y="189" font-size="11" fill="#6b7280">Oct 14, 9:02 AM ET. $12,450.00 reserved</text>
  <text x="86" y="204" font-size="11" fill="#6b7280">from your balance.</text>
  <circle cx="62" cy="234" r="10" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="86" y="239" font-size="13" fill="#4f46e5" font-weight="bold">Processing</text>
  <text x="86" y="257" font-size="11" fill="#1f2937">Sent to the bank. This step usually takes</text>
  <text x="86" y="272" font-size="11" fill="#1f2937">1 business day. It can no longer be canceled.</text>
  <circle cx="62" cy="318" r="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="86" y="323" font-size="13" fill="#6b7280" font-weight="bold">Settled</text>
  <text x="86" y="341" font-size="11" fill="#6b7280">Expected Oct 15. We'll email you when the</text>
  <text x="86" y="356" font-size="11" fill="#6b7280">bank confirms.</text>
  <circle cx="196" cy="108" r="10" fill="#4f46e5"/>
  <text x="196" y="112" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="366" cy="234" r="10" fill="#4f46e5"/>
  <text x="366" y="238" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="366" cy="318" r="10" fill="#4f46e5"/>
  <text x="366" y="322" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <!-- other endings -->
  <rect x="468" y="16" width="228" height="202" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="482" y="40" font-size="13" fill="#1f2937" font-weight="bold">Other ways it can end</text>
  <rect x="482" y="52" width="58" height="22" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="511.0" y="67" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold">Failed</text>
  <text x="482" y="92" font-size="11" fill="#1f2937">The bank rejected it. The money is</text>
  <text x="482" y="107" font-size="11" fill="#1f2937">back in your balance, with the reason</text>
  <text x="482" y="122" font-size="11" fill="#1f2937">and a fix.</text>
  <rect x="482" y="140" width="74" height="22" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="519.0" y="155" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold">Reversed</text>
  <text x="482" y="180" font-size="11" fill="#1f2937">The bank sent it back after settlement.</text>
  <text x="482" y="195" font-size="11" fill="#1f2937">A new ledger entry returns the funds.</text>
  <!-- legend -->
  <circle cx="478" cy="240" r="10" fill="#4f46e5"/>
  <text x="478" y="244" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="496" y="244" font-size="11" fill="#1f2937">One word per state: the same word in</text>
  <text x="496" y="259" font-size="11" fill="#1f2937">the API, the ledger, and support</text>
  <text x="496" y="274" font-size="11" fill="#1f2937">replies.</text>
  <circle cx="478" cy="291" r="10" fill="#4f46e5"/>
  <text x="478" y="295" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="496" y="295" font-size="11" fill="#1f2937">The current step says what is</text>
  <text x="496" y="310" font-size="11" fill="#1f2937">happening and what you can still do.</text>
  <circle cx="478" cy="327" r="10" fill="#4f46e5"/>
  <text x="478" y="331" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="496" y="331" font-size="11" fill="#1f2937">A future step is an expectation, not a</text>
  <text x="496" y="346" font-size="11" fill="#1f2937">promise.</text>
</svg>
