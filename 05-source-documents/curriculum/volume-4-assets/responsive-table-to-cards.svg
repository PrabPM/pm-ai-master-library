<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A payouts table on a wide screen becoming cards on a phone</title>
  <rect x="0" y="0" width="720" height="372" rx="6" fill="#ffffff"/>
  <text x="24" y="30" font-size="13" fill="#1f2937" font-weight="bold">Wide screen: a table</text>
  <rect x="24" y="42" width="440" height="150" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="26" y="44" width="436" height="28" rx="6" fill="#f8fafc"/>
  <line x1="24" y1="73" x2="464" y2="73" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="62" font-size="11" fill="#6b7280" font-weight="bold">Payout</text>
  <text x="118" y="62" font-size="11" fill="#6b7280" font-weight="bold">Arrives</text>
  <text x="186" y="62" font-size="11" fill="#6b7280" font-weight="bold">Status</text>
  <text x="366" y="62" font-size="11" fill="#6b7280" text-anchor="end" font-weight="bold">Gross</text>
  <text x="452" y="62" font-size="11" fill="#6b7280" text-anchor="end" font-weight="bold">Net</text>
  <text x="38" y="96" font-size="12" fill="#1f2937">PO-8841</text>
  <text x="118" y="96" font-size="12" fill="#1f2937">Oct 14</text>
  <rect x="186" y="81" width="78" height="22" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="225.0" y="96" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">In transit</text>
  <text x="366" y="96" font-size="12" fill="#6b7280" text-anchor="end">$18,420.00</text>
  <text x="452" y="96" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">$16,969.12</text>
  <line x1="24" y1="112" x2="464" y2="112" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="134" font-size="12" fill="#1f2937">PO-8829</text>
  <text x="118" y="134" font-size="12" fill="#1f2937">Oct 13</text>
  <rect x="186" y="119" width="46" height="22" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="209.0" y="134" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">Paid</text>
  <text x="366" y="134" font-size="12" fill="#6b7280" text-anchor="end">$9,310.40</text>
  <text x="452" y="134" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">$9,031.19</text>
  <line x1="24" y1="150" x2="464" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="172" font-size="12" fill="#1f2937">PO-8817</text>
  <text x="118" y="172" font-size="12" fill="#1f2937">Oct 9</text>
  <rect x="186" y="157" width="46" height="22" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="209.0" y="172" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">Paid</text>
  <text x="366" y="172" font-size="12" fill="#6b7280" text-anchor="end">$12,077.00</text>
  <text x="452" y="172" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">$11,714.35</text>
  <circle cx="410" cy="42" r="10" fill="#4f46e5"/>
  <text x="410" y="46" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="318" cy="42" r="10" fill="#4f46e5"/>
  <text x="318" y="46" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <line x1="470" y1="116" x2="498" y2="116" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="498.0,116.0 491.1,120.1 491.1,111.9" fill="#1f2937"/>
  <!-- phone -->
  <text x="508" y="30" font-size="13" fill="#1f2937" font-weight="bold">Phone: cards</text>
  <rect x="508" y="42" width="188" height="316" rx="6" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="520" y="54" width="164" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="532" y="80" font-size="14" fill="#1f2937" font-weight="bold">$16,969.12</text>
  <rect x="532" y="90" width="78" height="22" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="571.0" y="105" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">In transit</text>
  <text x="532" y="132" font-size="11" fill="#6b7280">PO-8841 · Oct 14</text>
  <text x="672" y="132" font-size="11" fill="#4f46e5" text-anchor="end">Details</text>
  <rect x="520" y="154" width="164" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="532" y="180" font-size="14" fill="#1f2937" font-weight="bold">$9,031.19</text>
  <rect x="532" y="190" width="46" height="22" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="555.0" y="205" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">Paid</text>
  <text x="532" y="232" font-size="11" fill="#6b7280">PO-8829 · Oct 13</text>
  <text x="672" y="232" font-size="11" fill="#4f46e5" text-anchor="end">Details</text>
  <rect x="520" y="254" width="164" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="532" y="280" font-size="14" fill="#1f2937" font-weight="bold">$11,714.35</text>
  <rect x="532" y="290" width="46" height="22" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="555.0" y="305" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">Paid</text>
  <text x="532" y="332" font-size="11" fill="#6b7280">PO-8817 · Oct 9</text>
  <text x="672" y="332" font-size="11" fill="#4f46e5" text-anchor="end">Details</text>
  <circle cx="684" cy="68" r="10" fill="#4f46e5"/>
  <text x="684" y="72" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="684" cy="144" r="10" fill="#4f46e5"/>
  <text x="684" y="148" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="520" cy="254" r="10" fill="#4f46e5"/>
  <text x="520" y="258" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <!-- legend -->
  <circle cx="34" cy="218" r="10" fill="#4f46e5"/>
  <text x="34" y="222" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="52" y="222" font-size="11" fill="#1f2937">Net, status, and date stay. They answer "how much, and when?"</text>
  <circle cx="34" cy="243" r="10" fill="#4f46e5"/>
  <text x="34" y="247" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="52" y="247" font-size="11" fill="#1f2937">Gross moves behind Details, one tap away. Nothing is deleted.</text>
  <circle cx="34" cy="268" r="10" fill="#4f46e5"/>
  <text x="34" y="272" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="52" y="272" font-size="11" fill="#1f2937">The whole card is one large tap target, not five small links.</text>
  <text x="24" y="322" font-size="12" fill="#6b7280" font-style="italic">Decide the priority columns before you pick a breakpoint.</text>
</svg>
