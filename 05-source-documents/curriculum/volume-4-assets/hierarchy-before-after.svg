<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A payout page before and after applying visual hierarchy</title>
  <rect x="0" y="0" width="720" height="440" rx="6" fill="#ffffff"/>
  <rect x="24" y="14" width="70" height="22" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="59.0" y="29" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">Before</text>
  <rect x="372" y="14" width="62" height="22" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="403.0" y="29" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">After</text>
  <!-- before -->
  <rect x="24" y="46" width="324" height="296" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="40" y="70" font-size="12" fill="#1f2937">Payout details</text>
  <text x="40" y="92" font-size="12" fill="#1f2937">Payout ID: PO-8841</text>
  <text x="40" y="112" font-size="12" fill="#1f2937">Status: IN_TRANSIT</text>
  <text x="40" y="132" font-size="12" fill="#1f2937">Created: 2026-10-12T23:59:00Z</text>
  <text x="40" y="152" font-size="12" fill="#1f2937">Gross: 18420</text>
  <text x="40" y="172" font-size="12" fill="#1f2937">Fees: 598.38</text>
  <text x="40" y="192" font-size="12" fill="#1f2937">Refunds: 212.5</text>
  <text x="40" y="212" font-size="12" fill="#1f2937">Dispute hold: 640</text>
  <text x="40" y="232" font-size="12" fill="#1f2937">Net: 16969.12</text>
  <text x="40" y="252" font-size="12" fill="#1f2937">Arrival: 2026-10-14</text>
  <rect x="40" y="282" width="90" height="30" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="85.0" y="301.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Export</text>
  <rect x="138" y="282" width="90" height="30" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="183.0" y="301.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Retry</text>
  <rect x="236" y="282" width="90" height="30" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="281.0" y="301.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Help</text>
  <text x="40" y="332" font-size="11" fill="#b91c1c" font-weight="bold">Nine equal lines. Three equal buttons.</text>
  <!-- after -->
  <rect x="372" y="46" width="324" height="296" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="388" y="70" font-size="12" fill="#6b7280">Payout PO-8841</text>
  <text x="388" y="96" font-size="16" fill="#1f2937" font-weight="bold">$16,969.12</text>
  <rect x="566" y="78" width="116" height="22" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="624.0" y="93" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">Arriving Oct 14</text>
  <text x="388" y="116" font-size="11" fill="#6b7280">To your bank account ending 2290</text>
  <rect x="384" y="130" width="300" height="152" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="396" y="150" font-size="11" fill="#6b7280" font-weight="bold">How we got this number</text>
  <text x="396" y="172" font-size="12" fill="#1f2937">214 card payments</text>
  <text x="672" y="172" font-size="12" fill="#1f2937" text-anchor="end">$18,420.00</text>
  <text x="396" y="192" font-size="12" fill="#1f2937">PayFlow fees</text>
  <text x="672" y="192" font-size="12" fill="#1f2937" text-anchor="end">−$598.38</text>
  <text x="396" y="212" font-size="12" fill="#1f2937">3 refunds</text>
  <text x="672" y="212" font-size="12" fill="#1f2937" text-anchor="end">−$212.50</text>
  <text x="396" y="232" font-size="12" fill="#b45309">Dispute hold (DP-3307)</text>
  <text x="672" y="232" font-size="12" fill="#b45309" text-anchor="end">−$640.00</text>
  <line x1="396" y1="244" x2="672" y2="244" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="396" y="266" font-size="12" fill="#1f2937" font-weight="bold">Net payout</text>
  <text x="672" y="266" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">$16,969.12</text>
  <rect x="388" y="296" width="136" height="32" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="456.0" y="316.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Download report</text>
  <text x="540" y="316" font-size="12" fill="#4f46e5">Get help</text>
  <circle cx="372" cy="92" r="10" fill="#4f46e5"/>
  <text x="372" y="96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="696" cy="150" r="10" fill="#4f46e5"/>
  <text x="696" y="154" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="372" cy="232" r="10" fill="#4f46e5"/>
  <text x="372" y="236" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="372" cy="312" r="10" fill="#4f46e5"/>
  <text x="372" y="316" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <!-- legend -->
  <circle cx="34" cy="366" r="10" fill="#4f46e5"/>
  <text x="34" y="370" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="52" y="370" font-size="11" fill="#1f2937">The answer comes first: the amount and the arrival date.</text>
  <circle cx="34" cy="387" r="10" fill="#4f46e5"/>
  <text x="34" y="391" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="52" y="391" font-size="11" fill="#1f2937">Related numbers share one panel, right-aligned.</text>
  <circle cx="382" cy="366" r="10" fill="#4f46e5"/>
  <text x="382" y="370" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="400" y="370" font-size="11" fill="#1f2937">The lines that explain a gap say why, and one links to its</text>
  <text x="400" y="385" font-size="11" fill="#1f2937">dispute.</text>
  <circle cx="382" cy="402" r="10" fill="#4f46e5"/>
  <text x="382" y="406" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="400" y="406" font-size="11" fill="#1f2937">One primary button. Everything else is a quiet link.</text>
</svg>
