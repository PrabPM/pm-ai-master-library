<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>An error message before and after a rewrite</title>
  <rect x="0" y="0" width="720" height="392" rx="6" fill="#ffffff"/>
  <rect x="24" y="14" width="70" height="22" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="59.0" y="29" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">Before</text>
  <rect x="372" y="14" width="62" height="22" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="403.0" y="29" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">After</text>
  <!-- before -->
  <rect x="24" y="46" width="324" height="246" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="48" y="78" width="276" height="116" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="64" y="106" font-size="14" fill="#1f2937" font-weight="bold">Error 412</text>
  <text x="64" y="128" font-size="12" fill="#1f2937">Contact support.</text>
  <rect x="64" y="146" width="64" height="30" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="96.0" y="165.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">OK</text>
  <text x="48" y="222" font-size="11" fill="#b91c1c" font-weight="bold">Missing:</text>
  <text x="48" y="240" font-size="11" fill="#6b7280">what happened, why, where the money is,</text>
  <text x="48" y="255" font-size="11" fill="#6b7280">and what to do next.</text>
  <!-- after -->
  <rect x="372" y="46" width="324" height="246" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="390" y="58" width="294" height="222" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="410" y="84" font-size="14" fill="#1f2937" font-weight="bold">Your payout is on hold</text>
  <text x="410" y="106" font-size="11" fill="#1f2937">We're still verifying the bank account ending 5506</text>
  <text x="410" y="121" font-size="11" fill="#1f2937">that you added on Oct 12.</text>
  <text x="410" y="142" font-size="11" fill="#1f2937">Your $1,284.40 is safe in your PayFlow balance.</text>
  <text x="410" y="163" font-size="11" fill="#1f2937">We'll send it automatically when verification is</text>
  <text x="410" y="178" font-size="11" fill="#1f2937">done, usually within 2 business days.</text>
  <rect x="410" y="195" width="126" height="30" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="473.0" y="214.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">View verification</text>
  <text x="550" y="214" font-size="12" fill="#4f46e5">Contact support</text>
  <text x="410" y="247" font-size="11" fill="#6b7280">Reference PO-8850 · code 412</text>
  <circle cx="390" cy="80" r="10" fill="#4f46e5"/>
  <text x="390" y="84" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="390" cy="102" r="10" fill="#4f46e5"/>
  <text x="390" y="106" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="390" cy="138" r="10" fill="#4f46e5"/>
  <text x="390" y="142" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="390" cy="159" r="10" fill="#4f46e5"/>
  <text x="390" y="163" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <circle cx="390" cy="210" r="10" fill="#4f46e5"/>
  <text x="390" y="214" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <circle cx="390" cy="243" r="10" fill="#4f46e5"/>
  <text x="390" y="247" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
  <!-- legend -->
  <circle cx="34" cy="312" r="10" fill="#4f46e5"/>
  <text x="34" y="316" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="52" y="316" font-size="11" fill="#1f2937">Says what happened in plain words.</text>
  <circle cx="34" cy="333" r="10" fill="#4f46e5"/>
  <text x="34" y="337" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="52" y="337" font-size="11" fill="#1f2937">Gives the reason without blaming Maya.</text>
  <circle cx="34" cy="354" r="10" fill="#4f46e5"/>
  <text x="34" y="358" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="52" y="358" font-size="11" fill="#1f2937">Says where the money is right now.</text>
  <circle cx="382" cy="312" r="10" fill="#4f46e5"/>
  <text x="382" y="316" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="400" y="316" font-size="11" fill="#1f2937">Says what happens next, only as firmly as it knows.</text>
  <circle cx="382" cy="333" r="10" fill="#4f46e5"/>
  <text x="382" y="337" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <text x="400" y="337" font-size="11" fill="#1f2937">One main action, plus a way to reach a person.</text>
  <circle cx="382" cy="354" r="10" fill="#4f46e5"/>
  <text x="382" y="358" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
  <text x="400" y="358" font-size="11" fill="#1f2937">Keeps the code for support, but puts it last.</text>
</svg>
