<svg xmlns="http://www.w3.org/2000/svg" width="720" height="462" viewBox="0 0 720 462" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A bank account form before and after</title>
  <rect x="0" y="0" width="720" height="462" rx="6" fill="#ffffff"/>
  <rect x="24" y="14" width="70" height="22" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="59.0" y="29" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">Before</text>
  <rect x="372" y="14" width="62" height="22" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="403.0" y="29" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">After</text>
  <!-- before -->
  <rect x="24" y="46" width="324" height="318" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="74" font-size="14" fill="#1f2937" font-weight="bold">Add bank account</text>
  <rect x="40" y="90" width="142" height="30" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="50" y="109.0" font-size="12" fill="#6b7280">Name on account</text>
  <rect x="190" y="90" width="142" height="30" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="200" y="109.0" font-size="12" fill="#6b7280">Bank name</text>
  <rect x="40" y="132" width="142" height="30" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="50" y="151.0" font-size="12" fill="#6b7280">Routing number</text>
  <rect x="190" y="132" width="142" height="30" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="200" y="151.0" font-size="12" fill="#6b7280">Account number</text>
  <rect x="40" y="174" width="142" height="30" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="50" y="193.0" font-size="12" fill="#6b7280">Branch address</text>
  <rect x="190" y="174" width="142" height="30" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="200" y="193.0" font-size="12" fill="#6b7280">Account type</text>
  <rect x="40" y="226" width="142" height="30" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="111.0" y="245.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Reset</text>
  <rect x="190" y="226" width="142" height="30" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="261.0" y="245.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Submit</text>
  <circle cx="40" cy="90" r="10" fill="#b91c1c"/>
  <text x="40" y="94" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="182" cy="132" r="10" fill="#b91c1c"/>
  <text x="182" y="136" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="332" cy="174" r="10" fill="#b91c1c"/>
  <text x="332" y="178" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="182" cy="226" r="10" fill="#b91c1c"/>
  <text x="182" y="230" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <circle cx="50" cy="280" r="10" fill="#b91c1c"/>
  <text x="50" y="284" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="68" y="284" font-size="11" fill="#1f2937">Labels vanish as soon as you type.</text>
  <circle cx="50" cy="300" r="10" fill="#b91c1c"/>
  <text x="50" y="304" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="68" y="304" font-size="11" fill="#1f2937">A red border, but no words.</text>
  <circle cx="50" cy="320" r="10" fill="#b91c1c"/>
  <text x="50" y="324" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="68" y="324" font-size="11" fill="#1f2937">Asks for things the routing number tells us.</text>
  <circle cx="50" cy="340" r="10" fill="#b91c1c"/>
  <text x="50" y="344" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="68" y="344" font-size="11" fill="#1f2937">"Reset" has the same weight as "Submit".</text>
  <!-- after -->
  <rect x="372" y="46" width="324" height="318" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="388" y="74" font-size="14" fill="#1f2937" font-weight="bold">Add bank account</text>
  <text x="388" y="92" font-size="11" fill="#6b7280">We send your payouts to this account.</text>
  <text x="388" y="116" font-size="12" fill="#1f2937" font-weight="bold">Account holder name</text>
  <rect x="388" y="122" width="292" height="30" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="398" y="141.0" font-size="12" fill="#1f2937">Juniper Bakery LLC</text>
  <text x="388" y="174" font-size="12" fill="#1f2937" font-weight="bold">Routing number</text>
  <text x="498" y="174" font-size="11" fill="#6b7280">9 digits, bottom left of a check</text>
  <rect x="388" y="180" width="292" height="30" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="398" y="199.0" font-size="12" fill="#1f2937">02100002</text>
  <text x="388" y="226" font-size="11" fill="#b91c1c" font-weight="bold">Enter 9 digits. You entered 8.</text>
  <text x="388" y="252" font-size="12" fill="#1f2937" font-weight="bold">Account number</text>
  <rect x="388" y="258" width="292" height="30" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="388" y="310" font-size="12" fill="#1f2937" font-weight="bold">Account type</text>
  <circle cx="396" cy="332" r="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <circle cx="396" cy="332" r="3" fill="#4f46e5"/>
  <text x="408" y="336" font-size="12" fill="#1f2937">Checking</text>
  <circle cx="486" cy="332" r="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="498" y="336" font-size="12" fill="#1f2937">Savings</text>
  <rect x="560" y="316" width="120" height="32" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="620.0" y="336.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Save account</text>
  <circle cx="372" cy="112" r="10" fill="#4f46e5"/>
  <text x="372" y="116" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="696" cy="170" r="10" fill="#4f46e5"/>
  <text x="696" y="174" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="372" cy="222" r="10" fill="#4f46e5"/>
  <text x="372" y="226" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="696" cy="332" r="10" fill="#4f46e5"/>
  <text x="696" y="336" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <!-- legend -->
  <circle cx="34" cy="388" r="10" fill="#4f46e5"/>
  <text x="34" y="392" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="52" y="392" font-size="11" fill="#1f2937">Labels sit above the field and stay visible.</text>
  <circle cx="34" cy="409" r="10" fill="#4f46e5"/>
  <text x="34" y="413" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="52" y="413" font-size="11" fill="#1f2937">The hint gives the format before you type.</text>
  <circle cx="382" cy="388" r="10" fill="#4f46e5"/>
  <text x="382" y="392" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="400" y="392" font-size="11" fill="#1f2937">The error says what is wrong and how to fix it.</text>
  <circle cx="382" cy="409" r="10" fill="#4f46e5"/>
  <text x="382" y="413" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="400" y="413" font-size="11" fill="#1f2937">Four fields, one column, one named action.</text>
</svg>
