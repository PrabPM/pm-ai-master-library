<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>An approval card for an agent that wants to retry failed payouts</title>
  <rect x="0" y="0" width="720" height="470" rx="6" fill="#ffffff"/>
  <!-- card -->
  <rect x="24" y="16" width="460" height="438" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="40" y="30" width="124" height="22" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="102.0" y="45" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold">Approval needed</text>
  <text x="40" y="76" font-size="15" fill="#1f2937" font-weight="bold">Retry failed payouts</text>
  <text x="40" y="94" font-size="11" fill="#6b7280">Proposed by PayFlow Assist · requested by Omar Haddad</text>
  <line x1="40" y1="106" x2="468" y2="106" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="122" font-size="11" fill="#6b7280" font-weight="bold">Goal</text>
  <text x="118" y="122" font-size="12" fill="#1f2937">Retry the payouts that failed in batch PF-2026-10-08-09.</text>
  <line x1="40" y1="134" x2="468" y2="134" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="150" font-size="11" fill="#6b7280" font-weight="bold">Why</text>
  <text x="118" y="150" font-size="12" fill="#1f2937">Partner bank outage on Oct 8, 02:10 to 02:45 UTC. All 43</text>
  <text x="118" y="166" font-size="12" fill="#1f2937">failures carry the code BANK_UNAVAILABLE.</text>
  <line x1="40" y1="178" x2="468" y2="178" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="194" font-size="11" fill="#6b7280" font-weight="bold">Scope</text>
  <text x="118" y="194" font-size="12" fill="#1f2937">40 payouts · $61,930.25 in total · this batch only</text>
  <line x1="40" y1="206" x2="468" y2="206" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="222" font-size="11" fill="#6b7280" font-weight="bold">Excluded</text>
  <text x="118" y="222" font-size="12" fill="#1f2937">3 payouts whose accounts are under risk review</text>
  <line x1="40" y1="234" x2="468" y2="234" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="250" font-size="11" fill="#6b7280" font-weight="bold">Effect</text>
  <text x="118" y="250" font-size="12" fill="#1f2937">Creates 40 new payment attempts. A payout cannot be</text>
  <text x="118" y="266" font-size="12" fill="#1f2937">recalled once the bank accepts it.</text>
  <line x1="40" y1="278" x2="468" y2="278" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="294" font-size="11" fill="#6b7280" font-weight="bold">Tools</text>
  <text x="118" y="294" font-size="12" fill="#1f2937">Read payout status · Create retry batch</text>
  <line x1="40" y1="306" x2="468" y2="306" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="322" font-size="11" fill="#6b7280" font-weight="bold">Safeguard</text>
  <text x="118" y="322" font-size="12" fill="#1f2937">One idempotency key per payout, so none is sent twice</text>
  <line x1="40" y1="334" x2="468" y2="334" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="350" font-size="11" fill="#6b7280" font-weight="bold">Approval</text>
  <text x="118" y="350" font-size="12" fill="#1f2937">2 people required. Priya Nair approved at 9:41 AM ET. The</text>
  <text x="118" y="366" font-size="12" fill="#1f2937">requester cannot approve.</text>
  <line x1="40" y1="378" x2="468" y2="378" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="390" width="168" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="124.0" y="410.0" font-size="12" fill="#1f2937" text-anchor="middle">Review the 40 payouts</text>
  <rect x="300" y="390" width="80" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="340.0" y="410.0" font-size="12" fill="#1f2937" text-anchor="middle">Reject</text>
  <rect x="388" y="390" width="80" height="32" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="428.0" y="410.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Approve</text>
  <circle cx="484" cy="146" r="10" fill="#4f46e5"/>
  <text x="484" y="150" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="484" cy="190" r="10" fill="#4f46e5"/>
  <text x="484" y="194" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="484" cy="218" r="10" fill="#4f46e5"/>
  <text x="484" y="222" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="484" cy="246" r="10" fill="#4f46e5"/>
  <text x="484" y="250" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <circle cx="484" cy="290" r="10" fill="#4f46e5"/>
  <text x="484" y="294" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <circle cx="484" cy="346" r="10" fill="#4f46e5"/>
  <text x="484" y="350" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
  <!-- legend -->
  <circle cx="516" cy="36" r="10" fill="#4f46e5"/>
  <text x="516" y="40" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="534" y="40" font-size="11" fill="#1f2937">The reason comes with evidence</text>
  <text x="534" y="55" font-size="11" fill="#1f2937">a person can check.</text>
  <circle cx="516" cy="78" r="10" fill="#4f46e5"/>
  <text x="516" y="82" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="534" y="82" font-size="11" fill="#1f2937">Scope is exact: how many, how</text>
  <text x="534" y="97" font-size="11" fill="#1f2937">much, which batch.</text>
  <circle cx="516" cy="120" r="10" fill="#4f46e5"/>
  <text x="516" y="124" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="534" y="124" font-size="11" fill="#1f2937">What was left out is shown, not</text>
  <text x="534" y="139" font-size="11" fill="#1f2937">hidden.</text>
  <circle cx="516" cy="162" r="10" fill="#4f46e5"/>
  <text x="516" y="166" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="534" y="166" font-size="11" fill="#1f2937">The effect says what cannot be</text>
  <text x="534" y="181" font-size="11" fill="#1f2937">undone.</text>
  <circle cx="516" cy="204" r="10" fill="#4f46e5"/>
  <text x="516" y="208" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <text x="534" y="208" font-size="11" fill="#1f2937">The agent holds only the tools</text>
  <text x="534" y="223" font-size="11" fill="#1f2937">this job needs.</text>
  <circle cx="516" cy="246" r="10" fill="#4f46e5"/>
  <text x="516" y="250" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
  <text x="534" y="250" font-size="11" fill="#1f2937">Two people decide, and they can</text>
  <text x="534" y="265" font-size="11" fill="#1f2937">inspect the list first.</text>
</svg>
