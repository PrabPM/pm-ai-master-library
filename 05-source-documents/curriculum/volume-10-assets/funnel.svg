<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Onboarding funnel for merchants who started in August 2026</title>
  <rect x="0" y="0" width="720" height="380" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">August 2026 sign-ups: where merchants stop</text>
  <text x="188" y="70" font-size="12" fill="#1f2937" text-anchor="end">Started sign-up</text>
  <rect x="200" y="48" width="420" height="34" rx="6" fill="#4f46e5"/>
  <text x="630.0" y="70" font-size="13" fill="#1f2937" font-weight="bold">1,640</text>
  <text x="188" y="116" font-size="12" fill="#1f2937" text-anchor="end">Submitted KYB</text>
  <rect x="200" y="94" width="307" height="34" rx="6" fill="#4f46e5"/>
  <text x="516.5487804878048" y="116" font-size="13" fill="#1f2937" font-weight="bold">1,197</text>
  <text x="700" y="116" font-size="11" fill="#6b7280" text-anchor="end">73% of previous step</text>
  <text x="188" y="162" font-size="12" fill="#1f2937" text-anchor="end">KYB approved</text>
  <rect x="200" y="140" width="257" height="34" rx="6" fill="#4f46e5"/>
  <text x="467.3780487804878" y="162" font-size="13" fill="#1f2937" font-weight="bold">1,005</text>
  <text x="700" y="162" font-size="11" fill="#6b7280" text-anchor="end">84% of previous step</text>
  <text x="188" y="208" font-size="12" fill="#1f2937" text-anchor="end">First payment in 30 days</text>
  <rect x="200" y="186" width="131" height="34" rx="6" fill="#b91c1c"/>
  <text x="341.3780487804878" y="208" font-size="13" fill="#1f2937" font-weight="bold">513</text>
  <text x="700" y="208" font-size="11" fill="#b91c1c" text-anchor="end">51% of previous step</text>
  <line x1="24" y1="240" x2="696" y2="240" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="24" y="264" font-size="13" fill="#1f2937" font-weight="bold">The last step, split by how the merchant planned to take payments</text>
  <text x="188" y="301" font-size="12" fill="#1f2937" text-anchor="end">Payment links (no code)</text>
  <rect x="200" y="280" width="420" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="200" y="280" width="298" height="32" rx="6" fill="#15803d"/>
  <text x="630" y="301" font-size="13" fill="#1f2937" font-weight="bold">71%</text>
  <text x="210" y="301" font-size="11" fill="#ffffff">321 of 452 approved</text>
  <text x="188" y="345" font-size="12" fill="#1f2937" text-anchor="end">Plugin or API</text>
  <rect x="200" y="324" width="420" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="200" y="324" width="146" height="32" rx="6" fill="#b91c1c"/>
  <text x="630" y="345" font-size="13" fill="#1f2937" font-weight="bold">35%</text>
  <text x="210" y="345" font-size="11" fill="#ffffff">192 of 553 approved</text>
</svg>
