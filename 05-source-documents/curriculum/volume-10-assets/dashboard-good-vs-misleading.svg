<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A misleading dashboard next to a useful one</title>
  <rect x="0" y="0" width="720" height="480" rx="6" fill="#ffffff"/>
  <rect x="16" y="16" width="336" height="448" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="16" y="16" width="336" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="30" y="38" font-size="13" fill="#b91c1c" font-weight="bold">Misleading</text>
  <rect x="30" y="62" width="150" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="82" font-size="11" fill="#6b7280">Merchants signed up</text>
  <text x="42" y="108" font-size="16" fill="#1f2937" font-weight="bold">48,210</text>
  <text x="42" y="124" font-size="11" fill="#6b7280">all time, only goes up</text>
  <circle cx="172" cy="70" r="10" fill="#b91c1c"/>
  <text x="172" y="74" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <rect x="188" y="62" width="150" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="200" y="82" font-size="11" fill="#6b7280">Success rate</text>
  <text x="200" y="108" font-size="16" fill="#1f2937" font-weight="bold">91%</text>
  <text x="200" y="124" font-size="11" fill="#6b7280">of what? since when?</text>
  <circle cx="330" cy="70" r="10" fill="#b91c1c"/>
  <text x="330" y="74" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <rect x="30" y="142" width="308" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="162" font-size="11" fill="#6b7280">Weekly volume, $M</text>
  <text x="42" y="186" font-size="11" fill="#6b7280">18.0</text>
  <text x="42" y="276" font-size="11" fill="#6b7280">16.0</text>
  <path d="M78.0 216.8 L118.0 203.0 L158.0 207.6 L198.0 189.2 L238.0 184.6 L278.0 180.0 L318.0 262.8" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="330" cy="150" r="10" fill="#b91c1c"/>
  <text x="330" y="154" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="318" cy="258" r="10" fill="#b91c1c"/>
  <text x="318" y="262" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <circle cx="40" cy="314" r="10" fill="#b91c1c"/>
  <text x="40" y="318" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="58" y="318" font-size="11" fill="#1f2937">A running total cannot fall, so it cannot warn you.</text>
  <circle cx="40" cy="335" r="10" fill="#b91c1c"/>
  <text x="40" y="339" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="58" y="339" font-size="11" fill="#1f2937">No denominator, window or comparison.</text>
  <circle cx="40" cy="356" r="10" fill="#b91c1c"/>
  <text x="40" y="360" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="58" y="360" font-size="11" fill="#1f2937">Axis starts at 16, so a 10% dip looks like a collapse.</text>
  <circle cx="40" cy="377" r="10" fill="#b91c1c"/>
  <text x="40" y="381" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="58" y="381" font-size="11" fill="#1f2937">The last point is a partial week.</text>
  <rect x="368" y="16" width="336" height="448" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <rect x="368" y="16" width="336" height="34" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="382" y="38" font-size="13" fill="#15803d" font-weight="bold">Useful</text>
  <text x="690" y="38" font-size="11" fill="#6b7280" text-anchor="end">Complete weeks to Sun 4 Oct</text>
  <rect x="382" y="62" width="308" height="70" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="394" y="82" font-size="11" fill="#6b7280">North Star: weekly successful volume</text>
  <text x="394" y="108" font-size="16" fill="#1f2937" font-weight="bold">$16.2M</text>
  <text x="476" y="108" font-size="12" fill="#b91c1c" font-weight="bold">-10.3% vs last week</text>
  <text x="394" y="124" font-size="11" fill="#6b7280">Target $18.4M · same week last year $14.1M</text>
  <circle cx="682" cy="70" r="10" fill="#15803d"/>
  <text x="682" y="74" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <rect x="382" y="142" width="74" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="390" y="159" font-size="11" fill="#6b7280">Active</text>
  <text x="390" y="178" font-size="12" fill="#1f2937" font-weight="bold">8,980</text>
  <text x="390" y="195" font-size="11" fill="#6b7280">-0.2%</text>
  <rect x="460" y="142" width="74" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="468" y="159" font-size="11" fill="#6b7280">Attempts</text>
  <text x="468" y="178" font-size="12" fill="#1f2937" font-weight="bold">43.4</text>
  <text x="468" y="195" font-size="11" fill="#6b7280">-0.2%</text>
  <rect x="538" y="142" width="74" height="62" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="546" y="159" font-size="11" fill="#6b7280">Success</text>
  <text x="546" y="178" font-size="12" fill="#1f2937" font-weight="bold">83.1%</text>
  <text x="546" y="195" font-size="11" fill="#b91c1c">-8.9 pt</text>
  <rect x="616" y="142" width="74" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="624" y="159" font-size="11" fill="#6b7280">Avg pay</text>
  <text x="624" y="178" font-size="12" fill="#1f2937" font-weight="bold">$49.90</text>
  <text x="624" y="195" font-size="11" fill="#6b7280">-0.2%</text>
  <circle cx="682" cy="150" r="10" fill="#15803d"/>
  <text x="682" y="154" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <rect x="382" y="214" width="308" height="78" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="394" y="232" font-size="11" fill="#6b7280">Weekly volume, $M, axis from zero</text>
  <path d="M394.0 246.2 L430.7 245.5 L467.3 245.7 L504.0 244.8 L540.7 244.6 L577.3 244.4 L614.0 248.4" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="394" y1="284" x2="614" y2="284" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="622" y="262" font-size="11" fill="#b45309">3-D Secure</text>
  <text x="622" y="276" font-size="11" fill="#b45309">release</text>
  <circle cx="682" cy="222" r="10" fill="#15803d"/>
  <text x="682" y="226" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="392" cy="314" r="10" fill="#15803d"/>
  <text x="392" y="318" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="410" y="318" font-size="11" fill="#1f2937">One outcome with a target and two comparisons.</text>
  <circle cx="392" cy="335" r="10" fill="#15803d"/>
  <text x="392" y="339" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="410" y="339" font-size="11" fill="#1f2937">The tree's inputs, so the cause is one glance away.</text>
  <circle cx="392" cy="356" r="10" fill="#15803d"/>
  <text x="392" y="360" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="410" y="360" font-size="11" fill="#1f2937">Honest axis, complete weeks, and a note on what</text>
  <text x="410" y="375" font-size="11" fill="#1f2937">changed.</text>
  <circle cx="392" cy="392" r="10" fill="#15803d"/>
  <text x="392" y="396" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="410" y="396" font-size="11" fill="#1f2937">Guardrails, the owner and data freshness in view.</text>
  <rect x="382" y="416" width="308" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="394" y="438" font-size="11" fill="#6b7280">Losses 0.09% · Payouts on time 99.7% · Owner: Nadia</text>
  <circle cx="682" cy="424" r="10" fill="#15803d"/>
  <text x="682" y="428" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
</svg>
