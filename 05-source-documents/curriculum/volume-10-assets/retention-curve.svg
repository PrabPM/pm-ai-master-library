<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Retention curve for activated small merchants</title>
  <rect x="0" y="0" width="720" height="360" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">How fast do activated merchants stop paying?</text>
  <line x1="70" y1="290" x2="490" y2="290" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="70" y1="60" x2="70" y2="290" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="70" y1="290.0" x2="490" y2="290.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="62" y="294.0" font-size="11" fill="#6b7280" text-anchor="end">0%</text>
  <line x1="70" y1="232.5" x2="490" y2="232.5" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="62" y="236.5" font-size="11" fill="#6b7280" text-anchor="end">25%</text>
  <line x1="70" y1="175.0" x2="490" y2="175.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="62" y="179.0" font-size="11" fill="#6b7280" text-anchor="end">50%</text>
  <line x1="70" y1="117.5" x2="490" y2="117.5" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="62" y="121.5" font-size="11" fill="#6b7280" text-anchor="end">75%</text>
  <line x1="70" y1="60.0" x2="490" y2="60.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="62" y="64.0" font-size="11" fill="#6b7280" text-anchor="end">100%</text>
  <text x="70.0" y="308" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
  <text x="108.18181818181819" y="308" font-size="11" fill="#6b7280" text-anchor="middle">1</text>
  <text x="146.36363636363637" y="308" font-size="11" fill="#6b7280" text-anchor="middle">2</text>
  <text x="184.54545454545453" y="308" font-size="11" fill="#6b7280" text-anchor="middle">3</text>
  <text x="222.72727272727272" y="308" font-size="11" fill="#6b7280" text-anchor="middle">4</text>
  <text x="260.9090909090909" y="308" font-size="11" fill="#6b7280" text-anchor="middle">5</text>
  <text x="299.09090909090907" y="308" font-size="11" fill="#6b7280" text-anchor="middle">6</text>
  <text x="337.27272727272725" y="308" font-size="11" fill="#6b7280" text-anchor="middle">7</text>
  <text x="375.45454545454544" y="308" font-size="11" fill="#6b7280" text-anchor="middle">8</text>
  <text x="413.6363636363637" y="308" font-size="11" fill="#6b7280" text-anchor="middle">9</text>
  <text x="451.8181818181818" y="308" font-size="11" fill="#6b7280" text-anchor="middle">10</text>
  <text x="490.0" y="308" font-size="11" fill="#6b7280" text-anchor="middle">11</text>
  <text x="280.0" y="328" font-size="11" fill="#6b7280" text-anchor="middle">Months since first payment</text>
  <text x="26" y="48" font-size="11" fill="#6b7280">Still paying</text>
  <path d="M70.0 60.0 L108.2 85.7 L146.4 104.4 L184.5 114.4 L222.7 120.7 L260.9 126.2 L299.1 131.7 L337.3 136.5 L375.5 140.6 L413.6 143.9 L451.8 148.6 L490.0 153.7" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="70" cy="60" r="2.5" fill="#4f46e5"/>
  <circle cx="108.2" cy="85.7" r="2.5" fill="#4f46e5"/>
  <circle cx="146.4" cy="104.4" r="2.5" fill="#4f46e5"/>
  <circle cx="184.5" cy="114.4" r="2.5" fill="#4f46e5"/>
  <circle cx="222.7" cy="120.7" r="2.5" fill="#4f46e5"/>
  <circle cx="260.9" cy="126.2" r="2.5" fill="#4f46e5"/>
  <circle cx="299.1" cy="131.7" r="2.5" fill="#4f46e5"/>
  <circle cx="337.3" cy="136.5" r="2.5" fill="#4f46e5"/>
  <circle cx="375.5" cy="140.6" r="2.5" fill="#4f46e5"/>
  <circle cx="413.6" cy="143.9" r="2.5" fill="#4f46e5"/>
  <circle cx="451.8" cy="148.6" r="2.5" fill="#4f46e5"/>
  <circle cx="490.0" cy="153.7" r="2.5" fill="#4f46e5"/>
  <path d="M70.0 60.0 L108.2 96.7 L146.4 120.7 L184.5 136.5 L222.7 143.4 L260.9 150.0" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="70" cy="60" r="2.5" fill="#b91c1c"/>
  <circle cx="108.2" cy="96.7" r="2.5" fill="#b91c1c"/>
  <circle cx="146.4" cy="120.7" r="2.5" fill="#b91c1c"/>
  <circle cx="184.5" cy="136.5" r="2.5" fill="#b91c1c"/>
  <circle cx="222.7" cy="143.4" r="2.5" fill="#b91c1c"/>
  <circle cx="260.9" cy="150.0" r="2.5" fill="#b91c1c"/>
  <rect x="514" y="60" width="190" height="230" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="528" y1="84" x2="548" y2="84" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="556" y="88" font-size="11" fill="#1f2937">Activated Oct 2025 to Mar</text>
  <text x="556" y="103" font-size="11" fill="#1f2937">2026</text>
  <line x1="528" y1="128" x2="548" y2="128" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="556" y="132" font-size="11" fill="#1f2937">Activated Apr to Sep 2026</text>
  <text x="556" y="147" font-size="11" fill="#1f2937">(seen for 5 months so far)</text>
  <text x="528" y="196" font-size="11" fill="#6b7280">Both curves fall fast, then flatten.</text>
  <text x="528" y="211" font-size="11" fill="#6b7280">The newer merchants fall further</text>
  <text x="528" y="226" font-size="11" fill="#6b7280">before they flatten.</text>
</svg>
