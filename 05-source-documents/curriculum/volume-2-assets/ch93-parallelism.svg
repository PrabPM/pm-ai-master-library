<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Four ways to split training across GPUs</title>
  <rect x="0" y="0" width="720" height="340" rx="6" fill="#ffffff"/>
  <!-- Data parallel -->
  <rect x="24" y="16" width="324" height="148" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="38" font-size="13" fill="#1f2937" font-weight="bold">Data parallel</text>
  <text x="38" y="55" font-size="11" fill="#6b7280">Every GPU holds the whole model.</text>
  <rect x="36" y="66" width="146" height="62" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="46" y="83" font-size="11" fill="#1f2937" font-weight="bold">GPU 1</text>
  <text x="46" y="100" font-size="11" fill="#4f46e5">all weights + optimizer</text>
  <text x="46" y="117" font-size="11" fill="#6b7280">half of the batch</text>
  <rect x="190" y="66" width="146" height="62" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="200" y="83" font-size="11" fill="#1f2937" font-weight="bold">GPU 2</text>
  <text x="200" y="100" font-size="11" fill="#4f46e5">all weights + optimizer</text>
  <text x="200" y="117" font-size="11" fill="#6b7280">other half of the batch</text>
  <text x="38" y="150" font-size="11" fill="#1f2937">The GPUs average their gradients every step.</text>
  <!-- Sharded data parallel -->
  <rect x="372" y="16" width="324" height="148" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="386" y="38" font-size="13" fill="#1f2937" font-weight="bold">Sharded data parallel</text>
  <text x="386" y="55" font-size="11" fill="#6b7280">Every GPU stores one slice of the state.</text>
  <rect x="384" y="66" width="146" height="62" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="394" y="83" font-size="11" fill="#1f2937" font-weight="bold">GPU 1</text>
  <text x="394" y="100" font-size="11" fill="#4f46e5">slice 1 of 2</text>
  <text x="394" y="117" font-size="11" fill="#6b7280">half of the batch</text>
  <rect x="538" y="66" width="146" height="62" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="548" y="83" font-size="11" fill="#1f2937" font-weight="bold">GPU 2</text>
  <text x="548" y="100" font-size="11" fill="#4f46e5">slice 2 of 2</text>
  <text x="548" y="117" font-size="11" fill="#6b7280">other half of the batch</text>
  <text x="386" y="150" font-size="11" fill="#1f2937">Missing weights are fetched layer by layer.</text>
  <!-- Tensor parallel -->
  <rect x="24" y="176" width="324" height="148" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="198" font-size="13" fill="#1f2937" font-weight="bold">Tensor parallel</text>
  <text x="38" y="215" font-size="11" fill="#6b7280">Each layer's matrices are cut in two.</text>
  <rect x="36" y="226" width="146" height="62" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="46" y="243" font-size="11" fill="#1f2937" font-weight="bold">GPU 1</text>
  <text x="46" y="260" font-size="11" fill="#4f46e5">left half of each layer</text>
  <text x="46" y="277" font-size="11" fill="#6b7280">whole batch</text>
  <rect x="190" y="226" width="146" height="62" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="200" y="243" font-size="11" fill="#1f2937" font-weight="bold">GPU 2</text>
  <text x="200" y="260" font-size="11" fill="#4f46e5">right half of each layer</text>
  <text x="200" y="277" font-size="11" fill="#6b7280">whole batch</text>
  <text x="38" y="310" font-size="11" fill="#1f2937">GPUs exchange results inside every layer.</text>
  <!-- Pipeline parallel -->
  <rect x="372" y="176" width="324" height="148" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="386" y="198" font-size="13" fill="#1f2937" font-weight="bold">Pipeline parallel</text>
  <text x="386" y="215" font-size="11" fill="#6b7280">Consecutive layers sit on different GPUs.</text>
  <rect x="384" y="226" width="146" height="62" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="394" y="243" font-size="11" fill="#1f2937" font-weight="bold">GPU 1</text>
  <text x="394" y="260" font-size="11" fill="#4f46e5">layers 1 to 12</text>
  <text x="394" y="277" font-size="11" fill="#6b7280">micro-batch 2</text>
  <rect x="538" y="226" width="146" height="62" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="548" y="243" font-size="11" fill="#1f2937" font-weight="bold">GPU 2</text>
  <text x="548" y="260" font-size="11" fill="#4f46e5">layers 13 to 24</text>
  <text x="548" y="277" font-size="11" fill="#6b7280">micro-batch 1</text>
  <line x1="530" y1="257" x2="538" y2="257" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="538.0,257.0 531.1,261.1 531.1,252.9" fill="#1f2937"/>
  <text x="386" y="310" font-size="11" fill="#1f2937">Micro-batches flow from stage to stage.</text>
</svg>
