<svg xmlns="http://www.w3.org/2000/svg" width="720" height="448" viewBox="0 0 720 448" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Wireframe of a quality dashboard for an AI feature</title>
  <rect x="0" y="0" width="720" height="448" rx="6" fill="#ffffff"/>
  <text x="16" y="30" font-size="15" fill="#1f2937" font-weight="bold">PayFlow Assist · quality dashboard</text>
  <text x="704" y="30" font-size="11" fill="#6b7280" text-anchor="end">Week of Oct 5, 2026 · 9,140 drafts</text>
  <rect x="12" y="44" width="168" height="86" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="24" y="66" font-size="11" fill="#6b7280">Sent unchanged</text>
  <text x="24" y="98" font-size="16" fill="#15803d" font-weight="bold">61%</text>
  <text x="24" y="120" font-size="11" fill="#6b7280">alert below 50%</text>
  <rect x="188" y="44" width="168" height="86" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="200" y="66" font-size="11" fill="#6b7280">Edited, then sent</text>
  <text x="200" y="98" font-size="16" fill="#1f2937" font-weight="bold">22%</text>
  <text x="200" y="120" font-size="11" fill="#6b7280">watch what was edited</text>
  <rect x="364" y="44" width="168" height="86" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="376" y="66" font-size="11" fill="#6b7280">Rejected</text>
  <text x="376" y="98" font-size="16" fill="#1f2937" font-weight="bold">9%</text>
  <text x="376" y="120" font-size="11" fill="#6b7280">alert above 15%</text>
  <rect x="540" y="44" width="168" height="86" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="552" y="66" font-size="11" fill="#6b7280">Abstained</text>
  <text x="552" y="98" font-size="16" fill="#1f2937" font-weight="bold">8%</text>
  <text x="552" y="120" font-size="11" fill="#6b7280">alert above 15%</text>
  <rect x="12" y="140" width="240" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="24" y="162" font-size="11" fill="#1f2937" font-weight="bold">Claims supported by their source</text>
  <rect x="30" y="213" width="34" height="55" rx="6" fill="#4f46e5"/>
  <text x="47" y="260" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">93%</text>
  <text x="47" y="283" font-size="11" fill="#6b7280" text-anchor="middle">Sep 14</text>
  <rect x="84" y="207" width="34" height="61" rx="6" fill="#4f46e5"/>
  <text x="101" y="260" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">95%</text>
  <text x="101" y="283" font-size="11" fill="#6b7280" text-anchor="middle">Sep 21</text>
  <rect x="138" y="210" width="34" height="58" rx="6" fill="#4f46e5"/>
  <text x="155" y="260" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">94%</text>
  <text x="155" y="283" font-size="11" fill="#6b7280" text-anchor="middle">Sep 28</text>
  <rect x="192" y="228" width="34" height="40" rx="6" fill="#b91c1c"/>
  <text x="209" y="260" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">88%</text>
  <text x="209" y="283" font-size="11" fill="#6b7280" text-anchor="middle">Oct 5</text>
  <line x1="24" y1="222" x2="240" y2="222" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="240" y="184" font-size="11" fill="#6b7280" text-anchor="end">dashed line: 90% target</text>
  <rect x="260" y="140" width="216" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="272" y="162" font-size="11" fill="#1f2937" font-weight="bold">Stated confidence vs. observed</text>
  <rect x="272" y="176" width="192" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="282" y="194" font-size="11" fill="#1f2937" font-weight="bold">High</text>
  <text x="454" y="194" font-size="11" fill="#1f2937" text-anchor="end">93% right</text>
  <rect x="272" y="210" width="192" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="282" y="228" font-size="11" fill="#1f2937" font-weight="bold">Medium</text>
  <text x="454" y="228" font-size="11" fill="#1f2937" text-anchor="end">71% right</text>
  <rect x="272" y="244" width="192" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="282" y="262" font-size="11" fill="#1f2937" font-weight="bold">Low</text>
  <text x="454" y="262" font-size="11" fill="#1f2937" text-anchor="end">38% right</text>
  <rect x="484" y="140" width="224" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="496" y="162" font-size="11" fill="#1f2937" font-weight="bold">Speed and cost</text>
  <text x="496" y="184" font-size="11" fill="#6b7280">p50 response</text>
  <text x="696" y="184" font-size="11" fill="#1f2937" text-anchor="end" font-weight="bold">1.1 s</text>
  <text x="496" y="208" font-size="11" fill="#6b7280">p95 response</text>
  <text x="696" y="208" font-size="11" fill="#1f2937" text-anchor="end" font-weight="bold">2.5 s</text>
  <text x="496" y="232" font-size="11" fill="#6b7280">p99 response</text>
  <text x="696" y="232" font-size="11" fill="#1f2937" text-anchor="end" font-weight="bold">5.9 s</text>
  <text x="496" y="256" font-size="11" fill="#6b7280">Cost per resolved ticket</text>
  <text x="696" y="256" font-size="11" fill="#1f2937" text-anchor="end" font-weight="bold">USD 0.02</text>
  <rect x="12" y="300" width="240" height="100" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="24" y="322" font-size="11" fill="#1f2937" font-weight="bold">Review queue</text>
  <text x="24" y="344" font-size="11" fill="#6b7280">Waiting now</text>
  <text x="240" y="344" font-size="11" fill="#1f2937" text-anchor="end" font-weight="bold">23</text>
  <text x="24" y="364" font-size="11" fill="#6b7280">Oldest item</text>
  <text x="240" y="364" font-size="11" fill="#1f2937" text-anchor="end" font-weight="bold">7 min</text>
  <text x="24" y="384" font-size="11" fill="#6b7280">Mean wait</text>
  <text x="240" y="384" font-size="11" fill="#1f2937" text-anchor="end" font-weight="bold">0.6 min</text>
  <rect x="260" y="300" width="216" height="100" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="272" y="322" font-size="11" fill="#1f2937" font-weight="bold">Supported claims by segment</text>
  <text x="272" y="344" font-size="11" fill="#6b7280">English tickets</text>
  <text x="464" y="344" font-size="11" fill="#1f2937" text-anchor="end" font-weight="bold">91%</text>
  <text x="272" y="364" font-size="11" fill="#b91c1c">Spanish tickets</text>
  <text x="464" y="364" font-size="11" fill="#b91c1c" text-anchor="end" font-weight="bold">74%</text>
  <text x="272" y="384" font-size="11" fill="#6b7280">Merchants under 90 days</text>
  <text x="464" y="384" font-size="11" fill="#1f2937" text-anchor="end" font-weight="bold">86%</text>
  <rect x="484" y="300" width="224" height="100" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="496" y="322" font-size="11" fill="#1f2937" font-weight="bold">Guardrails</text>
  <text x="496" y="348" font-size="11" fill="#6b7280">Complaint rate</text>
  <rect x="630" y="333" width="66" height="22" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="663.0" y="348" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">Holds</text>
  <text x="496" y="380" font-size="11" fill="#6b7280">Refund rate</text>
  <rect x="630" y="365" width="66" height="22" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="663.0" y="380" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">Holds</text>
  <circle cx="244" cy="150" r="10" fill="#b91c1c"/>
  <text x="244" y="154" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="468" cy="310" r="10" fill="#b91c1c"/>
  <text x="468" y="314" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="22" cy="420" r="10" fill="#b91c1c"/>
  <text x="22" y="424" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="40" y="424" font-size="11" fill="#1f2937">A drop below the 90% line pages the owner.</text>
  <circle cx="370" cy="420" r="10" fill="#b91c1c"/>
  <text x="370" y="424" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="388" y="424" font-size="11" fill="#1f2937">The average hid a segment that is failing.</text>
</svg>
