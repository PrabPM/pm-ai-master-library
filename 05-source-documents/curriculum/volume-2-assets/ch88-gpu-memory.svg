<svg xmlns="http://www.w3.org/2000/svg" width="720" height="266" viewBox="0 0 720 266" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Where a 24 GB card's memory goes</title>
  <rect x="0" y="0" width="720" height="266" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">A 24 GB card after loading a 16 GB model</text>
  <text x="24" y="66" font-size="12" fill="#1f2937" font-weight="bold">32 key-value heads: 1.05 GB per 2,000-token request</text>
  <rect x="24" y="74" width="448" height="44" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
  <text x="248" y="101" font-size="12" fill="#1f2937" text-anchor="middle">model weights: 16 GB</text>
  <rect x="472" y="74" width="28" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="500" y="74" width="176" height="44" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="588.0" y="94" font-size="11" fill="#1f2937" text-anchor="middle">KV cache</text>
  <text x="588.0" y="110" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold">6 requests</text>
  <rect x="24" y="74" width="672" height="44" rx="6" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="24" y="152" font-size="12" fill="#1f2937" font-weight="bold">8 key-value heads: 0.26 GB per 2,000-token request</text>
  <rect x="24" y="160" width="448" height="44" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
  <text x="248" y="187" font-size="12" fill="#1f2937" text-anchor="middle">model weights: 16 GB</text>
  <rect x="472" y="160" width="28" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="500" y="160" width="191" height="44" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="595.5" y="180" font-size="11" fill="#1f2937" text-anchor="middle">KV cache</text>
  <text x="595.5" y="196" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold">26 requests</text>
  <rect x="24" y="160" width="672" height="44" rx="6" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="24" y="226" width="14" height="14" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="46" y="238" font-size="11" fill="#6b7280">1 GB working memory</text>
  <text x="200" y="238" font-size="11" fill="#6b7280">White space at the right of a bar is memory too small for one more request.</text>
</svg>
