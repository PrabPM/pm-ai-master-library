<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Build, buy or adapt: a two-by-two of centrality and data advantage</title>
  <rect x="0" y="0" width="720" height="330" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">Position each capability before you price the options</text>
  <rect x="150" y="48" width="270" height="110" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="164" y="74" font-size="13" fill="#1f2937" font-weight="bold">Buy, and manage the dependency</text>
  <text x="164" y="96" font-size="11" fill="#1f2937">Core to the product, but your data adds little.</text>
  <text x="164" y="111" font-size="11" fill="#1f2937">Negotiate terms and keep an exit.</text>
  <rect x="428" y="48" width="270" height="110" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="442" y="74" font-size="13" fill="#1f2937" font-weight="bold">Build</text>
  <text x="442" y="96" font-size="11" fill="#1f2937">Core, and your data changes the result. Fraud</text>
  <text x="442" y="111" font-size="11" fill="#1f2937">scoring.</text>
  <rect x="150" y="166" width="270" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="164" y="192" font-size="13" fill="#1f2937" font-weight="bold">Buy</text>
  <text x="164" y="214" font-size="11" fill="#1f2937">Supporting and generic. Sales call</text>
  <text x="164" y="229" font-size="11" fill="#1f2937">transcription.</text>
  <rect x="428" y="166" width="270" height="110" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="442" y="192" font-size="13" fill="#1f2937" font-weight="bold">Adapt</text>
  <text x="442" y="214" font-size="11" fill="#1f2937">Buy the model, add your data by retrieval or</text>
  <text x="442" y="229" font-size="11" fill="#1f2937">tuning. Support drafts, dispute summaries.</text>
  <text x="24" y="98" font-size="12" fill="#1f2937" font-weight="bold">Core to the</text>
  <text x="24" y="114" font-size="12" fill="#1f2937" font-weight="bold">product</text>
  <text x="24" y="216" font-size="12" fill="#1f2937" font-weight="bold">Supporting</text>
  <text x="150" y="298" font-size="12" fill="#1f2937" font-weight="bold">Your private data adds little</text>
  <text x="698" y="298" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">Your private data changes the result</text>
  <line x1="150" y1="312" x2="698" y2="312" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="698.0,312.0 691.1,316.1 691.1,307.9" fill="#6b7280"/>
</svg>
