  <path d="M624 94 Q582.0 76 540 94" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="38" y="142" font-size="11" fill="#1f2937">Work per new token grows with the length. Memory holds keys and values for every token.</text>
