<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Four notes become a graph, and a two-hop question becomes a path</title>
  <rect x="0" y="0" width="720" height="250" rx="6" fill="#ffffff"/>
  <text x="24" y="30" font-size="13" fill="#1f2937" font-weight="bold">Question: is Alder Goods linked to a merchant terminated for fraud?</text>
  <rect x="24" y="70" width="136" height="48" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="92" y="91" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Alder Goods</text>
  <text x="92" y="108" font-size="11" fill="#6b7280" text-anchor="middle">merchant</text>
  <rect x="270" y="70" width="100" height="48" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="320" y="91" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">D-17</text>
  <text x="320" y="108" font-size="11" fill="#6b7280" text-anchor="middle">device</text>
  <rect x="480" y="70" width="136" height="48" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="548" y="91" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">Birch Supply</text>
  <text x="548" y="108" font-size="11" fill="#6b7280" text-anchor="middle">merchant</text>
  <rect x="458" y="168" width="180" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="548" y="193" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">terminated for fraud</text>
  <line x1="160" y1="94" x2="268" y2="94" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="268.0,94.0 261.1,98.1 261.1,89.9" fill="#4f46e5"/>
  <text x="214" y="84" font-size="11" fill="#1f2937" text-anchor="middle">uses_device</text>
  <text x="214" y="112" font-size="11" fill="#6b7280" text-anchor="middle">note 0</text>
  <line x1="480" y1="94" x2="372" y2="94" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="372.0,94.0 378.9,89.9 378.9,98.1" fill="#4f46e5"/>
  <text x="425" y="84" font-size="11" fill="#1f2937" text-anchor="middle">uses_device</text>
  <text x="425" y="112" font-size="11" fill="#6b7280" text-anchor="middle">note 1</text>
  <line x1="548" y1="118" x2="548" y2="166" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="548.0,166.0 543.9,159.1 552.1,159.1" fill="#4f46e5"/>
  <text x="558" y="146" font-size="11" fill="#1f2937">status, note 2</text>
  <rect x="24" y="150" width="300" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="172" font-size="11" fill="#1f2937">Word-overlap ranking of the notes: 0, 2, 3, 1</text>
  <text x="36" y="190" font-size="11" fill="#b91c1c">Note 1, the bridge, comes last.</text>
  <text x="24" y="236" font-size="12" fill="#1f2937">The graph answer is the highlighted path, and every edge cites the note it came from.</text>
</svg>
