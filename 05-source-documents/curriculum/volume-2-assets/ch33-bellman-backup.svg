<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>One Bellman backup for the action now in net-1</title>
  <rect x="0" y="0" width="720" height="286" rx="6" fill="#ffffff"/>
  <rect x="30" y="70" width="120" height="54" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="90" y="93" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">net-1</text>
  <text x="90" y="112" font-size="11" fill="#6b7280" text-anchor="middle">state</text>
  <rect x="220" y="70" width="150" height="54" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="295" y="93" font-size="14" fill="#4f46e5" text-anchor="middle" font-weight="bold">now</text>
  <text x="295" y="112" font-size="11" fill="#4f46e5" text-anchor="middle">action, costs USD 0.20</text>
  <line x1="152" y1="97" x2="217" y2="97" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="217.0,97.0 210.1,101.1 210.1,92.9" fill="#1f2937"/>
  <rect x="480" y="20" width="210" height="54" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="585" y="43" font-size="14" fill="#15803d" text-anchor="middle" font-weight="bold">paid</text>
  <text x="585" y="62" font-size="11" fill="#15803d" text-anchor="middle">reward 10, nothing after</text>
  <rect x="480" y="120" width="210" height="54" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="585" y="143" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">net-2</text>
  <text x="585" y="162" font-size="11" fill="#6b7280" text-anchor="middle">worth 6.5 from here on</text>
  <line x1="372" y1="88" x2="477" y2="50" stroke="#15803d" stroke-width="1.5"/>
  <polygon points="477.0,50.0 472.0,56.2 469.2,48.5" fill="#15803d"/>
  <text x="412" y="56" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">0.4</text>
  <line x1="372" y1="106" x2="477" y2="144" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="477.0,144.0 469.2,145.5 472.0,137.8" fill="#1f2937"/>
  <text x="412" y="146" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">0.6</text>
  <rect x="30" y="204" width="660" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="230" font-size="14" fill="#1f2937" font-weight="bold">Q(net-1, now)  =  (0.4 × 10 − 0.20)  +  0.9 × (0.6 × 6.5)  =  3.8 + 3.51  =  7.31</text>
  <text x="192" y="252" font-size="11" fill="#6b7280">reward now</text>
  <text x="332" y="252" font-size="11" fill="#6b7280">discount × value of the next state</text>
</svg>
