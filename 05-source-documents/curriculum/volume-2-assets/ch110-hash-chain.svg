<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A hash-chained audit log: editing one entry breaks every later link</title>
  <rect x="0" y="0" width="720" height="300" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">Each entry's hash covers the entry and the previous hash</text>
  <rect x="24" y="48" width="150" height="78" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="36" y="70" font-size="13" fill="#1f2937" font-weight="bold">1  proposed</text>
  <text x="36" y="88" font-size="11" fill="#6b7280">by ops_agent</text>
  <text x="36" y="110" font-size="11" fill="#1f2937">hash b5fe427d73a4</text>
  <rect x="198" y="48" width="150" height="78" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="210" y="70" font-size="13" fill="#1f2937" font-weight="bold">2  approved</text>
  <text x="210" y="88" font-size="11" fill="#6b7280">by finance_lead</text>
  <text x="210" y="110" font-size="11" fill="#1f2937">hash 5acb526f246e</text>
  <rect x="372" y="48" width="150" height="78" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="384" y="70" font-size="13" fill="#1f2937" font-weight="bold">3  approved</text>
  <text x="384" y="88" font-size="11" fill="#6b7280">by risk_lead</text>
  <text x="384" y="110" font-size="11" fill="#1f2937">hash 5cee138b5f6e</text>
  <rect x="546" y="48" width="150" height="78" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="558" y="70" font-size="13" fill="#1f2937" font-weight="bold">4  executed</text>
  <text x="558" y="88" font-size="11" fill="#6b7280">retry_payout</text>
  <text x="558" y="110" font-size="11" fill="#1f2937">hash 2b6c43b733fd</text>
  <line x1="177" y1="87" x2="195" y2="87" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="195.0,87.0 188.1,91.1 188.1,82.9" fill="#1f2937"/>
  <line x1="351" y1="87" x2="369" y2="87" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="369.0,87.0 362.1,91.1 362.1,82.9" fill="#1f2937"/>
  <line x1="525" y1="87" x2="543" y2="87" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="543.0,87.0 536.1,91.1 536.1,82.9" fill="#1f2937"/>
  <text x="24" y="160" font-size="13" fill="#1f2937" font-weight="bold">Someone edits entry 2 afterwards</text>
  <rect x="24" y="174" width="150" height="78" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="36" y="196" font-size="13" fill="#1f2937" font-weight="bold">1  proposed</text>
  <text x="36" y="214" font-size="11" fill="#6b7280">unchanged</text>
  <text x="36" y="236" font-size="11" fill="#1f2937">link holds</text>
  <rect x="198" y="174" width="150" height="78" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="210" y="196" font-size="13" fill="#1f2937" font-weight="bold">2  approved</text>
  <text x="210" y="214" font-size="11" fill="#6b7280">by ops_agent (edited)</text>
  <text x="210" y="236" font-size="11" fill="#1f2937">hash no longer matches</text>
  <rect x="372" y="174" width="150" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="384" y="196" font-size="13" fill="#1f2937" font-weight="bold">3  approved</text>
  <text x="384" y="214" font-size="11" fill="#6b7280">unchanged</text>
  <text x="384" y="236" font-size="11" fill="#1f2937">built on a broken link</text>
  <rect x="546" y="174" width="150" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="558" y="196" font-size="13" fill="#1f2937" font-weight="bold">4  executed</text>
  <text x="558" y="214" font-size="11" fill="#6b7280">unchanged</text>
  <text x="558" y="236" font-size="11" fill="#1f2937">built on a broken link</text>
  <line x1="177" y1="213" x2="195" y2="213" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="195.0,213.0 188.1,217.1 188.1,208.9" fill="#1f2937"/>
  <line x1="351" y1="213" x2="369" y2="213" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="369.0,213.0 362.1,217.1 362.1,208.9" fill="#1f2937"/>
  <line x1="525" y1="213" x2="543" y2="213" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="543.0,213.0 536.1,217.1 536.1,208.9" fill="#1f2937"/>
  <text x="24" y="280" font-size="12" fill="#6b7280">The check recomputes every hash from entry 1 and reports the first one that differs: entry 2.</text>
</svg>
