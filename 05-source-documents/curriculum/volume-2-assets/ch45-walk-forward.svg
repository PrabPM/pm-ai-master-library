<svg xmlns="http://www.w3.org/2000/svg" width="720" height="262" viewBox="0 0 720 262" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Walk-forward validation with five folds</title>
  <rect x="0" y="0" width="720" height="262" rx="6" fill="#ffffff"/>
  <text x="110" y="28" font-size="11" fill="#6b7280">older rows</text>
  <text x="690" y="28" font-size="11" fill="#6b7280" text-anchor="end">newer rows</text>
  <line x1="180" y1="24" x2="614" y2="24" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="614.0,24.0 607.1,28.1 607.1,19.9" fill="#cbd5e1"/>
  <text x="30" y="61" font-size="12" fill="#1f2937" font-weight="bold">Fold 1</text>
  <rect x="110.0" y="44" width="178.1" height="24" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="303.6" y="44" width="77.0" height="24" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="199.0520694259012" y="60" font-size="11" fill="#4f46e5" text-anchor="middle">train</text>
  <text x="342.1161548731642" y="60" font-size="11" fill="#b45309" text-anchor="middle">test</text>
  <text x="30" y="95" font-size="12" fill="#1f2937" font-weight="bold">Fold 2</text>
  <rect x="110.0" y="78" width="255.2" height="24" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="380.6" y="78" width="77.0" height="24" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="237.57676902536716" y="94" font-size="11" fill="#4f46e5" text-anchor="middle">train</text>
  <text x="419.16555407209614" y="94" font-size="11" fill="#b45309" text-anchor="middle">test</text>
  <text x="30" y="129" font-size="12" fill="#1f2937" font-weight="bold">Fold 3</text>
  <rect x="110.0" y="112" width="332.2" height="24" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="457.7" y="112" width="77.0" height="24" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="276.1014686248331" y="128" font-size="11" fill="#4f46e5" text-anchor="middle">train</text>
  <text x="496.214953271028" y="128" font-size="11" fill="#b45309" text-anchor="middle">test</text>
  <text x="30" y="163" font-size="12" fill="#1f2937" font-weight="bold">Fold 4</text>
  <rect x="110.0" y="146" width="409.3" height="24" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="534.7" y="146" width="77.0" height="24" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="314.6261682242991" y="162" font-size="11" fill="#4f46e5" text-anchor="middle">train</text>
  <text x="573.2643524699599" y="162" font-size="11" fill="#b45309" text-anchor="middle">test</text>
  <text x="30" y="197" font-size="12" fill="#1f2937" font-weight="bold">Fold 5</text>
  <rect x="110.0" y="180" width="486.3" height="24" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="611.8" y="180" width="77.0" height="24" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="353.150867823765" y="196" font-size="11" fill="#4f46e5" text-anchor="middle">train</text>
  <text x="650.3137516688919" y="196" font-size="11" fill="#b45309" text-anchor="middle">test</text>
  <text x="30" y="236" font-size="12" fill="#6b7280">The white gap is purged: labels there would be computed from test rows. Drawn for a 40-row label horizon.</text>
  <text x="30" y="254" font-size="12" fill="#6b7280">No fold ever trains on rows that come after its test block.</text>
</svg>
