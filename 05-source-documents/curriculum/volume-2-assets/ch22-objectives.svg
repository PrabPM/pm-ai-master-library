<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Causal and masked language-model objectives</title>
  <rect x="0" y="0" width="720" height="322" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">Causal language model: predict the next token</text>
  <text x="24" y="70" font-size="12" fill="#6b7280">model reads</text>
  <text x="24" y="126" font-size="12" fill="#6b7280">must predict</text>
  <rect x="150" y="50" width="88" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="194" y="71" font-size="13" fill="#1f2937" text-anchor="middle">Your</text>
  <line x1="194" y1="84" x2="194" y2="102" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="194.0,102.0 189.9,95.1 198.1,95.1" fill="#6b7280"/>
  <rect x="150" y="106" width="88" height="32" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="194" y="127" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">payout</text>
  <rect x="254" y="50" width="88" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="298" y="71" font-size="13" fill="#1f2937" text-anchor="middle">payout</text>
  <line x1="298" y1="84" x2="298" y2="102" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="298.0,102.0 293.9,95.1 302.1,95.1" fill="#6b7280"/>
  <rect x="254" y="106" width="88" height="32" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="298" y="127" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">was</text>
  <rect x="358" y="50" width="88" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="402" y="71" font-size="13" fill="#1f2937" text-anchor="middle">was</text>
  <line x1="402" y1="84" x2="402" y2="102" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="402.0,102.0 397.9,95.1 406.1,95.1" fill="#6b7280"/>
  <rect x="358" y="106" width="88" height="32" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="402" y="127" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">sent</text>
  <rect x="462" y="50" width="88" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="506" y="71" font-size="13" fill="#1f2937" text-anchor="middle">sent</text>
  <line x1="506" y1="84" x2="506" y2="102" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="506.0,102.0 501.9,95.1 510.1,95.1" fill="#6b7280"/>
  <rect x="462" y="106" width="88" height="32" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="506" y="127" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">today</text>
  <rect x="566" y="50" width="88" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="610" y="71" font-size="13" fill="#1f2937" text-anchor="middle">today</text>
  <line x1="610" y1="84" x2="610" y2="102" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="610.0,102.0 605.9,95.1 614.1,95.1" fill="#6b7280"/>
  <rect x="566" y="106" width="88" height="32" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="610" y="127" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">(end)</text>
  <text x="24" y="160" font-size="12" fill="#1f2937">Each prediction may use only the tokens to its left. Every position is a training example.</text>
  <line x1="24" y1="176" x2="696" y2="176" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="24" y="204" font-size="14" fill="#1f2937" font-weight="bold">Masked language model: fill in the blank</text>
  <text x="24" y="246" font-size="12" fill="#6b7280">model reads</text>
  <text x="24" y="302" font-size="12" fill="#6b7280">must predict</text>
  <rect x="150" y="226" width="88" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="194" y="247" font-size="13" fill="#1f2937" text-anchor="middle">Your</text>
  <rect x="254" y="226" width="88" height="32" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="298" y="247" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">[MASK]</text>
  <rect x="358" y="226" width="88" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="402" y="247" font-size="13" fill="#1f2937" text-anchor="middle">was</text>
  <rect x="462" y="226" width="88" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="506" y="247" font-size="13" fill="#1f2937" text-anchor="middle">sent</text>
  <rect x="566" y="226" width="88" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="610" y="247" font-size="13" fill="#1f2937" text-anchor="middle">today</text>
  <line x1="298" y1="260" x2="298" y2="278" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="298.0,278.0 293.9,271.1 302.1,271.1" fill="#6b7280"/>
  <rect x="254" y="282" width="88" height="32" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="298" y="303" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">payout</text>
  <text x="358" y="296" font-size="12" fill="#1f2937">The prediction may use tokens on both sides. Only the masked</text>
  <text x="358" y="312" font-size="12" fill="#1f2937">positions are scored.</text>
</svg>
