<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Alpha-beta pruning on the fraud-rule game</title>
  <rect x="0" y="0" width="720" height="330" rx="6" fill="#ffffff"/>
  <rect x="255" y="20" width="210" height="44" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="360" y="39" font-size="12" fill="#4f46e5" text-anchor="middle">PayFlow chooses (MAX)</text>
  <text x="360" y="56" font-size="13" fill="#4f46e5" text-anchor="middle" font-weight="bold">value 3: rule A</text>
  <line x1="295.6" y1="64" x2="130" y2="118" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="52" y="118" width="156" height="44" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="130" y="137" font-size="11" fill="#1f2937" text-anchor="middle">rule A: ring replies (MIN)</text>
  <text x="130" y="154" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">worst case 3</text>
  <line x1="95.0" y1="162" x2="60" y2="222" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="38" y="222" width="44" height="34" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="60" y="245" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">3</text>
  <line x1="130.0" y1="162" x2="130" y2="222" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="108" y="222" width="44" height="34" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="130" y="245" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">5</text>
  <line x1="165.0" y1="162" x2="200" y2="222" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="178" y="222" width="44" height="34" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="200" y="245" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">4</text>
  <line x1="360.0" y1="64" x2="360" y2="118" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="282" y="118" width="156" height="44" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="360" y="137" font-size="11" fill="#1f2937" text-anchor="middle">rule B: ring replies (MIN)</text>
  <text x="360" y="154" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">at most 2</text>
  <line x1="325.0" y1="162" x2="290" y2="222" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="268" y="222" width="44" height="34" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="290" y="245" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">2</text>
  <line x1="360.0" y1="162" x2="360" y2="222" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="338" y="222" width="44" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="245" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold">6</text>
  <line x1="343" y1="251" x2="377" y2="227" stroke="#b91c1c" stroke-width="1.5"/>
  <line x1="395.0" y1="162" x2="430" y2="222" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="408" y="222" width="44" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="245" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold">7</text>
  <line x1="413" y1="251" x2="447" y2="227" stroke="#b91c1c" stroke-width="1.5"/>
  <line x1="424.4" y1="64" x2="590" y2="118" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="512" y="118" width="156" height="44" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="590" y="137" font-size="11" fill="#1f2937" text-anchor="middle">rule C: ring replies (MIN)</text>
  <text x="590" y="154" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">at most 1</text>
  <line x1="555.0" y1="162" x2="520" y2="222" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="498" y="222" width="44" height="34" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="520" y="245" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">6</text>
  <line x1="590.0" y1="162" x2="590" y2="222" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="568" y="222" width="44" height="34" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="590" y="245" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">1</text>
  <line x1="625.0" y1="162" x2="660" y2="222" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="638" y="222" width="44" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="660" y="245" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold">8</text>
  <line x1="643" y1="251" x2="677" y2="227" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="130" y="278" font-size="11" fill="#6b7280" text-anchor="middle">read in full</text>
  <text x="360" y="278" font-size="11" fill="#b91c1c" text-anchor="middle">2 is below 3: skip 6 and 7</text>
  <text x="590" y="278" font-size="11" fill="#b91c1c" text-anchor="middle">1 is below 3: skip 8</text>
  <text x="360" y="312" font-size="12" fill="#6b7280" text-anchor="middle">Leaves are PayFlow's weekly saving in USD thousands. Six of nine are evaluated.</text>
</svg>
