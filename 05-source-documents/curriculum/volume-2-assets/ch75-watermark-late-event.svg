<svg xmlns="http://www.w3.org/2000/svg" width="720" height="398" viewBox="0 0 720 398" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Event time against arrival time for seven payments and one late event</title>
  <rect x="0" y="0" width="720" height="398" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">A 60-second window, a 5-second watermark bound, seven payments</text>
  <line x1="60" y1="112" x2="668" y2="112" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="60" y1="109" x2="60" y2="115" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="140" y1="109" x2="140" y2="115" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="220" y1="109" x2="220" y2="115" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="300" y1="109" x2="300" y2="115" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="380" y1="109" x2="380" y2="115" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="460" y1="109" x2="460" y2="115" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="540" y1="109" x2="540" y2="115" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="620" y1="109" x2="620" y2="115" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="60" y1="250" x2="668" y2="250" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="60" y1="247" x2="60" y2="253" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="140" y1="247" x2="140" y2="253" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="220" y1="247" x2="220" y2="253" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="300" y1="247" x2="300" y2="253" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="380" y1="247" x2="380" y2="253" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="460" y1="247" x2="460" y2="253" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="540" y1="247" x2="540" y2="253" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="620" y1="247" x2="620" y2="253" stroke="#6b7280" stroke-width="1.5"/>
  <text x="24" y="68" font-size="12" fill="#6b7280">event time in seconds; the window [0, 60) is shaded</text>
  <text x="24" y="312" font-size="12" fill="#6b7280">arrival time in seconds</text>
  <text x="60" y="100" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
  <text x="60" y="272" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
  <text x="140" y="100" font-size="11" fill="#6b7280" text-anchor="middle">10</text>
  <text x="140" y="272" font-size="11" fill="#6b7280" text-anchor="middle">10</text>
  <text x="220" y="100" font-size="11" fill="#6b7280" text-anchor="middle">20</text>
  <text x="220" y="272" font-size="11" fill="#6b7280" text-anchor="middle">20</text>
  <text x="300" y="100" font-size="11" fill="#6b7280" text-anchor="middle">30</text>
  <text x="300" y="272" font-size="11" fill="#6b7280" text-anchor="middle">30</text>
  <text x="380" y="100" font-size="11" fill="#6b7280" text-anchor="middle">40</text>
  <text x="380" y="272" font-size="11" fill="#6b7280" text-anchor="middle">40</text>
  <text x="460" y="100" font-size="11" fill="#6b7280" text-anchor="middle">50</text>
  <text x="460" y="272" font-size="11" fill="#6b7280" text-anchor="middle">50</text>
  <text x="540" y="100" font-size="11" fill="#6b7280" text-anchor="middle">60</text>
  <text x="540" y="272" font-size="11" fill="#6b7280" text-anchor="middle">60</text>
  <text x="620" y="100" font-size="11" fill="#6b7280" text-anchor="middle">70</text>
  <text x="620" y="272" font-size="11" fill="#6b7280" text-anchor="middle">70</text>
  <rect x="60" y="118" width="480" height="12" rx="6" fill="#eef2ff"/>
  <line x1="140" y1="112" x2="148" y2="250" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="140" cy="112" r="5" fill="#6b7280"/>
  <circle cx="148" cy="250" r="5" fill="#6b7280"/>
  <text x="148" y="290" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">a</text>
  <line x1="260" y1="112" x2="268" y2="250" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="260" cy="112" r="5" fill="#6b7280"/>
  <circle cx="268" cy="250" r="5" fill="#6b7280"/>
  <text x="268" y="290" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">b</text>
  <line x1="460" y1="112" x2="468" y2="250" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="460" cy="112" r="5" fill="#6b7280"/>
  <circle cx="468" cy="250" r="5" fill="#6b7280"/>
  <text x="468" y="290" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">c</text>
  <line x1="564" y1="112" x2="572" y2="250" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="564" cy="112" r="5" fill="#6b7280"/>
  <circle cx="572" cy="250" r="5" fill="#6b7280"/>
  <text x="572" y="290" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">d</text>
  <line x1="380" y1="112" x2="588" y2="250" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="380" cy="112" r="5" fill="#b45309"/>
  <circle cx="588" cy="250" r="5" fill="#b45309"/>
  <text x="588" y="290" font-size="12" fill="#b45309" text-anchor="middle" font-weight="bold">e</text>
  <line x1="604" y1="112" x2="612" y2="250" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="604" cy="112" r="5" fill="#4f46e5"/>
  <circle cx="612" cy="250" r="5" fill="#4f46e5"/>
  <text x="612" y="290" font-size="12" fill="#4f46e5" text-anchor="middle" font-weight="bold">f</text>
  <line x1="508" y1="112" x2="636" y2="250" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="508" cy="112" r="5" fill="#b91c1c"/>
  <circle cx="636" cy="250" r="5" fill="#b91c1c"/>
  <text x="636" y="290" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">g</text>
  <text x="60" y="336" font-size="12" fill="#b45309">e is 26 s out of order, but the window is still open: counted.</text>
  <text x="60" y="358" font-size="12" fill="#4f46e5">f arrives: the watermark is 68 - 5 = 63, past 60, so the window closes with 4 payments.</text>
  <text x="60" y="380" font-size="12" fill="#b91c1c">g arrives after the close: late. The online count stays 4; the offline count is 5.</text>
</svg>
