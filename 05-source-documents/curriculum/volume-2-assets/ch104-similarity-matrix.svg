<svg xmlns="http://www.w3.org/2000/svg" width="720" height="236" viewBox="0 0 720 236" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A batch of three photo and text pairs as a similarity matrix</title>
  <rect x="0" y="0" width="720" height="236" rx="6" fill="#ffffff"/>
  <text x="276.0" y="26" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">business descriptions</text>
  <text x="192.0" y="46" font-size="11" fill="#6b7280" text-anchor="middle">text 1</text>
  <text x="276.0" y="46" font-size="11" fill="#6b7280" text-anchor="middle">text 2</text>
  <text x="360.0" y="46" font-size="11" fill="#6b7280" text-anchor="middle">text 3</text>
  <text x="138" y="86" font-size="11" fill="#6b7280" text-anchor="end">photo 1</text>
  <rect x="150" y="58" width="78" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="189.0" y="83" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">0.9</text>
  <rect x="234" y="58" width="78" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="273.0" y="83" font-size="13" fill="#1f2937" text-anchor="middle">0.1</text>
  <rect x="318" y="58" width="78" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="357.0" y="83" font-size="13" fill="#1f2937" text-anchor="middle">0.0</text>
  <text x="138" y="132" font-size="11" fill="#6b7280" text-anchor="end">photo 2</text>
  <rect x="150" y="104" width="78" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="189.0" y="129" font-size="13" fill="#1f2937" text-anchor="middle">0.2</text>
  <rect x="234" y="104" width="78" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="273.0" y="129" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">0.8</text>
  <rect x="318" y="104" width="78" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="357.0" y="129" font-size="13" fill="#1f2937" text-anchor="middle">0.1</text>
  <text x="138" y="178" font-size="11" fill="#6b7280" text-anchor="end">photo 3</text>
  <rect x="150" y="150" width="78" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="189.0" y="175" font-size="13" fill="#1f2937" text-anchor="middle">0.1</text>
  <rect x="234" y="150" width="78" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="273.0" y="175" font-size="13" fill="#1f2937" text-anchor="middle">0.3</text>
  <rect x="318" y="150" width="78" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="357.0" y="175" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">0.6</text>
  <text x="24" y="40" font-size="12" fill="#1f2937" font-weight="bold">storefront</text>
  <text x="24" y="56" font-size="12" fill="#1f2937" font-weight="bold">photos</text>
  <text x="424" y="72" font-size="12" fill="#1f2937" font-weight="bold">Diagonal cells are the true pairs.</text>
  <text x="424" y="96" font-size="11" fill="#1f2937">Rows: for each photo, a softmax over the three texts</text>
  <text x="424" y="111" font-size="11" fill="#1f2937">should pick the diagonal.</text>
  <text x="424" y="136" font-size="11" fill="#1f2937">Columns: for each text, a softmax over the three</text>
  <text x="424" y="151" font-size="11" fill="#1f2937">photos should pick the diagonal.</text>
  <text x="424" y="176" font-size="11" fill="#6b7280">The loss is the average of both directions.</text>
  <text x="24" y="222" font-size="12" fill="#1f2937">Every other cell in the batch is a free negative example.</text>
</svg>
