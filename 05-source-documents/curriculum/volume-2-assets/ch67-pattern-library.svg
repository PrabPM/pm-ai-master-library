<svg xmlns="http://www.w3.org/2000/svg" width="720" height="436" viewBox="0 0 720 436" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Five interface patterns for uncertain outputs and a rule for choosing</title>
  <rect x="0" y="0" width="720" height="436" rx="6" fill="#ffffff"/>
  <rect x="12" y="12" width="224" height="200" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="24" y="36" font-size="13" fill="#1f2937" font-weight="bold">1  Suggest, don't decide</text>
  <text x="24" y="53" font-size="11" fill="#6b7280">A guess with the next-best options.</text>
  <rect x="22" y="66" width="204" height="132" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="88" font-size="12" fill="#1f2937" font-weight="bold">Blue Bottle Supplies</text>
  <text x="216" y="88" font-size="12" fill="#1f2937" text-anchor="end">USD 84.20</text>
  <text x="32" y="110" font-size="11" fill="#6b7280">Category</text>
  <rect x="32" y="118" width="99" height="22" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="81.5" y="133" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">Office supplies</text>
  <text x="32" y="162" font-size="11" fill="#6b7280">Or pick another</text>
  <rect x="32" y="170" width="70" height="22" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
  <text x="67.0" y="185" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">Inventory</text>
  <rect x="110" y="170" width="50" height="22" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
  <text x="135.0" y="185" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">Other</text>
  <rect x="248" y="12" width="224" height="200" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="260" y="36" font-size="13" fill="#1f2937" font-weight="bold">2  Match words to evidence</text>
  <text x="260" y="53" font-size="11" fill="#6b7280">Say only what was measured.</text>
  <rect x="258" y="66" width="204" height="62" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="268" y="84" font-size="11" fill="#b91c1c" font-weight="bold">Too sure</text>
  <text x="268" y="102" font-size="12" fill="#1f2937">This invoice is a duplicate.</text>
  <rect x="258" y="136" width="204" height="62" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="268" y="154" font-size="11" fill="#15803d" font-weight="bold">Earned</text>
  <text x="268" y="172" font-size="12" fill="#1f2937">Looks like a duplicate of</text>
  <text x="268" y="188" font-size="12" fill="#1f2937">INV-2041.</text>
  <rect x="484" y="12" width="224" height="200" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="496" y="36" font-size="13" fill="#1f2937" font-weight="bold">3  Show the evidence</text>
  <text x="496" y="53" font-size="11" fill="#6b7280">Let the person check the claim.</text>
  <rect x="494" y="66" width="204" height="132" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="504" y="88" font-size="12" fill="#1f2937" font-weight="bold">Why this was flagged</text>
  <path d="M506 108 l3 3 l6 -7" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="524" y="112" font-size="11" fill="#1f2937">Same supplier</text>
  <path d="M506 128 l3 3 l6 -7" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="524" y="132" font-size="11" fill="#1f2937">Same amount, USD 1,950.00</text>
  <path d="M506 148 l3 3 l6 -7" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="524" y="152" font-size="11" fill="#1f2937">Sent 2 days apart</text>
  <rect x="504" y="164" width="140" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="574.0" y="181.0" font-size="11" fill="#1f2937" text-anchor="middle">Compare invoices</text>
  <rect x="12" y="224" width="224" height="200" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="24" y="248" font-size="13" fill="#1f2937" font-weight="bold">4  Make undo cheap</text>
  <text x="24" y="265" font-size="11" fill="#6b7280">Act, say so, and offer the way back.</text>
  <rect x="22" y="278" width="204" height="132" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="302" font-size="12" fill="#1f2937" font-weight="bold">14 payments categorized</text>
  <text x="32" y="322" font-size="11" fill="#6b7280">You can change any of them later.</text>
  <rect x="32" y="342" width="184" height="52" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="44" y="364" font-size="11" fill="#1f2937">Applied just now</text>
  <text x="44" y="382" font-size="11" fill="#6b7280">Undo for 7 days</text>
  <rect x="148" y="355" width="56" height="26" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="176.0" y="372.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Undo</text>
  <rect x="248" y="224" width="224" height="200" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="260" y="248" font-size="13" fill="#1f2937" font-weight="bold">5  Abstain and hand off</text>
  <text x="260" y="265" font-size="11" fill="#6b7280">No guess when support is missing.</text>
  <rect x="258" y="278" width="204" height="132" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="268" y="300" font-size="12" fill="#b45309" font-weight="bold">No supported answer found</text>
  <text x="268" y="320" font-size="11" fill="#1f2937">I can't confirm an arrival date for</text>
  <text x="268" y="335" font-size="11" fill="#1f2937">PO-8850.</text>
  <rect x="268" y="364" width="124" height="28" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="330.0" y="382.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Ask payments ops</text>
  <rect x="484" y="224" width="224" height="200" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="496" y="248" font-size="13" fill="#1f2937" font-weight="bold">How to choose</text>
  <text x="496" y="265" font-size="11" fill="#6b7280">By stakes and reversibility.</text>
  <rect x="494" y="276" width="204" height="33" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="502" y="290" font-size="11" fill="#6b7280">Cheap to fix, usually right</text>
  <text x="502" y="304" font-size="11" fill="#15803d" font-weight="bold">Apply with undo</text>
  <rect x="494" y="312" width="204" height="33" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="502" y="326" font-size="11" fill="#6b7280">Costly if wrong</text>
  <text x="502" y="340" font-size="11" fill="#4f46e5" font-weight="bold">Suggest, person confirms</text>
  <rect x="494" y="348" width="204" height="33" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="502" y="362" font-size="11" fill="#6b7280">Cannot be undone</text>
  <text x="502" y="376" font-size="11" fill="#b45309" font-weight="bold">Approval card</text>
  <rect x="494" y="384" width="204" height="33" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="502" y="398" font-size="11" fill="#6b7280">Often wrong or unsupported</text>
  <text x="502" y="412" font-size="11" fill="#b91c1c" font-weight="bold">Abstain</text>
</svg>
