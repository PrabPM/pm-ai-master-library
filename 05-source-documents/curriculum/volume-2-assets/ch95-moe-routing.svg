<svg xmlns="http://www.w3.org/2000/svg" width="720" height="288" viewBox="0 0 720 288" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A router sends one token to two of four experts</title>
  <rect x="0" y="0" width="720" height="288" rx="6" fill="#ffffff"/>
  <rect x="24" y="112" width="116" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="82" y="136" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">one token</text>
  <text x="82" y="154" font-size="11" fill="#6b7280" text-anchor="middle">vector x</text>
  <line x1="140" y1="140" x2="176" y2="140" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="176.0,140.0 169.1,144.1 169.1,135.9" fill="#1f2937"/>
  <rect x="178" y="96" width="156" height="88" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="256" y="120" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Router</text>
  <text x="256" y="139" font-size="11" fill="#1f2937" text-anchor="middle">scores 2.0, 1.0, 0.0, -1.0</text>
  <text x="256" y="157" font-size="11" fill="#6b7280" text-anchor="middle">keep the top 2,</text>
  <text x="256" y="172" font-size="11" fill="#6b7280" text-anchor="middle">softmax over those</text>
  <rect x="392" y="20" width="160" height="50" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="334" y1="140" x2="390" y2="45" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="390.0,45.0 390.1,53.0 383.0,48.8" fill="#4f46e5"/>
  <line x1="552" y1="45" x2="596" y2="128" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="596.0,128.0 589.1,123.9 596.4,120.0" fill="#4f46e5"/>
  <text x="404" y="41" font-size="12" fill="#1f2937" font-weight="bold">Expert 0</text>
  <text x="404" y="59" font-size="11" fill="#4f46e5">gate weight 0.731</text>
  <rect x="392" y="86" width="160" height="50" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="334" y1="140" x2="390" y2="111" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="390.0,111.0 385.8,117.8 382.0,110.5" fill="#4f46e5"/>
  <line x1="552" y1="111" x2="596" y2="150" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="596.0,150.0 588.1,148.5 593.6,142.4" fill="#4f46e5"/>
  <text x="404" y="107" font-size="12" fill="#1f2937" font-weight="bold">Expert 1</text>
  <text x="404" y="125" font-size="11" fill="#4f46e5">gate weight 0.269</text>
  <rect x="392" y="152" width="160" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="334" y1="140" x2="390" y2="177" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="404" y="173" font-size="12" fill="#6b7280" font-weight="bold">Expert 2</text>
  <text x="404" y="191" font-size="11" fill="#6b7280">skipped, costs nothing</text>
  <rect x="392" y="218" width="160" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="334" y1="140" x2="390" y2="243" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="404" y="239" font-size="12" fill="#6b7280" font-weight="bold">Expert 3</text>
  <text x="404" y="257" font-size="11" fill="#6b7280">skipped, costs nothing</text>
  <rect x="598" y="104" width="104" height="72" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="650" y="128" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">weighted</text>
  <text x="650" y="144" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">sum</text>
  <text x="650" y="164" font-size="11" fill="#6b7280" text-anchor="middle">layer output</text>
  <text x="24" y="276" font-size="12" fill="#1f2937">All four experts must sit in memory. Only two run for this token.</text>
</svg>
