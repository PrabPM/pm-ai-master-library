<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>EU AI Act application dates as amended in July 2026</title>
  <rect x="0" y="0" width="720" height="300" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">EU AI Act: what applies when (as amended in July 2026)</text>
  <line x1="40" y1="160" x2="680" y2="160" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="40" cy="160" r="6" fill="#15803d" stroke="#15803d" stroke-width="1.5"/>
  <line x1="40" y1="152" x2="40" y2="134" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="98" font-size="12" fill="#1f2937" font-weight="bold">1 Aug 2024</text>
  <text x="40" y="114" font-size="11" fill="#6b7280">In force</text>
  <circle cx="121" cy="160" r="6" fill="#15803d" stroke="#15803d" stroke-width="1.5"/>
  <line x1="121" y1="168" x2="121" y2="186" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="121" y="204" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">2 Feb 2025</text>
  <text x="121" y="220" font-size="11" fill="#6b7280" text-anchor="middle">Prohibited practices</text>
  <circle cx="200" cy="160" r="6" fill="#15803d" stroke="#15803d" stroke-width="1.5"/>
  <line x1="200" y1="152" x2="200" y2="134" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="200" y="98" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">2 Aug 2025</text>
  <text x="200" y="114" font-size="11" fill="#6b7280" text-anchor="middle">General-purpose model</text>
  <text x="200" y="128" font-size="11" fill="#6b7280" text-anchor="middle">duties</text>
  <circle cx="360" cy="160" r="6" fill="#15803d" stroke="#15803d" stroke-width="1.5"/>
  <line x1="360" y1="168" x2="360" y2="186" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="352" y="204" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">2 Aug 2026</text>
  <text x="352" y="220" font-size="11" fill="#6b7280" text-anchor="end">Transparency duties</text>
  <text x="352" y="234" font-size="11" fill="#6b7280" text-anchor="end">(Article 50)</text>
  <circle cx="413" cy="160" r="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="413" y1="152" x2="413" y2="134" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="407" y="98" font-size="12" fill="#1f2937" font-weight="bold">2 Dec 2026</text>
  <text x="407" y="114" font-size="11" fill="#6b7280">Marking deadline,</text>
  <text x="407" y="128" font-size="11" fill="#6b7280">existing systems</text>
  <circle cx="573" cy="160" r="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="573" y1="168" x2="573" y2="186" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="573" y="204" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">2 Dec 2027</text>
  <text x="573" y="220" font-size="11" fill="#6b7280" text-anchor="middle">High-risk systems,</text>
  <text x="573" y="234" font-size="11" fill="#6b7280" text-anchor="middle">Annex III</text>
  <circle cx="680" cy="160" r="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="680" y1="152" x2="680" y2="134" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="680" y="98" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">2 Aug 2028</text>
  <text x="680" y="114" font-size="11" fill="#6b7280" text-anchor="end">High-risk AI in regulated</text>
  <text x="680" y="128" font-size="11" fill="#6b7280" text-anchor="end">products</text>
  <line x1="390" y1="62" x2="390" y2="190" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="390" y="56" font-size="12" fill="#4f46e5" text-anchor="middle" font-weight="bold">Today, 9 Oct 2026</text>
  <circle cx="48" cy="276" r="6" fill="#15803d" stroke="#15803d" stroke-width="1.5"/>
  <text x="62" y="280" font-size="11" fill="#6b7280">already applies</text>
  <circle cx="180" cy="276" r="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="194" y="280" font-size="11" fill="#6b7280">still ahead</text>
</svg>
