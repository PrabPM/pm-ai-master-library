<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>LoRA adds a low-rank update next to a frozen weight</title>
  <rect x="0" y="0" width="720" height="330" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">One 4,096 x 4,096 layer with a rank-8 LoRA update</text>
  <rect x="40" y="56" width="200" height="200" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
  <text x="140" y="142" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">W0</text>
  <text x="140" y="164" font-size="12" fill="#6b7280" text-anchor="middle">frozen</text>
  <text x="140" y="184" font-size="12" fill="#1f2937" text-anchor="middle">16,777,216 numbers</text>
  <text x="140" y="276" font-size="11" fill="#6b7280" text-anchor="middle">4,096 columns (k)</text>
  <text x="270" y="162" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">+</text>
  <rect x="304" y="56" width="22" height="200" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="315" y="276" font-size="14" fill="#4f46e5" text-anchor="middle" font-weight="bold">B</text>
  <text x="315" y="294" font-size="11" fill="#6b7280" text-anchor="middle">4,096 x 8</text>
  <text x="350" y="162" font-size="14" fill="#1f2937" text-anchor="middle">x</text>
  <rect x="374" y="145" width="200" height="22" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="474" y="192" font-size="14" fill="#4f46e5" text-anchor="middle" font-weight="bold">A</text>
  <text x="474" y="210" font-size="11" fill="#6b7280" text-anchor="middle">8 x 4,096</text>
  <text x="374" y="82" font-size="12" fill="#1f2937">trainable: 8 x (4,096 + 4,096)</text>
  <text x="374" y="102" font-size="12" fill="#1f2937" font-weight="bold">= 65,536 numbers, 256 times fewer</text>
  <rect x="596" y="110" width="100" height="92" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="608" y="132" font-size="11" fill="#1f2937">B starts at</text>
  <text x="608" y="147" font-size="11" fill="#1f2937">zero, so</text>
  <text x="608" y="162" font-size="11" fill="#1f2937">training starts</text>
  <text x="608" y="177" font-size="11" fill="#1f2937">from the base</text>
  <text x="608" y="192" font-size="11" fill="#1f2937">model.</text>
  <text x="24" y="318" font-size="13" fill="#1f2937">Output of the layer:  h = W0 x + (alpha / r) B A x</text>
</svg>
