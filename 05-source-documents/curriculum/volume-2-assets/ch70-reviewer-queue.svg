<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A reviewer queue with due times and a case panel with evidence</title>
  <rect x="0" y="0" width="720" height="440" rx="6" fill="#ffffff"/>
  <rect x="12" y="12" width="696" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="24" y="37" font-size="14" fill="#1f2937" font-weight="bold">Review queue</text>
  <text x="696" y="37" font-size="11" fill="#6b7280" text-anchor="end">23 waiting · oldest 7 min · mean wait 0.6 min · 15 reviewers on</text>
  <rect x="12" y="60" width="300" height="292" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="22" y="70" width="280" height="58" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="32" y="92" font-size="12" fill="#1f2937" font-weight="bold">PY-20931</text>
  <text x="292" y="92" font-size="11" fill="#1f2937" text-anchor="end">USD 640.00</text>
  <text x="32" y="114" font-size="11" fill="#6b7280">Score in unsure band</text>
  <rect x="204" y="99" width="88" height="22" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="248.0" y="114" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold">Due in 2 min</text>
  <rect x="22" y="134" width="280" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="156" font-size="12" fill="#1f2937" font-weight="bold">KYB-1182</text>
  <text x="292" y="156" font-size="11" fill="#1f2937" text-anchor="end">New merchant</text>
  <text x="32" y="178" font-size="11" fill="#6b7280">Name mismatch 0.71</text>
  <rect x="204" y="163" width="88" height="22" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="248.0" y="178" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold">Due in 9 min</text>
  <rect x="22" y="198" width="280" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="220" font-size="12" fill="#1f2937" font-weight="bold">PY-20944</text>
  <text x="292" y="220" font-size="11" fill="#1f2937" text-anchor="end">USD 5,200.00</text>
  <text x="32" y="242" font-size="11" fill="#6b7280">Above auto limit</text>
  <rect x="197" y="227" width="95" height="22" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
  <text x="244.5" y="242" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">Due in 14 min</text>
  <rect x="22" y="262" width="280" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="284" font-size="12" fill="#1f2937" font-weight="bold">DP-3307</text>
  <text x="292" y="284" font-size="11" fill="#1f2937" text-anchor="end">USD 640.00</text>
  <text x="32" y="306" font-size="11" fill="#6b7280">Evidence incomplete</text>
  <rect x="217" y="291" width="75" height="22" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
  <text x="254.5" y="306" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">Due in 3 h</text>
  <text x="24" y="340" font-size="11" fill="#6b7280">Sorted by time left, not arrival</text>
  <rect x="324" y="60" width="384" height="292" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="338" y="84" font-size="12" fill="#1f2937" font-weight="bold">PY-20931 · USD 640.00 · Northwind Outfitters</text>
  <rect x="336" y="94" width="360" height="46" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="346" y="113" font-size="11" fill="#b45309" font-weight="bold">Why you are seeing this</text>
  <text x="346" y="130" font-size="11" fill="#1f2937">Score 0.46 is inside the unsure band, 0.30 to 0.60.</text>
  <text x="338" y="160" font-size="12" fill="#1f2937" font-weight="bold">Evidence</text>
  <text x="346" y="180" font-size="11" fill="#1f2937">· Card country matches the delivery country</text>
  <text x="346" y="198" font-size="11" fill="#1f2937">· First order from this device</text>
  <text x="346" y="216" font-size="11" fill="#1f2937">· 3 payments from this card in the last hour</text>
  <text x="338" y="248" font-size="11" fill="#6b7280">Model suggests: approve with a 3-D Secure check</text>
  <rect x="336" y="262" width="104" height="30" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="388.0" y="281.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Approve  (A)</text>
  <rect x="448" y="262" width="92" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="494.0" y="281.0" font-size="11" fill="#1f2937" text-anchor="middle">Block  (B)</text>
  <rect x="548" y="262" width="148" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="622.0" y="281.0" font-size="11" fill="#1f2937" text-anchor="middle">Ask the merchant  (M)</text>
  <rect x="336" y="304" width="360" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="346" y="327" font-size="11" fill="#1f2937">Over USD 5,000: a second reviewer must confirm.</text>
  <circle cx="312" cy="74" r="10" fill="#4f46e5"/>
  <text x="312" y="78" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="696" cy="104" r="10" fill="#b45309"/>
  <text x="696" y="108" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="696" cy="270" r="10" fill="#4f46e5"/>
  <text x="696" y="274" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="696" cy="314" r="10" fill="#4f46e5"/>
  <text x="696" y="318" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <circle cx="22" cy="374" r="10" fill="#4f46e5"/>
  <text x="22" y="378" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="40" y="378" font-size="11" fill="#1f2937">Time left against the promise is on every row.</text>
  <circle cx="370" cy="374" r="10" fill="#b45309"/>
  <text x="370" y="378" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="388" y="378" font-size="11" fill="#1f2937">The reason for the handoff comes first.</text>
  <circle cx="22" cy="400" r="10" fill="#4f46e5"/>
  <text x="22" y="404" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="40" y="404" font-size="11" fill="#1f2937">One keystroke per decision keeps handling time low.</text>
  <circle cx="370" cy="400" r="10" fill="#4f46e5"/>
  <text x="370" y="404" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="388" y="404" font-size="11" fill="#1f2937">Maker-checker for large amounts.</text>
</svg>
