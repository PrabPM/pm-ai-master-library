<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The RAG pipeline and the three places it fails</title>
  <rect x="0" y="0" width="720" height="330" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="13" fill="#1f2937" font-weight="bold">Offline, once per document change</text>
  <rect x="24" y="42" width="150" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="99" y="67" font-size="13" fill="#1f2937" text-anchor="middle">Documents</text>
  <rect x="196" y="42" width="150" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="271" y="67" font-size="13" fill="#1f2937" text-anchor="middle">Chunk</text>
  <rect x="368" y="42" width="150" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="443" y="67" font-size="13" fill="#1f2937" text-anchor="middle">Embed</text>
  <rect x="540" y="42" width="150" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="615" y="67" font-size="13" fill="#1f2937" text-anchor="middle">Index</text>
  <line x1="176" y1="62" x2="194" y2="62" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="194.0,62.0 187.1,66.1 187.1,57.9" fill="#6b7280"/>
  <line x1="348" y1="62" x2="366" y2="62" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="366.0,62.0 359.1,66.1 359.1,57.9" fill="#6b7280"/>
  <line x1="520" y1="62" x2="538" y2="62" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="538.0,62.0 531.1,66.1 531.1,57.9" fill="#6b7280"/>
  <text x="24" y="118" font-size="13" fill="#1f2937" font-weight="bold">Online, for every question</text>
  <rect x="24" y="132" width="116" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="82" y="157" font-size="12" fill="#1f2937" text-anchor="middle">Question</text>
  <rect x="160" y="132" width="116" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="218" y="157" font-size="12" fill="#1f2937" text-anchor="middle">Retrieve top k</text>
  <rect x="296" y="132" width="116" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="354" y="157" font-size="12" fill="#1f2937" text-anchor="middle">Rerank</text>
  <rect x="432" y="132" width="116" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="490" y="157" font-size="12" fill="#1f2937" text-anchor="middle">Prompt + chunks</text>
  <rect x="568" y="132" width="116" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="626" y="157" font-size="12" fill="#1f2937" text-anchor="middle">Cited answer</text>
  <line x1="142" y1="152" x2="157" y2="152" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="157.0,152.0 150.1,156.1 150.1,147.9" fill="#6b7280"/>
  <line x1="278" y1="152" x2="293" y2="152" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="293.0,152.0 286.1,156.1 286.1,147.9" fill="#6b7280"/>
  <line x1="414" y1="152" x2="429" y2="152" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="429.0,152.0 422.1,156.1 422.1,147.9" fill="#6b7280"/>
  <line x1="550" y1="152" x2="565" y2="152" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="565.0,152.0 558.1,156.1 558.1,147.9" fill="#6b7280"/>
  <line x1="615" y1="82" x2="615" y2="104" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="218" y1="104" x2="615" y2="104" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="218" y1="104" x2="218" y2="130" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="218.0,130.0 213.9,123.1 222.1,123.1" fill="#6b7280"/>
  <circle cx="218" cy="184" r="10" fill="#b91c1c"/>
  <text x="218" y="188" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="490" cy="184" r="10" fill="#b91c1c"/>
  <text x="490" y="188" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="626" cy="184" r="10" fill="#b91c1c"/>
  <text x="626" y="188" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="34" cy="218" r="10" fill="#b91c1c"/>
  <text x="34" y="222" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="52" y="222" font-size="12" fill="#1f2937">Retrieval miss. The chunk that holds the answer is not in the top k, so nothing downstream can use it.</text>
  <circle cx="34" cy="242" r="10" fill="#b91c1c"/>
  <text x="34" y="246" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="52" y="246" font-size="12" fill="#1f2937">Context loss. The chunk was retrieved but ranked below the cut, trimmed to fit, or split across two chunks.</text>
  <circle cx="34" cy="266" r="10" fill="#b91c1c"/>
  <text x="34" y="270" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="52" y="270" font-size="12" fill="#1f2937">Generation. The model answers beyond the chunks, or against them, or cites a chunk that does not say it.</text>
</svg>
