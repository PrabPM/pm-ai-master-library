<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Launch tiers and the nine-week timeline for the Instant Payouts launch</title>
  <rect x="0" y="0" width="720" height="470" rx="6" fill="#ffffff"/>
  <text x="16" y="26" font-size="13" fill="#1f2937" font-weight="bold">Three launch tiers</text>
  <rect x="16" y="36" width="224" height="64" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="28" y="56" font-size="12" fill="#1f2937" font-weight="bold">Tier 1</text>
  <text x="228" y="56" font-size="11" fill="#6b7280" text-anchor="end">This launch</text>
  <text x="28" y="74" font-size="11" fill="#1f2937">Full campaign, press, sales and</text>
  <text x="28" y="88" font-size="11" fill="#1f2937">support training</text>
  <rect x="248" y="36" width="224" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="260" y="56" font-size="12" fill="#1f2937" font-weight="bold">Tier 2</text>
  <text x="460" y="56" font-size="11" fill="#6b7280" text-anchor="end">A few a quarter</text>
  <text x="260" y="74" font-size="11" fill="#1f2937">Targeted email, in-app message, help</text>
  <text x="260" y="88" font-size="11" fill="#1f2937">article</text>
  <rect x="480" y="36" width="224" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="492" y="56" font-size="12" fill="#1f2937" font-weight="bold">Tier 3</text>
  <text x="692" y="56" font-size="11" fill="#6b7280" text-anchor="end">Most releases</text>
  <text x="492" y="74" font-size="11" fill="#1f2937">Release notes and a changelog entry</text>
  <text x="16" y="128" font-size="13" fill="#1f2937" font-weight="bold">Tier 1 timeline: Instant Payouts, general availability Tuesday, November 17, 2026</text>
  <text x="150" y="152" font-size="11" fill="#6b7280" text-anchor="middle">Oct 13</text>
  <line x1="150" y1="158" x2="150" y2="318" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="270" y="152" font-size="11" fill="#6b7280" text-anchor="middle">Oct 27</text>
  <line x1="270" y1="158" x2="270" y2="318" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="330" y="152" font-size="11" fill="#6b7280" text-anchor="middle">Nov 3</text>
  <line x1="330" y1="158" x2="330" y2="318" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="390" y="152" font-size="11" fill="#6b7280" text-anchor="middle">Nov 10</text>
  <line x1="390" y1="158" x2="390" y2="318" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="450" y="152" font-size="11" fill="#6b7280" text-anchor="middle">Nov 17</text>
  <line x1="450" y1="158" x2="450" y2="318" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="570" y="152" font-size="11" fill="#6b7280" text-anchor="middle">Dec 1</text>
  <line x1="570" y1="158" x2="570" y2="318" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="690" y="152" font-size="11" fill="#6b7280" text-anchor="middle">Dec 15</text>
  <line x1="690" y1="158" x2="690" y2="318" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="152" y="162" width="176" height="22" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="240.0" y="177" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold">Prepare</text>
  <rect x="332" y="162" width="56" height="22" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="360.0" y="177" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold">Internal</text>
  <rect x="392" y="162" width="56" height="22" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="420.0" y="177" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold">Soft</text>
  <rect x="452" y="162" width="236" height="22" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="570.0" y="177" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold">Live and learn</text>
  <text x="16" y="208" font-size="11" fill="#1f2937" font-weight="bold">Product</text>
  <line x1="150" y1="204" x2="690" y2="204" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="150" cy="204" r="10" fill="#4f46e5"/>
  <text x="150" y="208" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="390" cy="204" r="10" fill="#4f46e5"/>
  <text x="390" y="208" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="450" cy="204" r="10" fill="#4f46e5"/>
  <text x="450" y="208" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="16" y="234" font-size="11" fill="#1f2937" font-weight="bold">Marketing</text>
  <line x1="150" y1="230" x2="690" y2="230" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="150" cy="230" r="10" fill="#4f46e5"/>
  <text x="150" y="234" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <circle cx="270" cy="230" r="10" fill="#4f46e5"/>
  <text x="270" y="234" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <circle cx="450" cy="230" r="10" fill="#4f46e5"/>
  <text x="450" y="234" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
  <text x="16" y="260" font-size="11" fill="#1f2937" font-weight="bold">Sales and support</text>
  <line x1="150" y1="256" x2="690" y2="256" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="330" cy="256" r="10" fill="#4f46e5"/>
  <text x="330" y="260" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text>
  <text x="16" y="286" font-size="11" fill="#1f2937" font-weight="bold">Comms</text>
  <line x1="150" y1="282" x2="690" y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="330" cy="282" r="10" fill="#4f46e5"/>
  <text x="330" y="286" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text>
  <circle cx="450" cy="282" r="10" fill="#4f46e5"/>
  <text x="450" y="286" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">9</text>
  <text x="16" y="312" font-size="11" fill="#1f2937" font-weight="bold">Everyone</text>
  <line x1="150" y1="308" x2="690" y2="308" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="416" cy="308" r="10" fill="#4f46e5"/>
  <text x="416" y="312" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">10</text>
  <circle cx="570" cy="308" r="10" fill="#4f46e5"/>
  <text x="570" y="312" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">11</text>
  <circle cx="690" cy="308" r="10" fill="#4f46e5"/>
  <text x="690" y="312" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">12</text>
  <circle cx="26" cy="342" r="10" fill="#4f46e5"/>
  <text x="26" y="346" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="44" y="346" font-size="11" fill="#1f2937">Beta fixes done; limits and kill switch tested</text>
  <circle cx="26" cy="363" r="10" fill="#4f46e5"/>
  <text x="26" y="367" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="44" y="367" font-size="11" fill="#1f2937">Soft launch to 10% of eligible food and drink shops</text>
  <circle cx="26" cy="384" r="10" fill="#4f46e5"/>
  <text x="26" y="388" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="44" y="388" font-size="11" fill="#1f2937">General availability</text>
  <circle cx="26" cy="405" r="10" fill="#4f46e5"/>
  <text x="26" y="409" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="44" y="409" font-size="11" fill="#1f2937">Message house frozen</text>
  <circle cx="26" cy="426" r="10" fill="#4f46e5"/>
  <text x="26" y="430" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <text x="44" y="430" font-size="11" fill="#1f2937">Landing page, emails and ads ready; tracking tested</text>
  <circle cx="26" cy="447" r="10" fill="#4f46e5"/>
  <text x="26" y="451" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
  <text x="44" y="451" font-size="11" fill="#1f2937">Campaign live</text>
  <circle cx="378" cy="342" r="10" fill="#4f46e5"/>
  <text x="378" y="346" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text>
  <text x="396" y="346" font-size="11" fill="#1f2937">Internal launch: every rep and agent trained</text>
  <circle cx="378" cy="363" r="10" fill="#4f46e5"/>
  <text x="378" y="367" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text>
  <text x="396" y="367" font-size="11" fill="#1f2937">Press briefings begin, under embargo</text>
  <circle cx="378" cy="384" r="10" fill="#4f46e5"/>
  <text x="378" y="388" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">9</text>
  <text x="396" y="388" font-size="11" fill="#1f2937">Embargo lifts at 9:00 am Eastern</text>
  <circle cx="378" cy="405" r="10" fill="#4f46e5"/>
  <text x="378" y="409" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">10</text>
  <text x="396" y="409" font-size="11" fill="#1f2937">Go or no-go meeting, Friday, November 13</text>
  <circle cx="378" cy="426" r="10" fill="#4f46e5"/>
  <text x="378" y="430" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">11</text>
  <text x="396" y="430" font-size="11" fill="#1f2937">Two-week readout</text>
  <circle cx="378" cy="447" r="10" fill="#4f46e5"/>
  <text x="378" y="451" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">12</text>
  <text x="396" y="451" font-size="11" fill="#1f2937">Post-launch review</text>
</svg>
