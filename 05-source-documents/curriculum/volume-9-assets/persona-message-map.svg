<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Three people in the buying decision and the message each one needs</title>
  <rect x="0" y="0" width="720" height="332" rx="6" fill="#ffffff"/>
  <rect x="16" y="14" width="150" height="28" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="26" y="33" font-size="12" fill="#4f46e5" font-weight="bold">Person</text>
  <rect x="170" y="14" width="148" height="28" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="180" y="33" font-size="12" fill="#4f46e5" font-weight="bold">Their worry</text>
  <rect x="322" y="14" width="84" height="28" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="332" y="33" font-size="12" fill="#4f46e5" font-weight="bold">Lead with</text>
  <rect x="410" y="14" width="156" height="28" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="420" y="33" font-size="12" fill="#4f46e5" font-weight="bold">Proof to show</text>
  <rect x="570" y="14" width="134" height="28" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="580" y="33" font-size="12" fill="#4f46e5" font-weight="bold">Where they hear it</text>
  <!-- Maya Okafor -->
  <rect x="16" y="50" width="150" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="170" y="50" width="148" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="322" y="50" width="84" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="410" y="50" width="156" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="570" y="50" width="134" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="26" y="74" font-size="13" fill="#1f2937" font-weight="bold">Maya Okafor</text>
  <text x="26" y="94" font-size="11" fill="#6b7280">Owner of Juniper Bakery.</text>
  <text x="26" y="109" font-size="11" fill="#6b7280">Buys it and uses it.</text>
  <text x="180" y="74" font-size="11" fill="#1f2937" font-style="italic">"Can I pay Hillside Mills</text>
  <text x="180" y="89" font-size="11" fill="#1f2937" font-style="italic">on Monday?"</text>
  <rect x="332" y="81" width="64" height="22" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="364.0" y="96" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">Fast</text>
  <text x="420" y="74" font-size="11" fill="#1f2937">4,832 of 4,960 beta</text>
  <text x="420" y="89" font-size="11" fill="#1f2937">payouts arrived within 30</text>
  <text x="420" y="104" font-size="11" fill="#1f2937">minutes</text>
  <text x="580" y="74" font-size="11" fill="#1f2937">Dashboard banner</text>
  <text x="580" y="89" font-size="11" fill="#1f2937">and the Sunday</text>
  <text x="580" y="104" font-size="11" fill="#1f2937">evening email</text>
  <!-- Luis Ortega -->
  <rect x="16" y="142" width="150" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="170" y="142" width="148" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="322" y="142" width="84" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="410" y="142" width="156" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="570" y="142" width="134" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="26" y="166" font-size="13" fill="#1f2937" font-weight="bold">Luis Ortega</text>
  <text x="26" y="186" font-size="11" fill="#6b7280">Owner of Casa Verde,</text>
  <text x="26" y="201" font-size="11" fill="#6b7280">four taquerias. Buys it;</text>
  <text x="26" y="216" font-size="11" fill="#6b7280">his managers use it.</text>
  <text x="180" y="166" font-size="11" fill="#1f2937" font-style="italic">"What will it cost across</text>
  <text x="180" y="181" font-size="11" fill="#1f2937" font-style="italic">four shops, and who can</text>
  <text x="180" y="196" font-size="11" fill="#1f2937" font-style="italic">press the button?"</text>
  <rect x="332" y="173" width="64" height="22" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="364.0" y="188" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">Clear</text>
  <text x="420" y="166" font-size="11" fill="#1f2937">Fee preview, a daily limit,</text>
  <text x="420" y="181" font-size="11" fill="#1f2937">and permissions for each</text>
  <text x="420" y="196" font-size="11" fill="#1f2937">manager</text>
  <text x="580" y="166" font-size="11" fill="#1f2937">Sales call and a</text>
  <text x="580" y="181" font-size="11" fill="#1f2937">one-page summary</text>
  <!-- Ruth Castillo -->
  <rect x="16" y="234" width="150" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="170" y="234" width="148" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="322" y="234" width="84" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="410" y="234" width="156" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="570" y="234" width="134" height="84" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="26" y="258" font-size="13" fill="#1f2937" font-weight="bold">Ruth Castillo</text>
  <text x="26" y="278" font-size="11" fill="#6b7280">Bookkeeper for 30 food</text>
  <text x="26" y="293" font-size="11" fill="#6b7280">businesses. Influences</text>
  <text x="26" y="308" font-size="11" fill="#6b7280">the choice.</text>
  <text x="180" y="258" font-size="11" fill="#1f2937" font-style="italic">"Is this debt? Will it</text>
  <text x="180" y="273" font-size="11" fill="#1f2937" font-style="italic">break my reconciliation?"</text>
  <rect x="332" y="265" width="64" height="22" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="364.0" y="280" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">Yours</text>
  <text x="420" y="258" font-size="11" fill="#1f2937">Not a loan. Every payout</text>
  <text x="420" y="273" font-size="11" fill="#1f2937">and fee is its own line in</text>
  <text x="420" y="288" font-size="11" fill="#1f2937">the export</text>
  <text x="580" y="258" font-size="11" fill="#1f2937">Bookkeeper webinar</text>
  <text x="580" y="273" font-size="11" fill="#1f2937">and partner newsletter</text>
</svg>
