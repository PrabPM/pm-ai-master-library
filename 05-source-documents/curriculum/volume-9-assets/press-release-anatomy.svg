<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A short press release with eight parts numbered and explained</title>
  <rect x="0" y="0" width="720" height="386" rx="6" fill="#ffffff"/>
  <rect x="16" y="12" width="418" height="362" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="52" y="38" font-size="13" fill="#1f2937" font-weight="bold">PayFlow puts weekend card sales in a small shop's bank</text>
  <text x="52" y="55" font-size="13" fill="#1f2937" font-weight="bold">within 30 minutes</text>
  <text x="52" y="84" font-size="11" fill="#1f2937" font-style="italic">Instant Payouts works nights, weekends and holidays for a 1% fee</text>
  <text x="52" y="111" font-size="11" fill="#1f2937">AUSTIN, Texas, November 17, 2026. PayFlow today launched Instant</text>
  <text x="52" y="126" font-size="11" fill="#1f2937">Payouts, which moves a merchant's available balance to a debit card</text>
  <text x="52" y="141" font-size="11" fill="#1f2937">within 30 minutes, on any day.</text>
  <text x="52" y="168" font-size="11" fill="#1f2937">Card sales from Friday to Sunday usually reach a shop's bank on</text>
  <text x="52" y="183" font-size="11" fill="#1f2937">Tuesday, after Monday's supplier bills are due.</text>
  <text x="52" y="210" font-size="11" fill="#1f2937">In an eight-week beta, 4,832 of 4,960 instant payouts arrived within 30</text>
  <text x="52" y="225" font-size="11" fill="#1f2937">minutes. The fee is shown before the merchant confirms.</text>
  <text x="52" y="252" font-size="11" fill="#1f2937">"I paid my flour supplier on Monday from Sunday's sales," said Maya</text>
  <text x="52" y="267" font-size="11" fill="#1f2937">Okafor, owner of Juniper Bakery.</text>
  <text x="52" y="294" font-size="11" fill="#1f2937">Available today to eligible US merchants. The fee is 1% of the amount</text>
  <text x="52" y="309" font-size="11" fill="#1f2937">paid out. Standard payouts remain free.</text>
  <text x="52" y="336" font-size="11" fill="#6b7280">About PayFlow: one paragraph that never changes. Press contact:</text>
  <text x="52" y="351" font-size="11" fill="#6b7280">Dana Kim, press@payflow.example</text>
  <circle cx="34" cy="34" r="10" fill="#4f46e5"/>
  <text x="34" y="38" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="34" cy="80" r="10" fill="#4f46e5"/>
  <text x="34" y="84" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="34" cy="107" r="10" fill="#4f46e5"/>
  <text x="34" y="111" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="34" cy="164" r="10" fill="#4f46e5"/>
  <text x="34" y="168" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <circle cx="34" cy="206" r="10" fill="#4f46e5"/>
  <text x="34" y="210" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <circle cx="34" cy="248" r="10" fill="#4f46e5"/>
  <text x="34" y="252" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
  <circle cx="34" cy="290" r="10" fill="#4f46e5"/>
  <text x="34" y="294" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text>
  <circle cx="34" cy="332" r="10" fill="#4f46e5"/>
  <text x="34" y="336" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text>
  <text x="452" y="34" font-size="13" fill="#1f2937" font-weight="bold">What each part is for</text>
  <circle cx="458" cy="58" r="10" fill="#4f46e5"/>
  <text x="458" y="62" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="476" y="62" font-size="11" fill="#1f2937">Headline: who did what, and the benefit. No</text>
  <text x="476" y="77" font-size="11" fill="#1f2937">adjectives.</text>
  <circle cx="458" cy="101" r="10" fill="#4f46e5"/>
  <text x="458" y="105" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="476" y="105" font-size="11" fill="#1f2937">Subhead: the second most useful fact.</text>
  <circle cx="458" cy="129" r="10" fill="#4f46e5"/>
  <text x="458" y="133" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="476" y="133" font-size="11" fill="#1f2937">Lead: the whole story in one sentence, with</text>
  <text x="476" y="148" font-size="11" fill="#1f2937">place and date.</text>
  <circle cx="458" cy="172" r="10" fill="#4f46e5"/>
  <text x="458" y="176" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="476" y="176" font-size="11" fill="#1f2937">The problem, in the customer's own terms.</text>
  <circle cx="458" cy="200" r="10" fill="#4f46e5"/>
  <text x="458" y="204" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <text x="476" y="204" font-size="11" fill="#1f2937">How it works, with a number a reporter can</text>
  <text x="476" y="219" font-size="11" fill="#1f2937">check.</text>
  <circle cx="458" cy="243" r="10" fill="#4f46e5"/>
  <text x="458" y="247" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
  <text x="476" y="247" font-size="11" fill="#1f2937">A customer quote that says what a</text>
  <text x="476" y="262" font-size="11" fill="#1f2937">specification cannot.</text>
  <circle cx="458" cy="286" r="10" fill="#4f46e5"/>
  <text x="458" y="290" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text>
  <text x="476" y="290" font-size="11" fill="#1f2937">Price, who can get it, and from when.</text>
  <circle cx="458" cy="314" r="10" fill="#4f46e5"/>
  <text x="458" y="318" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text>
  <text x="476" y="318" font-size="11" fill="#1f2937">Boilerplate and a named contact.</text>
</svg>
