<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Wireframe of the payouts pricing page with four design choices marked</title>
  <rect x="0" y="0" width="720" height="424" rx="6" fill="#ffffff"/>
  <!-- browser frame -->
  <rect x="16" y="16" width="444" height="392" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="34" cy="32" r="4" fill="#cbd5e1"/>
  <circle cx="48" cy="32" r="4" fill="#cbd5e1"/>
  <circle cx="62" cy="32" r="4" fill="#cbd5e1"/>
  <line x1="16" y1="46" x2="460" y2="46" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="74" font-size="15" fill="#1f2937" font-weight="bold">Payouts pricing</text>
  <!-- standard card -->
  <rect x="36" y="88" width="196" height="178" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="112" font-size="13" fill="#1f2937" font-weight="bold">Standard</text>
  <text x="50" y="138" font-size="16" fill="#1f2937" font-weight="bold">Free</text>
  <text x="50" y="160" font-size="11" fill="#6b7280">Arrives in 2 business days</text>
  <circle cx="53" cy="180" r="2" fill="#6b7280"/>
  <text x="62" y="184" font-size="11" fill="#1f2937">Sent automatically every day</text>
  <circle cx="53" cy="200" r="2" fill="#6b7280"/>
  <text x="62" y="204" font-size="11" fill="#1f2937">No limit</text>
  <!-- instant card -->
  <rect x="244" y="88" width="196" height="178" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="258" y="112" font-size="13" fill="#1f2937" font-weight="bold">Instant</text>
  <text x="258" y="138" font-size="16" fill="#1f2937" font-weight="bold">1% of the amount</text>
  <text x="258" y="160" font-size="11" fill="#6b7280">Arrives within 30 minutes</text>
  <circle cx="261" cy="180" r="2" fill="#6b7280"/>
  <text x="270" y="184" font-size="11" fill="#1f2937">Nights, weekends, holidays</text>
  <circle cx="261" cy="200" r="2" fill="#6b7280"/>
  <text x="270" y="204" font-size="11" fill="#1f2937">To your debit card</text>
  <rect x="258" y="224" width="168" height="30" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="342.0" y="243.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Get paid now</text>
  <!-- calculator -->
  <rect x="36" y="278" width="404" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="302" font-size="12" fill="#1f2937" font-weight="bold">Pay out $1,850.00 now</text>
  <text x="50" y="322" font-size="12" fill="#1f2937">Fee $18.50</text>
  <text x="140" y="322" font-size="12" fill="#1f2937">You receive $1,831.50</text>
  <text x="36" y="360" font-size="11" fill="#6b7280">Available after 60 days on PayFlow, up to $10,000 a day. Most instant payouts</text>
  <text x="36" y="375" font-size="11" fill="#6b7280">arrive within 30 minutes; a few take longer.</text>
  <!-- callouts -->
  <circle cx="426" cy="104" r="10" fill="#4f46e5"/>
  <text x="426" y="108" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="218" cy="104" r="10" fill="#4f46e5"/>
  <text x="218" y="108" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="426" cy="294" r="10" fill="#4f46e5"/>
  <text x="426" y="298" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="446" cy="384" r="10" fill="#4f46e5"/>
  <text x="446" y="388" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="480" y="36" font-size="13" fill="#1f2937" font-weight="bold">Why it is built this way</text>
  <circle cx="486" cy="60" r="10" fill="#4f46e5"/>
  <text x="486" y="64" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="504" y="64" font-size="11" fill="#1f2937">The fee grows with the amount</text>
  <text x="504" y="79" font-size="11" fill="#1f2937">moved. That is the value metric, so a</text>
  <text x="504" y="94" font-size="11" fill="#1f2937">small shop pays little and a busy one</text>
  <text x="504" y="109" font-size="11" fill="#1f2937">pays more.</text>
  <circle cx="486" cy="132" r="10" fill="#4f46e5"/>
  <text x="486" y="136" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="504" y="136" font-size="11" fill="#1f2937">The free option sits beside it. It is an</text>
  <text x="504" y="151" font-size="11" fill="#1f2937">honest alternative and it makes 1%</text>
  <text x="504" y="166" font-size="11" fill="#1f2937">easy to judge.</text>
  <circle cx="486" cy="189" r="10" fill="#4f46e5"/>
  <text x="486" y="193" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="504" y="193" font-size="11" fill="#1f2937">A worked amount removes fee</text>
  <text x="504" y="208" font-size="11" fill="#1f2937">surprise before the merchant commits.</text>
  <circle cx="486" cy="231" r="10" fill="#4f46e5"/>
  <text x="486" y="235" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="504" y="235" font-size="11" fill="#1f2937">Limits and the words "most payouts"</text>
  <text x="504" y="250" font-size="11" fill="#1f2937">are on the page, not hidden in terms.</text>
</svg>
