  <text x="400" y="168" font-size="11" fill="#1f2937">Landing page, emails and ads approved</text>
  <circle cx="384" cy="186" r="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <path d="M379 186 l3 3 l6 -7" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
