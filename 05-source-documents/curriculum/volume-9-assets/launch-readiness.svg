  <text x="692" y="220" font-size="11" fill="#6b7280" text-anchor="end">Owner: Dana</text>
  <circle cx="384" cy="236" r="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <path d="M379 236 l3 3 l6 -7" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="240" font-size="11" fill="#1f2937">Press release and FAQ approved</text>
  <circle cx="384" cy="258" r="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
