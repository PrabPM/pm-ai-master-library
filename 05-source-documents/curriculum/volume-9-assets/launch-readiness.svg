<svg xmlns="http://www.w3.org/2000/svg" width="720" height="412" viewBox="0 0 720 412" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Launch readiness card with thirteen checks and a go decision</title>
  <rect x="0" y="0" width="720" height="412" rx="6" fill="#ffffff"/>
  <rect x="12" y="12" width="696" height="388" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
