  <circle cx="384" cy="308" r="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <path d="M379 308 l3 3 l6 -7" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="312" font-size="11" fill="#1f2937">Dashboard live; 10% holdout group set</text>
