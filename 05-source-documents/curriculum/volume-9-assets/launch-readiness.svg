  <rect x="28" y="334" width="664" height="52" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="42" y="356" font-size="13" fill="#1f2937" font-weight="bold">Decision: go on Tuesday, November 17.</text>
  <text x="42" y="375" font-size="12" fill="#1f2937">Condition: the Spanish help article is live by Monday, November 16. Owner: Sam.</text>
