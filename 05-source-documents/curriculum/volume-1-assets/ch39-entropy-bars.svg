<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Joint entropy split two ways</title>
  <rect x="0" y="0" width="720" height="300" rx="6" fill="#ffffff"/>
  <text x="24" y="30" font-size="14" fill="#1f2937" font-weight="bold">Region X and outcome Y: 1.186 bits of uncertainty in the pair</text>
  <text x="24" y="77" font-size="12" fill="#6b7280">the pair</text>
  <text x="24" y="137" font-size="12" fill="#6b7280">region first</text>
  <text x="24" y="197" font-size="12" fill="#6b7280">outcome first</text>
  <rect x="150" y="52" width="540" height="40" rx="6" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <text x="420" y="77" font-size="12" fill="#1f2937" text-anchor="middle">H(X,Y) = 1.186</text>
  <rect x="150" y="112" width="317" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="308" y="137" font-size="12" fill="#1f2937" text-anchor="middle">H(X) = 0.696</text>
  <rect x="467" y="112" width="223" height="40" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="578" y="137" font-size="12" fill="#1f2937" text-anchor="middle">H(Y|X) = 0.490</text>
  <rect x="150" y="172" width="293" height="40" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="296" y="197" font-size="12" fill="#1f2937" text-anchor="middle">H(X|Y) = 0.643</text>
  <rect x="443" y="172" width="247" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="566" y="197" font-size="12" fill="#1f2937" text-anchor="middle">H(Y) = 0.544</text>
  <!-- overlap band -->
  <line x1="443" y1="104" x2="443" y2="236" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="467" y1="104" x2="467" y2="236" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="443" y1="236" x2="467" y2="236" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="455.0" y="256" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">overlap: I(X;Y) = 0.054 bits</text>
  <text x="455.0" y="276" font-size="12" fill="#6b7280" text-anchor="middle">H(X) and H(Y) both count it; the pair counts it once</text>
</svg>
