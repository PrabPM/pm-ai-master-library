<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>1,000 payments split by two events: large and fraud</title>
  <rect x="0" y="0" width="720" height="300" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">One day of PayFlow payments as a sample space</text>
  <rect x="24" y="44" width="430" height="236" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="66" font-size="12" fill="#1f2937" font-weight="bold">All 1,000 payments</text>
  <text x="38" y="266" font-size="12" fill="#6b7280">888 are neither large nor fraud</text>
  <!-- event: large -->
  <rect x="52" y="84" width="250" height="150" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="66" y="106" font-size="12" fill="#4f46e5" font-weight="bold">Large (over USD 500): 100</text>
  <text x="66" y="170" font-size="12" fill="#1f2937">92 large,</text>
  <text x="66" y="186" font-size="12" fill="#1f2937">not fraud</text>
  <!-- event: fraud -->
  <rect x="236" y="130" width="190" height="104" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="316" y="152" font-size="12" fill="#b91c1c" font-weight="bold">Fraud: 20</text>
  <text x="316" y="196" font-size="12" fill="#1f2937">12 fraud,</text>
  <text x="316" y="212" font-size="12" fill="#1f2937">not large</text>
  <!-- overlap -->
  <rect x="236" y="130" width="66" height="104" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="269" y="180" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">8</text>
  <text x="269" y="198" font-size="12" fill="#1f2937" text-anchor="middle">both</text>
  <!-- counts to probabilities -->
  <rect x="474" y="44" width="222" height="236" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="488" y="66" font-size="12" fill="#1f2937" font-weight="bold">Count / 1,000 = probability</text>
  <text x="488" y="96" font-size="12" fill="#1f2937">P(fraud)</text>
  <text x="606" y="96" font-size="12" fill="#6b7280" text-anchor="end">20</text>
  <text x="682" y="96" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">0.020</text>
  <text x="488" y="122" font-size="12" fill="#1f2937">P(large)</text>
  <text x="606" y="122" font-size="12" fill="#6b7280" text-anchor="end">100</text>
  <text x="682" y="122" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">0.100</text>
  <text x="488" y="148" font-size="12" fill="#1f2937">P(both)</text>
  <text x="606" y="148" font-size="12" fill="#6b7280" text-anchor="end">8</text>
  <text x="682" y="148" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">0.008</text>
  <text x="488" y="174" font-size="12" fill="#1f2937">P(either)</text>
  <text x="606" y="174" font-size="12" fill="#6b7280" text-anchor="end">112</text>
  <text x="682" y="174" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">0.112</text>
  <text x="488" y="200" font-size="12" fill="#1f2937">P(neither)</text>
  <text x="606" y="200" font-size="12" fill="#6b7280" text-anchor="end">888</text>
  <text x="682" y="200" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">0.888</text>
  <line x1="488" y1="216" x2="682" y2="216" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="488" y="236" font-size="11" fill="#6b7280">either = 20 + 100 - 8, because the 8</text>
  <text x="488" y="251" font-size="11" fill="#6b7280">would otherwise be counted twice</text>
</svg>
