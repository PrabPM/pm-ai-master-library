<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Breadth-first and depth-first visit orders</title>
  <rect x="0" y="0" width="720" height="372" rx="6" fill="#ffffff"/>
  <!-- Breadth-first: nearest nodes first -->
  <rect x="24" y="20" width="324" height="304" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="44" font-size="13" fill="#1f2937" font-weight="bold">Breadth-first: nearest nodes first</text>
  <line x1="95" y1="142" x2="181" y2="223" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="95" y1="142" x2="73" y2="223" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="181" y1="142" x2="181" y2="223" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="181" y1="142" x2="224" y2="90" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="267" y1="142" x2="224" y2="90" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="267" y1="142" x2="305" y2="223" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="267" y1="142" x2="181" y2="223" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="95" cy="142" r="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="95" y="146" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">M1</text>
  <circle cx="115" cy="124" r="10" fill="#4f46e5"/>
  <text x="115" y="128" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="181" cy="142" r="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="181" y="146" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">M2</text>
  <circle cx="201" cy="124" r="10" fill="#4f46e5"/>
  <text x="201" y="128" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <circle cx="267" cy="142" r="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="267" y="146" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">M3</text>
  <circle cx="287" cy="124" r="10" fill="#4f46e5"/>
  <text x="287" y="128" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <circle cx="224" cy="90" r="18" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="224" y="94" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">B2</text>
  <circle cx="244" cy="72" r="10" fill="#4f46e5"/>
  <text x="244" y="76" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
  <circle cx="181" cy="223" r="18" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <text x="181" y="227" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">D1</text>
  <circle cx="201" cy="205" r="10" fill="#4f46e5"/>
  <text x="201" y="209" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="73" cy="223" r="18" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="73" y="227" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">B1</text>
  <circle cx="93" cy="205" r="10" fill="#4f46e5"/>
  <text x="93" y="209" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="305" cy="223" r="18" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <text x="305" y="227" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">D2</text>
  <circle cx="325" cy="205" r="10" fill="#4f46e5"/>
  <text x="325" y="209" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text>
  <text x="38" y="284" font-size="12" fill="#1f2937">Order: M1 D1 B1 M2 M3 B2 D2</text>
  <text x="38" y="306" font-size="12" fill="#6b7280">Hops from M1 in that order: 0 1 1 2 2 3 3</text>
  <!-- Depth-first: follow one trail to its end -->
  <rect x="372" y="20" width="324" height="304" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="386" y="44" font-size="13" fill="#1f2937" font-weight="bold">Depth-first: follow one trail to its end</text>
  <line x1="443" y1="142" x2="529" y2="223" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="443" y1="142" x2="421" y2="223" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="529" y1="142" x2="529" y2="223" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="529" y1="142" x2="572" y2="90" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="615" y1="142" x2="572" y2="90" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="615" y1="142" x2="653" y2="223" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="615" y1="142" x2="529" y2="223" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="443" cy="142" r="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="443" y="146" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">M1</text>
  <circle cx="463" cy="124" r="10" fill="#b45309"/>
  <text x="463" y="128" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="529" cy="142" r="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="529" y="146" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">M2</text>
  <circle cx="549" cy="124" r="10" fill="#b45309"/>
  <text x="549" y="128" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="615" cy="142" r="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="615" y="146" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">M3</text>
  <circle cx="635" cy="124" r="10" fill="#b45309"/>
  <text x="635" y="128" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <circle cx="572" cy="90" r="18" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="572" y="94" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">B2</text>
  <circle cx="592" cy="72" r="10" fill="#b45309"/>
  <text x="592" y="76" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <circle cx="529" cy="223" r="18" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <text x="529" y="227" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">D1</text>
  <circle cx="549" cy="205" r="10" fill="#b45309"/>
  <text x="549" y="209" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="421" cy="223" r="18" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="421" y="227" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">B1</text>
  <circle cx="441" cy="205" r="10" fill="#b45309"/>
  <text x="441" y="209" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text>
  <circle cx="653" cy="223" r="18" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <text x="653" y="227" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">D2</text>
  <circle cx="673" cy="205" r="10" fill="#b45309"/>
  <text x="673" y="209" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
  <text x="386" y="284" font-size="12" fill="#1f2937">Order: M1 D1 M2 B2 M3 D2 B1</text>
  <text x="386" y="306" font-size="12" fill="#6b7280">B1 is one hop from M1 but visited last</text>
  <text x="24" y="350" font-size="12" fill="#6b7280">Numbered badges give the visit order, starting from M1. Both searches reach the same seven nodes.</text>
</svg>
