<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Why most fraud flags are false alarms at a low base rate</title>
  <rect x="0" y="0" width="720" height="330" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">100,000 payments through a fraud model</text>
  <text x="24" y="46" font-size="12" fill="#6b7280">Base rate 0.2%, true-positive rate 90%, false-positive rate 2%</text>
  <rect x="270" y="60" width="180" height="36" rx="6" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <text x="360" y="83" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">100,000 payments</text>
  <!-- level 2 -->
  <rect x="84" y="128" width="200" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="184" y="153" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">200 are fraud (0.2%)</text>
  <rect x="436" y="128" width="200" height="40" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="536" y="153" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">99,800 are legitimate</text>
  <line x1="330" y1="96" x2="200" y2="126" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="200.0,126.0 205.8,120.4 207.6,128.5" fill="#6b7280"/>
  <line x1="390" y1="96" x2="520" y2="126" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="520.0,126.0 512.4,128.5 514.2,120.4" fill="#6b7280"/>
  <!-- level 3 -->
  <rect x="24" y="200" width="150" height="50" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="99" y="221" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">180 flagged</text>
  <text x="99" y="239" font-size="11" fill="#6b7280" text-anchor="middle">90% of 200</text>
  <rect x="194" y="200" width="150" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="269" y="221" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">20 missed</text>
  <text x="269" y="239" font-size="11" fill="#6b7280" text-anchor="middle">10% of 200</text>
  <rect x="376" y="200" width="150" height="50" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="451" y="221" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">1,996 flagged</text>
  <text x="451" y="239" font-size="11" fill="#6b7280" text-anchor="middle">2% of 99,800</text>
  <rect x="546" y="200" width="150" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="621" y="221" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">97,804 passed</text>
  <text x="621" y="239" font-size="11" fill="#6b7280" text-anchor="middle">98% of 99,800</text>
  <line x1="150" y1="168" x2="104" y2="198" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="104.0,198.0 107.5,190.8 112.0,197.7" fill="#6b7280"/>
  <line x1="218" y1="168" x2="264" y2="198" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="264.0,198.0 256.0,197.7 260.5,190.8" fill="#6b7280"/>
  <line x1="502" y1="168" x2="456" y2="198" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="456.0,198.0 459.5,190.8 464.0,197.7" fill="#6b7280"/>
  <line x1="570" y1="168" x2="616" y2="198" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="616.0,198.0 608.0,197.7 612.5,190.8" fill="#6b7280"/>
  <!-- conclusion -->
  <rect x="24" y="274" width="672" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="360" y="299" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">2,176 flags in total: 180 real and 1,996 false alarms, so 180 / 2,176 = 8.3% of flags are fraud</text>
  <line x1="99" y1="250" x2="99" y2="272" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="451" y1="250" x2="451" y2="272" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>
