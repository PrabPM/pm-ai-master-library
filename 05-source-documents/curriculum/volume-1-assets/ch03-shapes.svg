<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Chaining two matrices: sizes must meet in the middle</title>
  <rect x="0" y="0" width="720" height="300" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">Two steps, then the same trip as one matrix</text>
  <rect x="24" y="46" width="118" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="83.0" y="73" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">2 numbers</text>
  <text x="83.0" y="92" font-size="11" fill="#6b7280" text-anchor="middle">in-store, online</text>
  <rect x="168" y="46" width="96" height="62" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="216.0" y="73" font-size="13" fill="#4f46e5" text-anchor="middle" font-weight="bold">B</text>
  <text x="216.0" y="92" font-size="11" fill="#6b7280" text-anchor="middle">3 x 2</text>
  <rect x="290" y="46" width="140" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360.0" y="73" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">3 numbers</text>
  <text x="360.0" y="92" font-size="11" fill="#6b7280" text-anchor="middle">total, online, gap</text>
  <rect x="456" y="46" width="96" height="62" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="504.0" y="73" font-size="13" fill="#4f46e5" text-anchor="middle" font-weight="bold">A</text>
  <text x="504.0" y="92" font-size="11" fill="#6b7280" text-anchor="middle">2 x 3</text>
  <rect x="578" y="46" width="118" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="637.0" y="73" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">2 numbers</text>
  <text x="637.0" y="92" font-size="11" fill="#6b7280" text-anchor="middle">fees, priority</text>
  <line x1="145" y1="77.0" x2="165" y2="77.0" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="165.0,77.0 158.1,81.1 158.1,72.9" fill="#1f2937"/>
  <line x1="267" y1="77.0" x2="287" y2="77.0" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="287.0,77.0 280.1,81.1 280.1,72.9" fill="#1f2937"/>
  <line x1="433" y1="77.0" x2="453" y2="77.0" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="453.0,77.0 446.1,81.1 446.1,72.9" fill="#1f2937"/>
  <line x1="555" y1="77.0" x2="575" y2="77.0" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="575.0,77.0 568.1,81.1 568.1,72.9" fill="#1f2937"/>
  <rect x="168" y="150" width="384" height="50" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="360" y="172" font-size="13" fill="#4f46e5" text-anchor="middle" font-weight="bold">AB</text>
  <text x="360" y="190" font-size="11" fill="#6b7280" text-anchor="middle">2 x 2: first B, then A, in a single multiplication</text>
  <line x1="83" y1="108" x2="83" y2="175" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="83" y1="175" x2="165" y2="175" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="165.0,175.0 158.1,179.1 158.1,170.9" fill="#6b7280"/>
  <line x1="555" y1="175" x2="637" y2="175" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="637" y1="175" x2="637" y2="111" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="637.0,111.0 641.1,117.9 632.9,117.9" fill="#6b7280"/>
  <text x="24" y="246" font-size="13" fill="#1f2937" font-weight="bold">Shape rule</text>
  <text x="124" y="246" font-size="14" fill="#1f2937" font-weight="bold">(2 x 3)</text>
  <text x="182" y="246" font-size="12" fill="#6b7280">times</text>
  <text x="224" y="246" font-size="14" fill="#1f2937" font-weight="bold">(3 x 2)</text>
  <text x="282" y="246" font-size="12" fill="#6b7280">gives</text>
  <text x="322" y="246" font-size="14" fill="#4f46e5" font-weight="bold">(2 x 2)</text>
  <text x="124" y="272" font-size="12" fill="#6b7280">The inner sizes (3 and 3) must match. The outer sizes (2 and 2) are the size of the result.</text>
</svg>
