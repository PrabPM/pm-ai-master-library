<svg xmlns="http://www.w3.org/2000/svg" width="720" height="446" viewBox="0 0 720 446" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Google Ad Manager line item types as a priority ladder</title>
  <rect x="0" y="0" width="720" height="446" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">Which line item serves? Eligibility first, then the ladder</text>
  <rect x="24" y="42" width="672" height="46" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="36" y="62" font-size="12" fill="#1f2937" font-weight="bold">Step 1: is it eligible at all?</text>
  <text x="36" y="79" font-size="11" fill="#1f2937">Ad unit, dates, geography, device, key-values, audience, frequency cap, creative size, consent, policy.</text>
  <text x="24" y="112" font-size="12" fill="#1f2937" font-weight="bold">Step 2: among eligible line items</text>
  <text x="34" y="134" font-size="11" fill="#6b7280" font-weight="bold">Type</text>
  <text x="206" y="134" font-size="11" fill="#6b7280" font-weight="bold">Priority</text>
  <text x="286" y="134" font-size="11" fill="#6b7280" font-weight="bold">Used for</text>
  <text x="480" y="134" font-size="11" fill="#6b7280" font-weight="bold">How it competes</text>
  <rect x="24" y="144" width="672" height="30" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="34" y="164" font-size="11" fill="#1f2937" font-weight="bold">Sponsorship</text>
  <text x="206" y="164" font-size="11" fill="#1f2937">4</text>
  <text x="286" y="164" font-size="11" fill="#1f2937">A share of voice, roadblocks</text>
  <text x="480" y="164" font-size="11" fill="#1f2937">Guaranteed: served first</text>
  <rect x="24" y="179" width="672" height="30" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="34" y="199" font-size="11" fill="#1f2937" font-weight="bold">Standard</text>
  <text x="206" y="199" font-size="11" fill="#1f2937">6, 8 or 10</text>
  <text x="286" y="199" font-size="11" fill="#1f2937">A contracted impression goal</text>
  <text x="480" y="199" font-size="11" fill="#1f2937">Guaranteed: paced to its goal</text>
  <rect x="24" y="214" width="672" height="30" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="34" y="234" font-size="11" fill="#1f2937" font-weight="bold">Preferred Deal</text>
  <text x="206" y="234" font-size="11" fill="#1f2937">fixed</text>
  <text x="286" y="234" font-size="11" fill="#1f2937">A buyer's first look at a set price</text>
  <text x="480" y="234" font-size="11" fill="#1f2937">Ahead of the open auction</text>
  <rect x="24" y="249" width="672" height="30" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="34" y="269" font-size="11" fill="#1f2937" font-weight="bold">Ad Exchange, AdSense</text>
  <text x="206" y="269" font-size="11" fill="#1f2937">12</text>
  <text x="286" y="269" font-size="11" fill="#1f2937">Google's programmatic demand</text>
  <text x="480" y="269" font-size="11" fill="#1f2937">Competes on price</text>
  <rect x="24" y="284" width="672" height="30" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="34" y="304" font-size="11" fill="#1f2937" font-weight="bold">Network, Bulk</text>
  <text x="206" y="304" font-size="11" fill="#1f2937">12</text>
  <text x="286" y="304" font-size="11" fill="#1f2937">Ad networks, volume buys</text>
  <text x="480" y="304" font-size="11" fill="#1f2937">Competes on price</text>
  <rect x="24" y="319" width="672" height="30" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="34" y="339" font-size="11" fill="#1f2937" font-weight="bold">Price priority</text>
  <text x="206" y="339" font-size="11" fill="#1f2937">12</text>
  <text x="286" y="339" font-size="11" fill="#1f2937">Unsold inventory at best price</text>
  <text x="480" y="339" font-size="11" fill="#1f2937">Competes on price</text>
  <rect x="24" y="354" width="672" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="34" y="374" font-size="11" fill="#1f2937" font-weight="bold">House</text>
  <text x="206" y="374" font-size="11" fill="#1f2937">16</text>
  <text x="286" y="374" font-size="11" fill="#1f2937">The publisher's own promotions</text>
  <text x="480" y="374" font-size="11" fill="#1f2937">Fills what nothing else wants</text>
  <rect x="24" y="395" width="672" height="46" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="36" y="415" font-size="12" fill="#1f2937" font-weight="bold">Dynamic allocation</text>
  <text x="36" y="432" font-size="11" fill="#1f2937">Price-based demand can beat a guaranteed line item when its bid is above that item's temporary CPM.</text>
</svg>
