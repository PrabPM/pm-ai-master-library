<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A randomized holdout design for the Ritmora campaign, with results</title>
  <rect x="0" y="0" width="720" height="440" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">A random holdout: two groups that differ only by chance</text>
  <rect x="24" y="62" width="150" height="76" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="86" font-size="12" fill="#1f2937" font-weight="bold">Client target list</text>
  <text x="36" y="106" font-size="12" fill="#1f2937">12,000 NPIs</text>
  <line x1="176" y1="100" x2="196" y2="100" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="196.0,100.0 189.1,104.1 189.1,95.9" fill="#1f2937"/>
  <rect x="198" y="62" width="170" height="76" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="210" y="86" font-size="12" fill="#1f2937" font-weight="bold">Eligible and reachable</text>
  <text x="210" y="106" font-size="12" fill="#1f2937">7,039 clinicians</text>
  <text x="210" y="124" font-size="11" fill="#6b7280">valid, verified, consented</text>
  <line x1="372" y1="88" x2="424" y2="66" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="424.0,66.0 419.3,72.5 416.1,64.9" fill="#1f2937"/>
  <line x1="372" y1="112" x2="424" y2="136" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="424.0,136.0 416.0,136.9 419.5,129.4" fill="#1f2937"/>
  <text x="402" y="104" font-size="11" fill="#6b7280" text-anchor="middle">random</text>
  <rect x="428" y="44" width="268" height="52" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="440" y="66" font-size="12" fill="#1f2937" font-weight="bold">Treatment: 6,320 clinicians (90%)</text>
  <text x="440" y="84" font-size="11" fill="#1f2937">Campaign allowed. 77.7% were exposed.</text>
  <rect x="428" y="108" width="268" height="52" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="440" y="130" font-size="12" fill="#1f2937" font-weight="bold">Holdout: 719 clinicians (10%)</text>
  <text x="440" y="148" font-size="11" fill="#1f2937">No campaign. 1.0% exposed by mistake.</text>
  <text x="24" y="196" font-size="13" fill="#1f2937" font-weight="bold">Qualified engagement within 14 days, by assigned group</text>
  <text x="24" y="238" font-size="12" fill="#1f2937" font-weight="bold">Treatment</text>
  <rect x="150" y="218" width="358.2" height="30" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="480.1" y1="233" x2="536.4" y2="233" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="480.1" y1="226" x2="480.1" y2="240" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="536.4" y1="226" x2="536.4" y2="240" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="546.4" y="238" font-size="12" fill="#1f2937">8.96%  (566 of 6,320)</text>
  <text x="24" y="282" font-size="12" fill="#1f2937" font-weight="bold">Holdout</text>
  <rect x="150" y="262" width="205.8" height="30" rx="6" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="291.2" y1="277" x2="420.4" y2="277" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="291.2" y1="270" x2="291.2" y2="284" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="420.4" y1="270" x2="420.4" y2="284" stroke="#1f2937" stroke-width="1.5"/>
  <text x="430.4" y="282" font-size="12" fill="#1f2937">5.15%  (37 of 719)</text>
  <line x1="150.0" y1="300" x2="150.0" y2="306" stroke="#6b7280" stroke-width="1.5"/>
  <text x="150.0" y="322" font-size="11" fill="#6b7280" text-anchor="middle">0%</text>
  <line x1="230.0" y1="300" x2="230.0" y2="306" stroke="#6b7280" stroke-width="1.5"/>
  <text x="230.0" y="322" font-size="11" fill="#6b7280" text-anchor="middle">2%</text>
  <line x1="310.0" y1="300" x2="310.0" y2="306" stroke="#6b7280" stroke-width="1.5"/>
  <text x="310.0" y="322" font-size="11" fill="#6b7280" text-anchor="middle">4%</text>
  <line x1="390.0" y1="300" x2="390.0" y2="306" stroke="#6b7280" stroke-width="1.5"/>
  <text x="390.0" y="322" font-size="11" fill="#6b7280" text-anchor="middle">6%</text>
  <line x1="470.0" y1="300" x2="470.0" y2="306" stroke="#6b7280" stroke-width="1.5"/>
  <text x="470.0" y="322" font-size="11" fill="#6b7280" text-anchor="middle">8%</text>
  <line x1="550.0" y1="300" x2="550.0" y2="306" stroke="#6b7280" stroke-width="1.5"/>
  <text x="550.0" y="322" font-size="11" fill="#6b7280" text-anchor="middle">10%</text>
  <line x1="150" y1="300" x2="550.0" y2="300" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="24" y="344" width="672" height="78" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="36" y="368" font-size="13" fill="#1f2937" font-weight="bold">Lift: 3.81 percentage points (95% interval 2.05 to 5.57)</text>
  <text x="36" y="388" font-size="12" fill="#1f2937">About 241 extra engaged clinicians among the 6,320 assigned to treatment (interval 129 to 352).</text>
  <text x="36" y="408" font-size="12" fill="#1f2937">Compared by assignment, not by exposure, so unreached clinicians stay in the treatment group.</text>
</svg>
