<svg xmlns="http://www.w3.org/2000/svg" width="720" height="462" viewBox="0 0 720 462" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>One next-best-action decision for one cardiologist, step by step</title>
  <rect x="0" y="0" width="720" height="462" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">One next-best-action decision for one cardiologist</text>
  <rect x="24.0" y="44" width="126" height="92" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="34.0" y="66" font-size="12" fill="#1f2937" font-weight="bold">1  Trigger</text>
  <text x="34.0" y="86" font-size="11" fill="#1f2937">Read two</text>
  <text x="34.0" y="101" font-size="11" fill="#1f2937">heart-failure</text>
  <text x="34.0" y="116" font-size="11" fill="#1f2937">guidelines in 14</text>
  <text x="34.0" y="131" font-size="11" fill="#1f2937">days</text>
  <line x1="151.0" y1="87" x2="159.0" y2="87" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="159.0,87.0 152.1,91.1 152.1,82.9" fill="#1f2937"/>
  <rect x="160.5" y="44" width="126" height="92" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="170.5" y="66" font-size="12" fill="#1f2937" font-weight="bold">2  Policy gate</text>
  <text x="170.5" y="86" font-size="11" fill="#1f2937">Verified, consented,</text>
  <text x="170.5" y="101" font-size="11" fill="#1f2937">US, cardiology. Hard</text>
  <text x="170.5" y="116" font-size="11" fill="#1f2937">rules only.</text>
  <line x1="287.5" y1="87" x2="295.5" y2="87" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="295.5,87.0 288.6,91.1 288.6,82.9" fill="#1f2937"/>
  <rect x="297.0" y="44" width="126" height="92" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="307.0" y="66" font-size="12" fill="#1f2937" font-weight="bold">3  Candidates</text>
  <text x="307.0" y="86" font-size="11" fill="#1f2937">5 considered, 4 pass</text>
  <text x="307.0" y="101" font-size="11" fill="#1f2937">the gate</text>
  <line x1="424.0" y1="87" x2="432.0" y2="87" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="432.0,87.0 425.1,91.1 425.1,82.9" fill="#1f2937"/>
  <rect x="433.5" y="44" width="126" height="92" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="443.5" y="66" font-size="12" fill="#1f2937" font-weight="bold">4  Score, arbitrate</text>
  <text x="443.5" y="86" font-size="11" fill="#1f2937">Education rules first,</text>
  <text x="443.5" y="101" font-size="11" fill="#1f2937">then user value</text>
  <line x1="560.5" y1="87" x2="568.5" y2="87" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="568.5,87.0 561.6,91.1 561.6,82.9" fill="#1f2937"/>
  <rect x="570.0" y="44" width="126" height="92" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="580.0" y="66" font-size="12" fill="#1f2937" font-weight="bold">5  Decision</text>
  <text x="580.0" y="86" font-size="11" fill="#1f2937">Offer by email, with</text>
  <text x="580.0" y="101" font-size="11" fill="#1f2937">reason codes</text>
  <text x="24" y="158" font-size="13" fill="#1f2937" font-weight="bold">The candidates</text>
  <text x="32" y="180" font-size="11" fill="#6b7280" font-weight="bold">Candidate</text>
  <text x="220" y="180" font-size="11" fill="#6b7280" font-weight="bold">Content class</text>
  <text x="360" y="180" font-size="11" fill="#6b7280" font-weight="bold">Gate</text>
  <text x="412" y="180" font-size="11" fill="#6b7280" font-weight="bold">Score</text>
  <text x="466" y="180" font-size="11" fill="#6b7280" font-weight="bold">Outcome</text>
  <rect x="24" y="190" width="672" height="30" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="32" y="210" font-size="11" fill="#1f2937" font-weight="bold">Heart-failure activity</text>
  <text x="220" y="210" font-size="11" fill="#1f2937">Accredited education</text>
  <text x="360" y="210" font-size="11" fill="#1f2937">pass</text>
  <text x="412" y="210" font-size="11" fill="#1f2937">0.71</text>
  <text x="466" y="210" font-size="11" fill="#1f2937">Chosen: offer by email</text>
  <rect x="24" y="226" width="672" height="30" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="32" y="246" font-size="11" fill="#1f2937" font-weight="bold">Ritmora dosing page</text>
  <text x="220" y="246" font-size="11" fill="#1f2937">Promotional</text>
  <text x="360" y="246" font-size="11" fill="#1f2937">pass</text>
  <text x="412" y="246" font-size="11" fill="#1f2937">0.62</text>
  <text x="466" y="246" font-size="11" fill="#1f2937">Held: weekly contact cap reached</text>
  <rect x="24" y="262" width="672" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="282" font-size="11" fill="#1f2937" font-weight="bold">Cardiology webinar</text>
  <text x="220" y="282" font-size="11" fill="#1f2937">Live event</text>
  <text x="360" y="282" font-size="11" fill="#1f2937">pass</text>
  <text x="412" y="282" font-size="11" fill="#1f2937">0.55</text>
  <text x="466" y="282" font-size="11" fill="#1f2937">Not chosen this time</text>
  <rect x="24" y="298" width="672" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="318" font-size="11" fill="#1f2937" font-weight="bold">No action</text>
  <text x="220" y="318" font-size="11" fill="#1f2937">None</text>
  <text x="360" y="318" font-size="11" fill="#1f2937">pass</text>
  <text x="412" y="318" font-size="11" fill="#1f2937">0.30</text>
  <text x="466" y="318" font-size="11" fill="#1f2937">Always a valid choice</text>
  <rect x="24" y="334" width="672" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="32" y="354" font-size="11" fill="#1f2937" font-weight="bold">Lipid management activity</text>
  <text x="220" y="354" font-size="11" fill="#1f2937">Accredited education</text>
  <text x="360" y="354" font-size="11" fill="#1f2937">fail</text>
  <text x="412" y="354" font-size="11" fill="#1f2937">-</text>
  <text x="466" y="354" font-size="11" fill="#1f2937">Excluded: completed in August</text>
  <text x="24" y="396" font-size="13" fill="#1f2937" font-weight="bold">Where this clinician is in the journey</text>
  <rect x="24.0" y="408" width="86" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="67.0" y="427" font-size="11" fill="#1f2937" text-anchor="middle">eligible</text>
  <line x1="111.0" y1="422" x2="120.0" y2="422" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="120.0,422.0 113.1,426.1 113.1,417.9" fill="#6b7280"/>
  <rect x="121.7" y="408" width="86" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="164.7" y="427" font-size="11" fill="#1f2937" text-anchor="middle">entered</text>
  <line x1="208.7" y1="422" x2="217.7" y2="422" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="217.7,422.0 210.8,426.1 210.8,417.9" fill="#6b7280"/>
  <rect x="219.4" y="408" width="86" height="28" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="262.4" y="427" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">offered</text>
  <line x1="306.4" y1="422" x2="315.4" y2="422" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="315.4,422.0 308.5,426.1 308.5,417.9" fill="#6b7280"/>
  <rect x="317.1" y="408" width="86" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360.1" y="427" font-size="11" fill="#1f2937" text-anchor="middle">engaged</text>
  <line x1="404.1" y1="422" x2="413.1" y2="422" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="413.1,422.0 406.2,426.1 406.2,417.9" fill="#6b7280"/>
  <rect x="414.8" y="408" width="86" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="457.8" y="427" font-size="11" fill="#1f2937" text-anchor="middle">completed</text>
  <line x1="501.8" y1="422" x2="510.8" y2="422" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="510.8,422.0 503.9,426.1 503.9,417.9" fill="#6b7280"/>
  <rect x="512.5" y="408" width="86" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="555.5" y="427" font-size="11" fill="#1f2937" text-anchor="middle">follow-up</text>
  <line x1="599.5" y1="422" x2="608.5" y2="422" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="608.5,422.0 601.6,426.1 601.6,417.9" fill="#6b7280"/>
  <rect x="610.2" y="408" width="86" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="653.2" y="427" font-size="11" fill="#1f2937" text-anchor="middle">exited</text>
  <text x="24" y="454" font-size="11" fill="#6b7280">Side exits from any state: declined, unreachable, suppressed, expired, error.</text>
</svg>
