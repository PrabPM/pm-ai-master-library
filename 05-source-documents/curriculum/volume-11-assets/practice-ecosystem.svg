<svg xmlns="http://www.w3.org/2000/svg" width="720" height="388" viewBox="0 0 720 388" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The fictional Wrenfield practice ecosystem: users, products, customers</title>
  <rect x="0" y="0" width="720" height="388" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="13" fill="#1f2937" font-weight="bold">People who use it</text>
  <text x="258" y="28" font-size="13" fill="#1f2937" font-weight="bold">Wrenfield Health Media (fictional)</text>
  <text x="492" y="28" font-size="13" fill="#1f2937" font-weight="bold">Customers who pay</text>
  <rect x="24" y="44" width="204" height="96" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="66" font-size="13" fill="#1f2937" font-weight="bold">Clinicians</text>
  <text x="36" y="86" font-size="11" fill="#1f2937">Read news and reference, earn</text>
  <text x="36" y="101" font-size="11" fill="#1f2937">credit, register with a professional</text>
  <text x="36" y="116" font-size="11" fill="#1f2937">identity.</text>
  <rect x="24" y="152" width="204" height="96" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="174" font-size="13" fill="#1f2937" font-weight="bold">Consumers and patients</text>
  <text x="36" y="194" font-size="11" fill="#1f2937">Look up symptoms, conditions and</text>
  <text x="36" y="209" font-size="11" fill="#1f2937">drugs, then look for care.</text>
  <rect x="258" y="44" width="204" height="48" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="270" y="64" font-size="13" fill="#1f2937" font-weight="bold">Wrenfield Clinical</text>
  <text x="270" y="82" font-size="11" fill="#6b7280">Clinician site and app</text>
  <rect x="258" y="100" width="204" height="48" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="270" y="120" font-size="13" fill="#1f2937" font-weight="bold">Wrenfield Learn</text>
  <text x="270" y="138" font-size="11" fill="#6b7280">Accredited education</text>
  <rect x="258" y="156" width="204" height="48" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="270" y="176" font-size="13" fill="#1f2937" font-weight="bold">Wrenfield Health</text>
  <text x="270" y="194" font-size="11" fill="#6b7280">Consumer health site</text>
  <rect x="258" y="212" width="204" height="48" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="270" y="232" font-size="13" fill="#1f2937" font-weight="bold">Wrenfield Reach</text>
  <text x="270" y="250" font-size="11" fill="#6b7280">Programmatic and HCP analytics</text>
  <rect x="258" y="268" width="204" height="48" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="270" y="288" font-size="13" fill="#1f2937" font-weight="bold">Wrenfield Grow</text>
  <text x="270" y="306" font-size="11" fill="#6b7280">Growth platform</text>
  <rect x="492" y="44" width="204" height="84" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="504" y="66" font-size="13" fill="#1f2937" font-weight="bold">Aldermoor Pharma</text>
  <text x="504" y="86" font-size="11" fill="#1f2937">Promotes Ritmora to cardiology</text>
  <text x="504" y="101" font-size="11" fill="#1f2937">clinicians and funds education.</text>
  <rect x="492" y="138" width="204" height="84" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="504" y="160" font-size="13" fill="#1f2937" font-weight="bold">Elkhaven Health</text>
  <text x="504" y="180" font-size="11" fill="#1f2937">A health system that wants more</text>
  <text x="504" y="195" font-size="11" fill="#1f2937">kept cardiology appointments.</text>
  <rect x="492" y="232" width="204" height="84" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="504" y="254" font-size="13" fill="#1f2937" font-weight="bold">Cedarline Health Plan</text>
  <text x="504" y="274" font-size="11" fill="#1f2937">A health plan closing wellness-visit</text>
  <text x="504" y="289" font-size="11" fill="#1f2937">gaps for its members.</text>
  <line x1="230" y1="92" x2="256" y2="68" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="256.0,68.0 253.8,75.7 248.2,69.6" fill="#1f2937"/>
  <line x1="230" y1="200" x2="256" y2="180" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="256.0,180.0 253.1,187.4 248.1,180.9" fill="#1f2937"/>
  <line x1="490" y1="86" x2="464" y2="230" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="464.0,230.0 461.2,222.5 469.3,224.0" fill="#1f2937"/>
  <line x1="490" y1="180" x2="464" y2="286" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="464.0,286.0 461.6,278.4 469.6,280.3" fill="#1f2937"/>
  <line x1="490" y1="274" x2="464" y2="296" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="464.0,296.0 466.6,288.4 471.9,294.7" fill="#1f2937"/>
  <rect x="24" y="332" width="672" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="350" font-size="11" fill="#1f2937">Same public shape as: Medscape, Medscape Education, the WebMD consumer sites, PulsePoint and WebMD Ignite.</text>
  <text x="36" y="365" font-size="11" fill="#6b7280">Every number attached to a Wrenfield name in this book is invented.</text>
</svg>
