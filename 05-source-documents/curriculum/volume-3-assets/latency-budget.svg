<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Latency budget for one Assist answer, by stage</title>
  <rect x="0" y="0" width="720" height="400" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">Where one Assist answer spends its time (a typical run)</text>
  <rect x="24.0" y="62" width="3.0" height="40" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="27.0" y="62" width="18.7" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="45.7" y="62" width="13.4" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="59.1" y="62" width="9.0" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="68.0" y="62" width="26.2" height="40" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <rect x="94.2" y="62" width="51.9" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="146.1" y="62" width="298.3" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="444.4" y="62" width="22.3" height="40" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
  <text x="295.2" y="87" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">7  Stream the answer</text>
  <line x1="24" y1="114" x2="696" y2="114" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="24.0" y1="110" x2="24.0" y2="118" stroke="#6b7280" stroke-width="1.5"/>
  <text x="24.0" y="134" font-size="11" fill="#6b7280">0 s</text>
  <line x1="98.66666666666667" y1="110" x2="98.66666666666667" y2="118" stroke="#6b7280" stroke-width="1.5"/>
  <text x="98.66666666666667" y="134" font-size="11" fill="#6b7280" text-anchor="middle">1 s</text>
  <line x1="173.33333333333334" y1="110" x2="173.33333333333334" y2="118" stroke="#6b7280" stroke-width="1.5"/>
  <text x="173.33333333333334" y="134" font-size="11" fill="#6b7280" text-anchor="middle">2 s</text>
  <line x1="248.0" y1="110" x2="248.0" y2="118" stroke="#6b7280" stroke-width="1.5"/>
  <text x="248.0" y="134" font-size="11" fill="#6b7280" text-anchor="middle">3 s</text>
  <line x1="322.6666666666667" y1="110" x2="322.6666666666667" y2="118" stroke="#6b7280" stroke-width="1.5"/>
  <text x="322.6666666666667" y="134" font-size="11" fill="#6b7280" text-anchor="middle">4 s</text>
  <line x1="397.3333333333333" y1="110" x2="397.3333333333333" y2="118" stroke="#6b7280" stroke-width="1.5"/>
  <text x="397.3333333333333" y="134" font-size="11" fill="#6b7280" text-anchor="middle">5 s</text>
  <line x1="472.0" y1="110" x2="472.0" y2="118" stroke="#6b7280" stroke-width="1.5"/>
  <text x="472.0" y="134" font-size="11" fill="#6b7280" text-anchor="middle">6 s</text>
  <line x1="546.6666666666666" y1="110" x2="546.6666666666666" y2="118" stroke="#6b7280" stroke-width="1.5"/>
  <text x="546.6666666666666" y="134" font-size="11" fill="#6b7280" text-anchor="middle">7 s</text>
  <line x1="621.3333333333334" y1="110" x2="621.3333333333334" y2="118" stroke="#6b7280" stroke-width="1.5"/>
  <text x="621.3333333333334" y="134" font-size="11" fill="#6b7280" text-anchor="middle">8 s</text>
  <line x1="696.0" y1="110" x2="696.0" y2="118" stroke="#6b7280" stroke-width="1.5"/>
  <text x="696.0" y="134" font-size="11" fill="#6b7280" text-anchor="end">9 s</text>
  <line x1="146.10237436145786" y1="48" x2="146.10237436145786" y2="108" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="152.10237436145786" y="56" font-size="11" fill="#1f2937" font-weight="bold">First words appear</text>
  <line x1="643.8286260128426" y1="48" x2="643.8286260128426" y2="108" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="637.8286260128426" y="56" font-size="11" fill="#b91c1c" text-anchor="end" font-weight="bold">Slowest 1 in 20: 8.3 s</text>
  <text x="24" y="158" font-size="11" fill="#6b7280" font-weight="bold">STAGE</text>
  <text x="330" y="158" font-size="11" fill="#6b7280" text-anchor="end" font-weight="bold">TYPICAL</text>
  <text x="400" y="158" font-size="11" fill="#6b7280" text-anchor="end" font-weight="bold">1 IN 20</text>
  <rect x="24" y="167" width="14" height="14" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
  <text x="46" y="178" font-size="11" fill="#1f2937">1  Sign-in and permission check</text>
  <text x="330" y="178" font-size="11" fill="#1f2937" text-anchor="end">40</text>
  <text x="400" y="178" font-size="11" fill="#1f2937" text-anchor="end">65</text>
  <rect x="24" y="187" width="14" height="14" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="46" y="198" font-size="11" fill="#1f2937">2  Rewrite the question (small model)</text>
  <text x="330" y="198" font-size="11" fill="#1f2937" text-anchor="end">250</text>
  <text x="400" y="198" font-size="11" fill="#1f2937" text-anchor="end">447</text>
  <rect x="24" y="207" width="14" height="14" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="46" y="218" font-size="11" fill="#1f2937">3  Search with permission check</text>
  <text x="330" y="218" font-size="11" fill="#1f2937" text-anchor="end">179</text>
  <text x="400" y="218" font-size="11" fill="#1f2937" text-anchor="end">377</text>
  <rect x="24" y="227" width="14" height="14" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="46" y="238" font-size="11" fill="#1f2937">4  Rerank the passages</text>
  <text x="330" y="238" font-size="11" fill="#1f2937" text-anchor="end">120</text>
  <text x="400" y="238" font-size="11" fill="#1f2937" text-anchor="end">197</text>
  <rect x="24" y="247" width="14" height="14" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="46" y="258" font-size="11" fill="#1f2937">5  Tool calls: payout and bank records</text>
  <text x="330" y="258" font-size="11" fill="#1f2937" text-anchor="end">351</text>
  <text x="400" y="258" font-size="11" fill="#1f2937" text-anchor="end">952</text>
  <rect x="24" y="267" width="14" height="14" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="46" y="278" font-size="11" fill="#1f2937">6  Model: wait for the first token</text>
  <text x="330" y="278" font-size="11" fill="#1f2937" text-anchor="end">695</text>
  <text x="400" y="278" font-size="11" fill="#1f2937" text-anchor="end">1,364</text>
  <rect x="24" y="287" width="14" height="14" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="46" y="298" font-size="11" fill="#1f2937">7  Model: stream 320 tokens</text>
  <text x="330" y="298" font-size="11" fill="#1f2937" text-anchor="end">3,995</text>
  <text x="400" y="298" font-size="11" fill="#1f2937" text-anchor="end">6,053</text>
  <rect x="24" y="307" width="14" height="14" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
  <text x="46" y="318" font-size="11" fill="#1f2937">8  Check each claim against its source</text>
  <text x="330" y="318" font-size="11" fill="#1f2937" text-anchor="end">299</text>
  <text x="400" y="318" font-size="11" fill="#1f2937" text-anchor="end">527</text>
  <rect x="432" y="150" width="264" height="172" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="446" y="174" font-size="12" fill="#1f2937" font-weight="bold">Against the budget (1 in 20)</text>
  <text x="446" y="198" font-size="11" fill="#6b7280">Measure</text>
  <text x="582" y="198" font-size="11" fill="#6b7280" text-anchor="end">Budget</text>
  <text x="632" y="198" font-size="11" fill="#6b7280" text-anchor="end">Now</text>
  <text x="446" y="222" font-size="12" fill="#1f2937">First words</text>
  <text x="582" y="222" font-size="12" fill="#1f2937" text-anchor="end">2.5 s</text>
  <text x="632" y="222" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">2.6 s</text>
  <rect x="640" y="207" width="44" height="22" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="662.0" y="222" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold">Over</text>
  <text x="446" y="252" font-size="12" fill="#1f2937">After fix*</text>
  <text x="582" y="252" font-size="12" fill="#1f2937" text-anchor="end">2.5 s</text>
  <text x="632" y="252" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">2.3 s</text>
  <rect x="640" y="237" width="44" height="22" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="662.0" y="252" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">OK</text>
  <text x="446" y="282" font-size="12" fill="#1f2937">Whole answer</text>
  <text x="582" y="282" font-size="12" fill="#1f2937" text-anchor="end">9.0 s</text>
  <text x="632" y="282" font-size="12" fill="#1f2937" text-anchor="end" font-weight="bold">8.3 s</text>
  <rect x="640" y="267" width="44" height="22" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="662.0" y="282" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">OK</text>
  <text x="446" y="308" font-size="11" fill="#6b7280">* tool calls run beside search</text>
  <text x="24" y="352" font-size="12" fill="#6b7280">Stages 1 to 6 decide how long the screen stays blank. Stage 7 decides how long the answer takes to finish.</text>
  <text x="24" y="372" font-size="12" fill="#6b7280">Tail latency is set by the widest stage, here the tool calls (stage 5), not by the largest one.</text>
</svg>
