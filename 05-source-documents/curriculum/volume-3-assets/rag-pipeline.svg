<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A RAG pipeline with its three separate failure points</title>
  <rect x="0" y="0" width="720" height="440" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">RAG is three systems: search, generation and permissions</text>
  <text x="24" y="56" font-size="11" fill="#6b7280" font-weight="bold">BEFORE ANY QUESTION: BUILD THE INDEX</text>
  <rect x="24" y="66" width="216" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="88" font-size="12" fill="#1f2937" font-weight="bold">Sources</text>
  <text x="36" y="108" font-size="11" fill="#6b7280">Help articles, policies, runbooks</text>
  <rect x="252" y="66" width="216" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="264" y="88" font-size="12" fill="#1f2937" font-weight="bold">Parse and chunk</text>
  <text x="264" y="108" font-size="11" fill="#6b7280">Keep tables and steps whole</text>
  <rect x="480" y="66" width="216" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="492" y="88" font-size="12" fill="#1f2937" font-weight="bold">Embed and index</text>
  <text x="492" y="108" font-size="11" fill="#6b7280">With owner, date and access tags</text>
  <line x1="242" y1="95" x2="256" y2="95" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="256.0,95.0 249.1,99.1 249.1,90.9" fill="#1f2937"/>
  <line x1="470" y1="95" x2="484" y2="95" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="484.0,95.0 477.1,99.1 477.1,90.9" fill="#1f2937"/>
  <text x="24" y="152" font-size="11" fill="#6b7280" font-weight="bold">FOR EACH QUESTION</text>
  <rect x="24" y="162" width="124" height="76" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="34" y="186" font-size="12" fill="#1f2937" font-weight="bold">Question</text>
  <text x="34" y="206" font-size="11" fill="#1f2937">From Sam, about</text>
  <text x="34" y="220" font-size="11" fill="#1f2937">one merchant</text>
  <rect x="161" y="162" width="124" height="76" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="171" y="186" font-size="12" fill="#1f2937" font-weight="bold">Permission check</text>
  <text x="171" y="206" font-size="11" fill="#1f2937">Only what Sam may</text>
  <text x="171" y="220" font-size="11" fill="#1f2937">see</text>
  <rect x="298" y="162" width="124" height="76" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="308" y="186" font-size="12" fill="#1f2937" font-weight="bold">Search, rerank</text>
  <text x="308" y="206" font-size="11" fill="#1f2937">Top 5 passages</text>
  <rect x="435" y="162" width="124" height="76" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="445" y="186" font-size="12" fill="#1f2937" font-weight="bold">Model writes</text>
  <text x="445" y="206" font-size="11" fill="#1f2937">A citation on every</text>
  <text x="445" y="220" font-size="11" fill="#1f2937">claim</text>
  <rect x="572" y="162" width="124" height="76" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="582" y="186" font-size="12" fill="#1f2937" font-weight="bold">Answer</text>
  <text x="582" y="206" font-size="11" fill="#1f2937">Or 'no supported</text>
  <text x="582" y="220" font-size="11" fill="#1f2937">answer'</text>
  <line x1="149" y1="200" x2="160" y2="200" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="160.0,200.0 153.1,204.1 153.1,195.9" fill="#1f2937"/>
  <line x1="286" y1="200" x2="297" y2="200" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="297.0,200.0 290.1,204.1 290.1,195.9" fill="#1f2937"/>
  <line x1="423" y1="200" x2="434" y2="200" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="434.0,200.0 427.1,204.1 427.1,195.9" fill="#1f2937"/>
  <line x1="560" y1="200" x2="571" y2="200" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="571.0,200.0 564.1,204.1 564.1,195.9" fill="#1f2937"/>
  <line x1="588" y1="124" x2="588" y2="142" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="588" y1="142" x2="360" y2="142" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="360" y1="142" x2="360" y2="160" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="360.0,160.0 355.9,153.1 364.1,153.1" fill="#6b7280"/>
  <circle cx="281" cy="164" r="10" fill="#b91c1c"/>
  <text x="281" y="168" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="418" cy="164" r="10" fill="#b45309"/>
  <text x="418" y="168" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="555" cy="164" r="10" fill="#4f46e5"/>
  <text x="555" y="168" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="24" y="268" font-size="13" fill="#1f2937" font-weight="bold">Three places it breaks, and the test for each</text>
  <circle cx="34" cy="290" r="10" fill="#b45309"/>
  <text x="34" y="294" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="54" y="294" font-size="12" fill="#1f2937" font-weight="bold">Search failed.</text>
  <text x="54" y="310" font-size="11" fill="#1f2937">The right passage was not in the top 5, or the index was stale. Test: recall@5 and the age of the index.</text>
  <circle cx="34" cy="333" r="10" fill="#4f46e5"/>
  <text x="34" y="337" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="54" y="337" font-size="12" fill="#1f2937" font-weight="bold">Generation misused good evidence.</text>
  <text x="54" y="353" font-size="11" fill="#1f2937">The passage was there, but the answer says something it does not support. Test: share of claims supported by their citation.</text>
  <circle cx="34" cy="376" r="10" fill="#b91c1c"/>
  <text x="34" y="380" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="54" y="380" font-size="12" fill="#1f2937" font-weight="bold">Permissions leaked.</text>
  <text x="54" y="396" font-size="11" fill="#1f2937">A passage reached the model that this user may not see. Test: unauthorized retrievals, which must be zero.</text>
</svg>
