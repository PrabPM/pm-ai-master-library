<svg xmlns="http://www.w3.org/2000/svg" width="720" height="348" viewBox="0 0 720 348" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Funnel of one weekly cohort of small merchants signing up for PayFlow</title>
  <rect x="0" y="0" width="720" height="348" rx="6" fill="#ffffff"/>
  <text x="24" y="30" font-size="14" fill="#1f2937" font-weight="bold">One week of small merchants signing up for PayFlow</text>
  <text x="24" y="50" font-size="12" fill="#6b7280">Merchants who completed each step within 7 days of starting</text>
  <text x="24" y="87" font-size="12" fill="#1f2937">1 Create account</text>
  <rect x="196" y="70" width="330" height="24" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="534" y="87" font-size="12" fill="#1f2937" font-weight="bold">2,000</text>
  <text x="578" y="87" font-size="12" fill="#6b7280">100%</text>
  <text x="24" y="125" font-size="12" fill="#1f2937">2 Business details</text>
  <rect x="196" y="108" width="304" height="24" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="508" y="125" font-size="12" fill="#1f2937" font-weight="bold">1,840</text>
  <text x="552" y="125" font-size="12" fill="#6b7280">92%</text>
  <rect x="618" y="109" width="78" height="22" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
  <text x="657.0" y="124" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">160 lost</text>
  <text x="24" y="163" font-size="12" fill="#1f2937" font-weight="bold">3 Owner identity</text>
  <rect x="196" y="146" width="257" height="24" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="461" y="163" font-size="12" fill="#1f2937" font-weight="bold">1,560</text>
  <text x="505" y="163" font-size="12" fill="#6b7280">78%</text>
  <rect x="618" y="147" width="78" height="22" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="657.0" y="162" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold">280 lost</text>
  <text x="24" y="201" font-size="12" fill="#1f2937" font-weight="bold">4 Documents accepted</text>
  <rect x="196" y="184" width="210" height="24" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="414" y="201" font-size="12" fill="#1f2937" font-weight="bold">1,270</text>
  <text x="458" y="201" font-size="12" fill="#6b7280">64%</text>
  <rect x="618" y="185" width="78" height="22" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="657.0" y="200" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold">290 lost</text>
  <text x="24" y="239" font-size="12" fill="#1f2937">5 Bank account linked</text>
  <rect x="196" y="222" width="196" height="24" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="400" y="239" font-size="12" fill="#1f2937" font-weight="bold">1,190</text>
  <text x="444" y="239" font-size="12" fill="#6b7280">60%</text>
  <rect x="618" y="223" width="78" height="22" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
  <text x="657.0" y="238" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">80 lost</text>
  <text x="24" y="277" font-size="12" fill="#1f2937">6 Approved</text>
  <rect x="196" y="260" width="191" height="24" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="395" y="277" font-size="12" fill="#1f2937" font-weight="bold">1,160</text>
  <text x="439" y="277" font-size="12" fill="#6b7280">58%</text>
  <rect x="618" y="261" width="78" height="22" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
  <text x="657.0" y="276" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">30 lost</text>
  <rect x="24" y="302" width="672" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="324" font-size="12" fill="#1f2937">840 of 2,000 never finish. Steps 3 and 4 lose 570 of them. The funnel shows where, not why.</text>
</svg>
