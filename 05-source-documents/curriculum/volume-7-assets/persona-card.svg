<svg xmlns="http://www.w3.org/2000/svg" width="720" height="414" viewBox="0 0 720 414" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Evidence-based persona card with its sources</title>
  <rect x="0" y="0" width="720" height="414" rx="6" fill="#ffffff"/>
  <rect x="24" y="16" width="440" height="382" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="62" cy="56" r="22" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <path d="M52 62 q10 8 20 0" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="55" cy="51" r="2" fill="#4f46e5"/>
  <circle cx="69" cy="51" r="2" fill="#4f46e5"/>
  <text x="96" y="50" font-size="15" fill="#1f2937" font-weight="bold">The solo owner on a phone</text>
  <text x="96" y="68" font-size="11" fill="#6b7280">Runs the business alone and does the paperwork between customers</text>
  <text x="40" y="104" font-size="12" fill="#4f46e5" font-weight="bold">What they do</text>
  <circle cx="46" cy="118" r="2" fill="#1f2937"/>
  <text x="56" y="122" font-size="12" fill="#1f2937">Starts sign-up on a phone during the working day</text>
  <circle cx="46" cy="136" r="2" fill="#1f2937"/>
  <text x="56" y="140" font-size="12" fill="#1f2937">Stops when a request needs something that is not in reach</text>
  <circle cx="46" cy="154" r="2" fill="#1f2937"/>
  <text x="56" y="158" font-size="12" fill="#1f2937">Means to finish in the evening</text>
  <text x="40" y="186" font-size="12" fill="#4f46e5" font-weight="bold">What they want</text>
  <circle cx="46" cy="200" r="2" fill="#1f2937"/>
  <text x="56" y="204" font-size="12" fill="#1f2937">To take a card payment by a date a customer has set</text>
  <circle cx="46" cy="218" r="2" fill="#1f2937"/>
  <text x="56" y="222" font-size="12" fill="#1f2937">To know up front what the form will ask for</text>
  <text x="40" y="250" font-size="12" fill="#4f46e5" font-weight="bold">What gets in the way</text>
  <circle cx="46" cy="264" r="2" fill="#1f2937"/>
  <text x="56" y="268" font-size="12" fill="#1f2937">Left to find a document or number (6 of 7)</text>
  <circle cx="46" cy="282" r="2" fill="#1f2937"/>
  <text x="56" y="286" font-size="12" fill="#1f2937">Progress gone on return (4 of those 6)</text>
  <circle cx="46" cy="300" r="2" fill="#1f2937"/>
  <text x="56" y="304" font-size="12" fill="#1f2937">Terms such as “beneficial owner” (4 of 7)</text>
  <rect x="36" y="328" width="416" height="54" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="348" font-size="12" fill="#1f2937" font-style="italic">“I was doing it on my phone between clients. Then it wanted my tax ID,</text>
  <text x="48" y="364" font-size="12" fill="#1f2937" font-style="italic">and that's in a drawer at home.” P1</text>
  <rect x="480" y="16" width="216" height="160" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="492" y="40" font-size="13" fill="#15803d" font-weight="bold">Based on</text>
  <path d="M492 56 l3 3 l6 -7" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="510" y="62" font-size="11" fill="#1f2937">7 interviews, Oct 19 to 30, 2026</text>
  <text x="510" y="77" font-size="11" fill="#1f2937">(P1, P2, P4, P6, P7, P9, P11)</text>
  <path d="M492 94 l3 3 l6 -7" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="510" y="100" font-size="11" fill="#1f2937">216 survey answers from</text>
  <text x="510" y="115" font-size="11" fill="#1f2937">merchants who gave up</text>
  <path d="M492 132 l3 3 l6 -7" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="510" y="138" font-size="11" fill="#1f2937">Funnel: 760 of 2,000 weekly</text>
  <text x="510" y="153" font-size="11" fill="#1f2937">starts; 60% finish in 7 days</text>
  <rect x="480" y="186" width="216" height="124" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="492" y="210" font-size="13" fill="#b45309" font-weight="bold">Not known yet</text>
  <text x="492" y="230" font-size="11" fill="#1f2937">Whether a text reminder feels helpful</text>
  <text x="492" y="245" font-size="11" fill="#1f2937">or pushy. Whether any of this holds</text>
  <text x="492" y="260" font-size="11" fill="#1f2937">for merchants who sign up in</text>
  <text x="492" y="275" font-size="11" fill="#1f2937">Spanish.</text>
  <rect x="480" y="320" width="216" height="78" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="492" y="346" font-size="11" fill="#1f2937" font-weight="bold">Owner: Rosa Delgado</text>
  <text x="492" y="364" font-size="11" fill="#6b7280">Review by April 2027, or sooner if the</text>
  <text x="492" y="379" font-size="11" fill="#6b7280">form changes.</text>
</svg>
