<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Affinity board built from twelve interviews</title>
  <rect x="0" y="0" width="720" height="470" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">Affinity board after 12 interviews: one observation per note, grouped by meaning</text>
  <rect x="24" y="44" width="162" height="318" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="34" y="64" font-size="12" fill="#1f2937" font-weight="bold">“I had to go and find</text>
  <text x="34" y="79" font-size="12" fill="#1f2937" font-weight="bold">something”</text>
  <text x="34" y="98" font-size="11" fill="#4f46e5" font-weight="bold">9 of 12</text>
  <rect x="32" y="108" width="146" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="40" y="125" font-size="11" fill="#b45309" font-weight="bold">P2</text>
  <text x="40" y="141" font-size="11" fill="#1f2937">License was at home. I</text>
  <text x="40" y="155" font-size="11" fill="#1f2937">was at the truck.</text>
  <rect x="32" y="192" width="146" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="40" y="209" font-size="11" fill="#b45309" font-weight="bold">P5</text>
  <text x="40" y="225" font-size="11" fill="#1f2937">Needed my partners'</text>
  <text x="40" y="239" font-size="11" fill="#1f2937">birth dates. Emailed</text>
  <text x="40" y="253" font-size="11" fill="#1f2937">them and waited.</text>
  <rect x="32" y="276" width="146" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="40" y="293" font-size="11" fill="#b45309" font-weight="bold">P9</text>
  <text x="40" y="309" font-size="11" fill="#1f2937">Didn't know my tax ID by</text>
  <text x="40" y="323" font-size="11" fill="#1f2937">heart.</text>
  <rect x="194" y="44" width="162" height="318" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="204" y="64" font-size="12" fill="#1f2937" font-weight="bold">“I lost my place”</text>
  <text x="204" y="98" font-size="11" fill="#4f46e5" font-weight="bold">6 of 12</text>
  <rect x="202" y="108" width="146" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="210" y="125" font-size="11" fill="#b45309" font-weight="bold">P1</text>
  <text x="210" y="141" font-size="11" fill="#1f2937">Came back that night.</text>
  <text x="210" y="155" font-size="11" fill="#1f2937">Logged out, form blank.</text>
  <rect x="202" y="192" width="146" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="210" y="209" font-size="11" fill="#b45309" font-weight="bold">P6</text>
  <text x="210" y="225" font-size="11" fill="#1f2937">Typed my address three</text>
  <text x="210" y="239" font-size="11" fill="#1f2937">times in the end.</text>
  <rect x="202" y="276" width="146" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="210" y="293" font-size="11" fill="#b45309" font-weight="bold">P8</text>
  <text x="210" y="309" font-size="11" fill="#1f2937">Couldn't see where to</text>
  <text x="210" y="323" font-size="11" fill="#1f2937">pick it up again.</text>
  <rect x="364" y="44" width="162" height="318" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="374" y="64" font-size="12" fill="#1f2937" font-weight="bold">“I didn't know what it</text>
  <text x="374" y="79" font-size="12" fill="#1f2937" font-weight="bold">meant”</text>
  <text x="374" y="98" font-size="11" fill="#4f46e5" font-weight="bold">7 of 12</text>
  <rect x="372" y="108" width="146" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="380" y="125" font-size="11" fill="#b45309" font-weight="bold">P1</text>
  <text x="380" y="141" font-size="11" fill="#1f2937">Beneficial owner? I'm</text>
  <text x="380" y="155" font-size="11" fill="#1f2937">just the owner.</text>
  <rect x="372" y="192" width="146" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="380" y="209" font-size="11" fill="#b45309" font-weight="bold">P4</text>
  <text x="380" y="225" font-size="11" fill="#1f2937">Am I a sole proprietor or</text>
  <text x="380" y="239" font-size="11" fill="#1f2937">an LLC?</text>
  <rect x="372" y="276" width="146" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="380" y="293" font-size="11" fill="#b45309" font-weight="bold">P8</text>
  <text x="380" y="309" font-size="11" fill="#1f2937">Is my wife an owner if</text>
  <text x="380" y="323" font-size="11" fill="#1f2937">she's on the lease?</text>
  <rect x="534" y="44" width="162" height="318" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="544" y="64" font-size="12" fill="#1f2937" font-weight="bold">“It said no and not why”</text>
  <text x="544" y="98" font-size="11" fill="#4f46e5" font-weight="bold">4 of 8 who uploaded</text>
  <rect x="542" y="108" width="146" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="550" y="125" font-size="11" fill="#b45309" font-weight="bold">P3</text>
  <text x="550" y="141" font-size="11" fill="#1f2937">Document invalid, twice.</text>
  <text x="550" y="155" font-size="11" fill="#1f2937">Invalid how?</text>
  <rect x="542" y="192" width="146" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="550" y="209" font-size="11" fill="#b45309" font-weight="bold">P6</text>
  <text x="550" y="225" font-size="11" fill="#1f2937">The photo looked fine to</text>
  <text x="550" y="239" font-size="11" fill="#1f2937">me.</text>
  <rect x="542" y="276" width="146" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="550" y="293" font-size="11" fill="#b45309" font-weight="bold">P11</text>
  <text x="550" y="309" font-size="11" fill="#1f2937">Support told me it was</text>
  <text x="550" y="323" font-size="11" fill="#1f2937">the wrong page.</text>
  <rect x="24" y="372" width="672" height="86" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="36" y="392" font-size="12" fill="#1f2937" font-weight="bold">Parked: true, but not a pattern</text>
  <rect x="36" y="402" width="208" height="46" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="44" y="419" font-size="11" fill="#b45309" font-weight="bold">P5</text>
  <text x="74" y="419" font-size="11" fill="#1f2937">I'd pay someone to do this for</text>
  <text x="74" y="433" font-size="11" fill="#1f2937">me. (a prediction)</text>
  <rect x="256" y="402" width="208" height="46" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="264" y="419" font-size="11" fill="#b45309" font-weight="bold">P10</text>
  <text x="294" y="419" font-size="11" fill="#1f2937">It was fine. One sitting. (no</text>
  <text x="294" y="433" font-size="11" fill="#1f2937">trouble)</text>
  <rect x="476" y="402" width="208" height="46" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="484" y="419" font-size="11" fill="#b45309" font-weight="bold">P12</text>
  <text x="514" y="419" font-size="11" fill="#1f2937">My bank's form was worse. (a</text>
  <text x="514" y="433" font-size="11" fill="#1f2937">comparison)</text>
</svg>
