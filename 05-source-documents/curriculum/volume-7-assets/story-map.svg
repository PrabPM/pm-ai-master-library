<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Story map that slices onboarding work into releases</title>
  <rect x="0" y="0" width="720" height="372" rx="6" fill="#ffffff"/>
  <text x="24" y="26" font-size="14" fill="#1f2937" font-weight="bold">Story map: the merchant's steps across, releases down</text>
  <text x="24" y="62" font-size="12" fill="#1f2937" font-weight="bold">Backbone</text>
  <rect x="126" y="42" width="110" height="34" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="181.0" y="64" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Get ready</text>
  <rect x="242" y="42" width="110" height="34" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="297.0" y="64" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Business details</text>
  <rect x="358" y="42" width="110" height="34" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="413.0" y="64" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Name owners</text>
  <rect x="474" y="42" width="110" height="34" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="529.0" y="64" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Prove it</text>
  <rect x="590" y="42" width="110" height="34" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="645.0" y="64" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">Get approved</text>
  <line x1="24" y1="85" x2="696" y2="85" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="24" y="108" font-size="12" fill="#15803d" font-weight="bold">Release 1</text>
  <text x="24" y="124" font-size="11" fill="#6b7280">Come back and</text>
  <text x="24" y="138" font-size="11" fill="#6b7280">finish</text>
  <rect x="126" y="92" width="110" height="66" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="134" y="110" font-size="11" fill="#1f2937">See a list of what I</text>
  <text x="134" y="124" font-size="11" fill="#1f2937">will need</text>
  <rect x="242" y="92" width="110" height="66" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="250" y="110" font-size="11" fill="#1f2937">Progress saves</text>
  <text x="250" y="124" font-size="11" fill="#1f2937">as I type</text>
  <rect x="358" y="92" width="110" height="66" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="366" y="110" font-size="11" fill="#1f2937">Get a link to pick</text>
  <text x="366" y="124" font-size="11" fill="#1f2937">up where I</text>
  <text x="366" y="138" font-size="11" fill="#1f2937">stopped</text>
  <rect x="474" y="92" width="110" height="66" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="482" y="110" font-size="11" fill="#1f2937">Upload later, from</text>
  <text x="482" y="124" font-size="11" fill="#1f2937">the link</text>
  <line x1="24" y1="165" x2="696" y2="165" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="24" y="188" font-size="12" fill="#4f46e5" font-weight="bold">Release 2</text>
  <text x="24" y="204" font-size="11" fill="#6b7280">Understand the</text>
  <text x="24" y="218" font-size="11" fill="#6b7280">questions</text>
  <rect x="242" y="172" width="110" height="66" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="250" y="190" font-size="11" fill="#1f2937">Choose a</text>
  <text x="250" y="204" font-size="11" fill="#1f2937">business type</text>
  <text x="250" y="218" font-size="11" fill="#1f2937">from examples</text>
  <rect x="358" y="172" width="110" height="66" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="366" y="190" font-size="11" fill="#1f2937">See who counts</text>
  <text x="366" y="204" font-size="11" fill="#1f2937">as an owner, in</text>
  <text x="366" y="218" font-size="11" fill="#1f2937">plain words</text>
  <rect x="474" y="172" width="110" height="66" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="482" y="190" font-size="11" fill="#1f2937">See which</text>
  <text x="482" y="204" font-size="11" fill="#1f2937">documents count,</text>
  <text x="482" y="218" font-size="11" fill="#1f2937">with pictures</text>
  <line x1="24" y1="245" x2="696" y2="245" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="24" y="268" font-size="12" fill="#b45309" font-weight="bold">Release 3</text>
  <text x="24" y="284" font-size="11" fill="#6b7280">Fix a rejected</text>
  <text x="24" y="298" font-size="11" fill="#6b7280">document</text>
  <rect x="474" y="252" width="110" height="66" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="482" y="270" font-size="11" fill="#1f2937">Be told exactly</text>
  <text x="482" y="284" font-size="11" fill="#1f2937">why a photo was</text>
  <text x="482" y="298" font-size="11" fill="#1f2937">rejected</text>
  <rect x="590" y="252" width="110" height="66" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="598" y="270" font-size="11" fill="#1f2937">See where my</text>
  <text x="598" y="284" font-size="11" fill="#1f2937">application stands</text>
  <text x="24" y="340" font-size="11" fill="#6b7280">Read across a slice: each release is a thin version of the whole journey that a merchant could use from start to finish.</text>
</svg>
