<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A funnel beside PayFlow's invoice growth loop</title>
  <rect x="0" y="0" width="720" height="372" rx="6" fill="#ffffff"/>
  <rect x="24" y="20" width="262" height="332" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="46" font-size="14" fill="#1f2937" font-weight="bold">A funnel</text>
  <text x="38" y="64" font-size="11" fill="#6b7280">People go in at the top. Fewer</text>
  <text x="38" y="79" font-size="11" fill="#6b7280">come out at the bottom.</text>
  <rect x="42.0" y="96" width="226" height="34" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="155" y="118" font-size="12" fill="#1f2937" text-anchor="middle">Acquisition</text>
  <rect x="57.0" y="138" width="196" height="34" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="155" y="160" font-size="12" fill="#1f2937" text-anchor="middle">Activation</text>
  <rect x="72.0" y="180" width="166" height="34" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="155" y="202" font-size="12" fill="#1f2937" text-anchor="middle">Retention</text>
  <rect x="87.0" y="222" width="136" height="34" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="155" y="244" font-size="12" fill="#1f2937" text-anchor="middle">Referral</text>
  <rect x="102.0" y="264" width="106" height="34" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="155" y="286" font-size="12" fill="#1f2937" text-anchor="middle">Revenue</text>
  <text x="155" y="326" font-size="11" fill="#6b7280" text-anchor="middle">To grow, you must pour more in.</text>
  <rect x="306" y="20" width="390" height="332" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="320" y="46" font-size="14" fill="#1f2937" font-weight="bold">A growth loop: PayFlow invoices</text>
  <text x="320" y="64" font-size="11" fill="#6b7280">The output of one turn is the input of the next.</text>
  <rect x="320" y="86" width="164" height="76" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="330" y="108" font-size="12" fill="#1f2937" font-weight="bold">1  Merchant activates</text>
  <text x="330" y="127" font-size="11" fill="#1f2937">It takes its first live payment.</text>
  <rect x="518" y="86" width="164" height="76" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="528" y="108" font-size="12" fill="#1f2937" font-weight="bold">2  It sends invoices</text>
  <text x="528" y="127" font-size="11" fill="#1f2937">To 12 businesses that are</text>
  <text x="528" y="142" font-size="11" fill="#1f2937">not on PayFlow.</text>
  <rect x="518" y="232" width="164" height="76" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="528" y="254" font-size="12" fill="#1f2937" font-weight="bold">3  Payers sign up</text>
  <text x="528" y="273" font-size="11" fill="#1f2937">3% follow the link on the</text>
  <text x="528" y="288" font-size="11" fill="#1f2937">paid invoice.</text>
  <rect x="320" y="232" width="164" height="76" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="330" y="254" font-size="12" fill="#1f2937" font-weight="bold">4  They activate</text>
  <text x="330" y="273" font-size="11" fill="#1f2937">55% take a live payment.</text>
  <text x="330" y="288" font-size="11" fill="#1f2937">Back to step 1.</text>
  <line x1="486" y1="124" x2="514" y2="124" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="514.0,124.0 507.1,128.1 507.1,119.9" fill="#4f46e5"/>
  <line x1="640" y1="164" x2="640" y2="228" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="640.0,228.0 635.9,221.1 644.1,221.1" fill="#4f46e5"/>
  <line x1="516" y1="270" x2="488" y2="270" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="488.0,270.0 494.9,265.9 494.9,274.1" fill="#4f46e5"/>
  <line x1="362" y1="230" x2="362" y2="166" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="362.0,166.0 366.1,172.9 357.9,172.9" fill="#4f46e5"/>
  <rect x="441" y="176" width="120" height="44" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="501" y="194" font-size="11" fill="#1f2937" text-anchor="middle">12 x 3% x 55%</text>
  <text x="501" y="211" font-size="12" fill="#4f46e5" text-anchor="middle" font-weight="bold">K = 0.20 per turn</text>
  <text x="501" y="334" font-size="11" fill="#6b7280" text-anchor="middle">100 new merchants bring about 20 more, who bring 4 more.</text>
</svg>
