<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Two retention curves: one flattens near 61 percent, one decays to zero</title>
  <rect x="0" y="0" width="720" height="356" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">Share of a cohort still active, by months since first use</text>
  <text x="62" y="282.0" font-size="11" fill="#6b7280" text-anchor="end">0%</text>
  <line x1="70" y1="221.5" x2="590" y2="221.5" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="62" y="225.5" font-size="11" fill="#6b7280" text-anchor="end">25%</text>
  <line x1="70" y1="165.0" x2="590" y2="165.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="62" y="169.0" font-size="11" fill="#6b7280" text-anchor="end">50%</text>
  <line x1="70" y1="108.5" x2="590" y2="108.5" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="62" y="112.5" font-size="11" fill="#6b7280" text-anchor="end">75%</text>
  <line x1="70" y1="52.0" x2="590" y2="52.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="62" y="56.0" font-size="11" fill="#6b7280" text-anchor="end">100%</text>
  <line x1="70.0" y1="278" x2="70.0" y2="283" stroke="#6b7280" stroke-width="1.5"/>
  <text x="70.0" y="297" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
  <line x1="135.0" y1="278" x2="135.0" y2="283" stroke="#6b7280" stroke-width="1.5"/>
  <text x="135.0" y="297" font-size="11" fill="#6b7280" text-anchor="middle">1</text>
  <line x1="200.0" y1="278" x2="200.0" y2="283" stroke="#6b7280" stroke-width="1.5"/>
  <text x="200.0" y="297" font-size="11" fill="#6b7280" text-anchor="middle">2</text>
  <line x1="265.0" y1="278" x2="265.0" y2="283" stroke="#6b7280" stroke-width="1.5"/>
  <text x="265.0" y="297" font-size="11" fill="#6b7280" text-anchor="middle">3</text>
  <line x1="330.0" y1="278" x2="330.0" y2="283" stroke="#6b7280" stroke-width="1.5"/>
  <text x="330.0" y="297" font-size="11" fill="#6b7280" text-anchor="middle">4</text>
  <line x1="395.0" y1="278" x2="395.0" y2="283" stroke="#6b7280" stroke-width="1.5"/>
  <text x="395.0" y="297" font-size="11" fill="#6b7280" text-anchor="middle">5</text>
  <line x1="460.0" y1="278" x2="460.0" y2="283" stroke="#6b7280" stroke-width="1.5"/>
  <text x="460.0" y="297" font-size="11" fill="#6b7280" text-anchor="middle">6</text>
  <line x1="525.0" y1="278" x2="525.0" y2="283" stroke="#6b7280" stroke-width="1.5"/>
  <text x="525.0" y="297" font-size="11" fill="#6b7280" text-anchor="middle">7</text>
  <line x1="590.0" y1="278" x2="590.0" y2="283" stroke="#6b7280" stroke-width="1.5"/>
  <text x="590.0" y="297" font-size="11" fill="#6b7280" text-anchor="middle">8</text>
  <line x1="70" y1="278" x2="590" y2="278" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="70" y1="52" x2="70" y2="278" stroke="#6b7280" stroke-width="1.5"/>
  <text x="330.0" y="316" font-size="12" fill="#1f2937" text-anchor="middle">Months since first use</text>
  <path d="M70.0 52.0 L135.0 96.0 L200.0 114.6 L265.0 125.6 L330.0 132.6 L395.0 136.7 L460.0 139.0 L525.0 140.4 L590.0 140.7" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="70.0" cy="52.0" r="3.5" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="135.0" cy="96.0" r="3.5" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="200.0" cy="114.6" r="3.5" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="265.0" cy="125.6" r="3.5" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="330.0" cy="132.6" r="3.5" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="395.0" cy="136.7" r="3.5" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="460.0" cy="139.0" r="3.5" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="525.0" cy="140.4" r="3.5" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="590.0" cy="140.7" r="3.5" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <path d="M70.0 52.0 L135.0 153.7 L200.0 192.1 L265.0 214.7 L330.0 230.5 L395.0 241.8 L460.0 250.9 L525.0 257.7 L590.0 262.2" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="70.0" cy="52.0" r="3.5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="135.0" cy="153.7" r="3.5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="200.0" cy="192.1" r="3.5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="265.0" cy="214.7" r="3.5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="330.0" cy="230.5" r="3.5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="395.0" cy="241.8" r="3.5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="460.0" cy="250.9" r="3.5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="525.0" cy="257.7" r="3.5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="590.0" cy="262.2" r="3.5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="602" y="132.7" font-size="12" fill="#15803d" font-weight="bold">Payments</text>
  <text x="602" y="148.7" font-size="11" fill="#15803d">flattens near 61%</text>
  <text x="602" y="240.2" font-size="12" fill="#b91c1c" font-weight="bold">Assist</text>
  <text x="602" y="256.2" font-size="11" fill="#b91c1c">still falling</text>
  <text x="602" y="271.2" font-size="11" fill="#b91c1c">at 7%</text>
  <text x="24" y="342" font-size="12" fill="#6b7280">A curve that flattens means some people found lasting value. A curve that keeps falling means nobody did.</text>
</svg>
