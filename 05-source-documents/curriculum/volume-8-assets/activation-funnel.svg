<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Activation funnel bar chart comparing August and September sign-ups</title>
  <rect x="0" y="0" width="720" height="356" rx="6" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#1f2937" font-weight="bold">Share of sign-ups reaching each step within 14 days</text>
  <text x="52" y="276.0" font-size="11" fill="#6b7280" text-anchor="end">0%</text>
  <line x1="60" y1="219.5" x2="696" y2="219.5" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="52" y="223.5" font-size="11" fill="#6b7280" text-anchor="end">25%</text>
  <line x1="60" y1="167.0" x2="696" y2="167.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="52" y="171.0" font-size="11" fill="#6b7280" text-anchor="end">50%</text>
  <line x1="60" y1="114.5" x2="696" y2="114.5" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="52" y="118.5" font-size="11" fill="#6b7280" text-anchor="end">75%</text>
  <line x1="60" y1="62.0" x2="696" y2="62.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="52" y="66.0" font-size="11" fill="#6b7280" text-anchor="end">100%</text>
  <line x1="60" y1="272" x2="696" y2="272" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="60" y1="62" x2="60" y2="272" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="76.6" y="62.0" width="44" height="210.0" rx="6" fill="#cbd5e1" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="126.6" y="62.0" width="44" height="210.0" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="98.6" y="56.0" font-size="11" fill="#6b7280" text-anchor="middle">100%</text>
  <text x="148.6" y="56.0" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">100%</text>
  <text x="123.6" y="292" font-size="11" fill="#1f2937" text-anchor="middle">Signed up</text>
  <rect x="203.8" y="91.4" width="44" height="180.6" rx="6" fill="#cbd5e1" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="253.8" y="99.8" width="44" height="172.2" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="225.8" y="85.4" font-size="11" fill="#6b7280" text-anchor="middle">86%</text>
  <text x="275.8" y="93.8" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">82%</text>
  <text x="250.8" y="292" font-size="11" fill="#1f2937" text-anchor="middle">Business verified</text>
  <rect x="331.0" y="110.3" width="44" height="161.7" rx="6" fill="#cbd5e1" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="381.0" y="127.1" width="44" height="144.9" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="353.0" y="104.3" font-size="11" fill="#6b7280" text-anchor="middle">77%</text>
  <text x="403.0" y="121.1" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">69%</text>
  <text x="378.0" y="292" font-size="11" fill="#1f2937" text-anchor="middle">Bank connected</text>
  <rect x="458.2" y="129.2" width="44" height="142.8" rx="6" fill="#cbd5e1" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="508.2" y="143.9" width="44" height="128.1" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="480.2" y="123.19999999999999" font-size="11" fill="#6b7280" text-anchor="middle">68%</text>
  <text x="530.2" y="137.9" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">61%</text>
  <text x="505.2" y="292" font-size="11" fill="#1f2937" text-anchor="middle">Test payment</text>
  <rect x="585.4" y="141.8" width="44" height="130.2" rx="6" fill="#cbd5e1" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="635.4" y="156.5" width="44" height="115.5" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="607.4" y="135.8" font-size="11" fill="#6b7280" text-anchor="middle">62%</text>
  <text x="657.4" y="150.5" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="bold">55%</text>
  <text x="632.4" y="292" font-size="11" fill="#1f2937" text-anchor="middle">First live payment</text>
  <text x="250.8" y="310" font-size="11" fill="#b45309" text-anchor="middle">86% -&gt; 82% of sign-ups</text>
  <text x="378.0" y="310" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold">90% -&gt; 84% of verified</text>
  <rect x="476" y="40" width="14" height="14" rx="6" fill="#cbd5e1" stroke="#6b7280" stroke-width="1.5"/>
  <text x="496" y="52" font-size="11" fill="#6b7280">August (7,000)</text>
  <rect x="590" y="40" width="14" height="14" rx="6" fill="#4f46e5" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="610" y="52" font-size="11" fill="#4f46e5">September (8,000)</text>
  <text x="24" y="340" font-size="12" fill="#6b7280">Two steps got worse: verification (low-intent sign-ups) and connecting a bank (a real break).</text>
</svg>
