<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Experiment readout card for the guided setup test</title>
  <rect x="0" y="0" width="720" height="404" rx="6" fill="#ffffff"/>
  <rect x="24" y="16" width="672" height="372" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="42" y="46" font-size="14" fill="#1f2937" font-weight="bold">Readout: guided setup checklist</text>
  <text x="42" y="66" font-size="11" fill="#6b7280">Merchant-level 50/50 test. 35 days of enrollment, then 14 days for the last sign-ups to mature.</text>
  <rect x="556" y="30" width="122" height="22" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="617.0" y="45" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold">Ship with a fix</text>
  <text x="42" y="104" font-size="11" fill="#6b7280">Metric</text>
  <text x="330" y="104" font-size="11" fill="#6b7280">Difference, treatment minus control (points), with 95% CI</text>
  <text x="42" y="130" font-size="12" fill="#1f2937" font-weight="bold">Activated in 14 days</text>
  <text x="42" y="147" font-size="11" fill="#6b7280">Primary. 55.0% -&gt; 58.1%, p = 0.003</text>
  <line x1="330" y1="134" x2="660" y2="134" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="457.9" y="126" width="165.0" height="16" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="540.4" cy="134" r="5" fill="#15803d" stroke="#15803d" stroke-width="1.5"/>
  <text x="630.9" y="138" font-size="11" fill="#15803d" font-weight="bold">+3.1</text>
  <text x="42" y="184" font-size="12" fill="#1f2937" font-weight="bold">First payout failed</text>
  <text x="42" y="201" font-size="11" fill="#6b7280">Guardrail. 1.9% -&gt; 3.1%, p = 0.006</text>
  <line x1="330" y1="188" x2="660" y2="188" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="424.9" y="180" width="70.1" height="16" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="462.0" cy="188" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="503.0" y="192" font-size="11" fill="#b91c1c" font-weight="bold">+1.2</text>
  <line x1="412.5" y1="116" x2="412.5" y2="216" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="330.0" y="234" font-size="11" fill="#6b7280" text-anchor="middle">-2</text>
  <text x="412.5" y="234" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
  <text x="495.0" y="234" font-size="11" fill="#6b7280" text-anchor="middle">+2</text>
  <text x="577.5" y="234" font-size="11" fill="#6b7280" text-anchor="middle">+4</text>
  <text x="660.0" y="234" font-size="11" fill="#6b7280" text-anchor="middle">+6</text>
  <line x1="42" y1="250" x2="678" y2="250" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="274" font-size="12" fill="#1f2937" font-weight="bold">Checks before reading</text>
  <path d="M46 292 l3 3 l6 -7" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="296" font-size="11" fill="#1f2937">Split 4,660 vs 4,672: no sample ratio mismatch (p = 0.90)</text>
  <path d="M46 310 l3 3 l6 -7" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="314" font-size="11" fill="#1f2937">Ran the planned length. Nobody stopped it early.</text>
  <path d="M46 328 l3 3 l6 -7" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="332" font-size="11" fill="#1f2937">One primary metric, chosen before launch.</text>
  <rect x="408" y="262" width="270" height="110" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="422" y="284" font-size="12" fill="#b45309" font-weight="bold">Decision</text>
  <text x="422" y="304" font-size="11" fill="#1f2937">Activation is up by 1 to 5 points. Payout failures</text>
  <text x="422" y="319" font-size="11" fill="#1f2937">rose because some merchants had no bank on</text>
  <text x="422" y="334" font-size="11" fill="#1f2937">file. Add a bank prompt before the first payout,</text>
  <text x="422" y="349" font-size="11" fill="#1f2937">then ship.</text>
</svg>
